<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工廠機臺預約系統 v0.4 (Supabase 雲端獨立版)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SortableJS CDN（用於助教控制面板拖曳調整排隊順序）-->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #0f172a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 機台狀態卡片自訂動態背景色 (Format Rules) */
    .status-idle {
      background-color: #E8F5E9 !important;
      border: 1.5px solid #a5d6a7 !important;
    }
    .status-busy {
      background-color: #FFEBEE !important;
      border: 1.5px solid #ef9a9a !important;
    }
    .status-waiting {
      background-color: #FFF8E1 !important;
      border: 1.5px solid #ffe082 !important;
    }

    /* 電視看板跑馬燈 (TvMarquee) */
    @keyframes tvMarqueeSeamless {
      0%, 20% {
        transform: translateX(0%);
      }
      80%, 100% {
        transform: translateX(-50%);
      }
    }

    .tv-marquee-container {
      overflow: hidden;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      line-height: 1.15;
    }

    .tv-marquee-container.is-overflow {
      /* 兩側邊緣柔和微遮罩，左右各 10px 漸層淡出，讓文字進出邊界時自然柔和不生硬 */
      mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
    }

    .tv-marquee-static {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .tv-marquee-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation-name: tvMarqueeSeamless;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .tv-marquee-item {
      display: inline-block;
      white-space: nowrap;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      letter-spacing: inherit;
    }

    .tv-marquee-spacer {
      display: inline-block;
      width: 1.2em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

    // ============================================================
    // 1. Supabase 連線設定
    // ============================================================
    const SUPABASE_URL = 'https://svksjbgkjnkonvntpbha.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6AavmvJ1L-BFXXisShqFvA_ikn_mnSY';
    const AUTH_STORAGE_KEY = 'factory_v04_logged_in_email';
    const supabaseClient = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // NOTE: reservations 表目前缺少 advance_offered_at / notes 欄位。
    //       程式多處更新預約時（叫號、保留時段…）會一併寫入這兩欄，資料庫會「整筆更新被拒絕」，
    //       且 Supabase 只回傳 error、不會丟例外，結果預約狀態永遠停在「排隊中」、看板不會變橘色。
    //       因此在寫入層統一略過資料庫沒有的欄位；refreshData 偵測到欄位存在時會自動恢復寫入。
    const MISSING_RESERVATION_COLUMNS = new Set(['advance_offered_at', 'notes']);

    function stripMissingReservationColumns(values) {
      if (MISSING_RESERVATION_COLUMNS.size === 0) return values;
      const strip = (row) => {
        if (!row || typeof row !== 'object') return row;
        const copy = { ...row };
        MISSING_RESERVATION_COLUMNS.forEach(col => { delete copy[col]; });
        return copy;
      };
      return Array.isArray(values) ? values.map(strip) : strip(values);
    }

    if (supabaseClient) {
      const originalFrom = supabaseClient.from.bind(supabaseClient);
      supabaseClient.from = (table) => {
        const builder = originalFrom(table);
        if (table === 'reservations') {
          const originalUpdate = builder.update.bind(builder);
          const originalInsert = builder.insert.bind(builder);
          builder.update = (values, options) => originalUpdate(stripMissingReservationColumns(values), options);
          builder.insert = (values, options) => originalInsert(stripMissingReservationColumns(values), options);
        }
        return builder;
      };
    }

    // ============================================================
    // 1b. 通知機制說明
    // ============================================================
    // NOTE: 已停用 Gmail / EmailJS 寄信，僅保留 App 本身的通知
    //       （瀏覽器推播 + App 內通知清單），不再依賴第三方寄信額度。

    // 已通知的提醒 ID 集合（防止重複推播，存於 localStorage）
    const NOTIFIED_REMINDERS_KEY = 'wc_notified_reminders_v1';

    // HACK: system_settings 表沒有 course_paused 欄位，且 App 金鑰無法修改資料表結構，
    //       因此另建一列 id='COURSE_PAUSE'，以 manual_course_start_time 存「暫停開始時間」（null=未暫停）。
    //       日後若在 Supabase 新增專用欄位，應改回正式欄位並刪除此列。
    const COURSE_PAUSE_ROW_ID = 'COURSE_PAUSE';

    // ============================================================
    // 1c. 通知工具函式（瀏覽器推播）
    // ============================================================

    /**
     * 請求瀏覽器通知授權
     * 於使用者登入後呼叫，讓系統可在叫號時推播手機/桌面通知
     */
    async function requestNotificationPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    /**
     * 發送瀏覽器系統推播通知（App 開著或在背景分頁時均可收到）
     * @param {string} title - 通知標題
     * @param {string} body  - 通知內容
     * @param {string} tag   - 通知唯一標籤（相同 tag 會取代舊通知，避免重複）
     */
    function sendBrowserNotification(title, body, tag) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      try {
        new Notification(title, {
          body,
          tag,
          icon: 'https://woodcraft-reservation.vercel.app/favicon.ico',
          requireInteraction: true // 通知不會自動消失，需要使用者手動關閉
        });
      } catch (e) {
        console.warn('Browser notification failed:', e);
      }
    }

    /**
     * 發送叫號通知（瀏覽器推播）
     * 當前一位同學結束使用，系統自動對下一位被叫號的同學發送通知
     */
    async function sendQueueCallNotification({ studentNames, machineName, startTime, endTime, durationMinutes, toEmail }) {
      const title = `【輪到您了！🎟️】${machineName}`;
      const body = `${studentNames}，您的機台已可使用！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n請於 3 分鐘內前往工廠報到，逾時將視為放棄。`;
      const tag = `queue-call-${toEmail}-${Date.now()}`;

      sendBrowserNotification(title, body, tag);
    }

    /**
     * 發送時段前 5 分鐘提醒通知（瀏覽器推播）
     * 由前端輪詢機制每 30 秒掃描一次即將開始的預約
     */
    async function sendReminderNotification({ studentNames, machineName, startTime, endTime, durationMinutes, toEmail, reservationId }) {
      // 防止重複推播
      const notified = JSON.parse(localStorage.getItem(NOTIFIED_REMINDERS_KEY) || '{}');
      const notifKey = `${reservationId}_5min`;
      if (notified[notifKey]) return;

      const title = `【即將開始！⏰】${machineName}`;
      const body = `${studentNames}，您的機台預約 5 分鐘後開始！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n請準備前往工廠！`;
      const tag = `reminder-${reservationId}`;

      sendBrowserNotification(title, body, tag);

      // 記錄已通知，避免重複
      notified[notifKey] = Date.now();
      localStorage.setItem(NOTIFIED_REMINDERS_KEY, JSON.stringify(notified));
    }

    /**
     * 發送小組預約 / 排隊成立通知 (包含發起人與所有被加入的小組成員)
     */
    async function sendGroupReservationNotification({
      recipientName,
      isCreator,
      creatorName,
      machineName,
      type,
      startTime,
      endTime,
      durationMinutes,
      toEmail,
      allStudentNames
    }) {
      const isGroup = allStudentNames && allStudentNames.length > 1;
      const groupInfo = isGroup ? `（同組成員：${allStudentNames.join('、')}）` : '';

      let title, body, subject;
      if (isCreator) {
        title = type === '時段預約' ? `【預約成功！📅】${machineName}` : `【排隊成功！🎟️】${machineName}`;
        body = `親愛的 ${recipientName}：您已成功建立【${machineName}】的${type}！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n${groupInfo}`;
        subject = `【${type}成功通知】您已建立【${machineName}】預約`;
      } else {
        title = type === '時段預約' ? `【您已被加入預約！👥】${machineName}` : `【您已被加入排隊！👥】${machineName}`;
        body = `親愛的 ${recipientName}：${creatorName} 同學已將您加入【${machineName}】的${type}！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n${groupInfo}`;
        subject = `【小組${type}通知】${creatorName} 同學已將您加入【${machineName}】`;
      }

      const tag = `group-res-${toEmail || recipientName}-${Date.now()}`;
      sendBrowserNotification(title, body, tag);

      return {
        id: `N_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
        timestamp: new Date().toLocaleTimeString('zh-TW'),
        recipientName,
        machineName,
        subject,
        body
      };
    }

    // ============================================================
    // 1d. 老師與助教 (管理員) 權限名單
    // ============================================================
    // NOTE: 目前指定 supersamuel0106@gmail.com 為管理員；
    //       未來若取得其他老師或助教的 Email，直接在此陣列加入即可！
    const ADMIN_EMAILS = [
      'supersamuel0106@gmail.com',
      'aj115.0827@gmail.com',
      'chenpinhan062223@gmail.com',
      'redalice9174@gmail.com'
    ];

    function isTeacherOrTA(user) {
      if (!user) return false;
      if (user.role === 'admin' || user.role === 'teacher' || user.role === 'ta') return true;
      if (user.mail && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.mail.trim().toLowerCase())) return true;
      return false;
    }

    // ============================================================
    // 2. 核心計算公式 (Domain Rules)
    // ============================================================
    function calculateUsageMinutes(studentCount) {
      if (studentCount <= 0) return 0;
      return 20 + (studentCount - 1) * 10;
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [hh, mm] = timeStr.split(':').map(Number);
      return (hh || 0) * 60 + (mm || 0);
    }

    function minutesToTime(minutes) {
      const hh = Math.floor(minutes / 60).toString().padStart(2, '0');
      const mm = (minutes % 60).toString().padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function formatDateTime(d) {
      if (!d) return '';
      const date = new Date(d);
      const yyyy = date.getFullYear();
      const mm = (date.getMonth() + 1).toString().padStart(2, '0');
      const dd = date.getDate().toString().padStart(2, '0');
      const hh = date.getHours().toString().padStart(2, '0');
      const min = date.getMinutes().toString().padStart(2, '0');
      return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
    }

    // 計算有效課程時間 (自動固定週三 09:00~12:00 vs 手動模式)
    function getEffectiveCourseTimes(settings) {
      const isAuto = !settings || settings.control_mode === '自動' || settings.controlMode === '自動';
      const now = new Date();

      if (isAuto) {
        // 下一個週三 (day 3)
        const currentDay = now.getDay();
        let daysUntilWed = (3 - currentDay + 7) % 7;
        if (daysUntilWed === 0) {
          const todayNoon = new Date(now);
          todayNoon.setHours(12, 0, 0, 0);
          if (now >= todayNoon) daysUntilWed = 7;
        }

        const targetWed = new Date(now);
        targetWed.setDate(now.getDate() + daysUntilWed);

        const start = new Date(targetWed);
        start.setHours(9, 0, 0, 0);

        const end = new Date(targetWed);
        end.setHours(12, 0, 0, 0);

        const openTime = new Date(start.getTime() - 24 * 60 * 60 * 1000);
        return { startTime: start, endTime: end, openBookingTime: openTime, isAuto: true };
      } else {
        const startStr = settings.manual_course_start_time || settings.course_start_time || settings.courseStartTime || now.toISOString();
        const endStr = settings.manual_course_end_time || settings.course_end_time || settings.courseEndTime || now.toISOString();
        const start = new Date(startStr);
        const end = new Date(endStr);
        const openTime = new Date(start.getTime() - 24 * 60 * 60 * 1000);
        return { startTime: start, endTime: end, openBookingTime: openTime, isAuto: false };
      }
    }

    // 判定預約階段
    function getCurrentBookingPhase(settings) {
      const { startTime, endTime, openBookingTime } = getEffectiveCourseTimes(settings);
      const now = new Date();

      if (now >= endTime) {
        return {
          phase: 'CLOSED',
          title: '本次課程已結束',
          description: `課程已於 ${formatDateTime(endTime)} 結束。`,
          allowedType: 'NONE',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      if (now >= startTime && now < endTime) {
        return {
          phase: 'QUEUE_ONLY',
          title: '課程進行中（開放現場排隊）',
          description: '課程已開始，目前僅開放「現場排隊」即時排號！',
          allowedType: '現場排隊',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      if (now >= openBookingTime && now < startTime) {
        return {
          phase: 'SLOT_ONLY',
          title: '課程前 24 小時（開放時段預約）',
          description: `距離開課 (${formatDateTime(startTime)}) 不足 24 小時，目前僅開放「時段預約」！`,
          allowedType: '時段預約',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      return {
        phase: 'NOT_OPEN',
        title: '預約尚未開放',
        description: `將於開課前 24 小時（${formatDateTime(openBookingTime)}）正式開放時段預約。`,
        allowedType: 'NONE',
        effectiveStart: startTime,
        effectiveEnd: endTime
      };
    }

    // NOTE: 前一位提早結束在此分鐘數以內，後一位仍可使用到原訂結束時間（多得到一點時間）
    const EARLY_FINISH_BONUS_LIMIT_MINUTES = 10;

    // 已結束或失效的預約狀態集合（不參與衝突與排程佔用計算）
    const INACTIVE_RESERVATION_STATUSES = new Set(['已取消', '已完成', '未報到', '逾時未到']);

    /**
     * 判斷預約紀錄是否仍為有效（尚未完成或取消）
     * @param {Object} r 預約物件
     * @returns {boolean} 是否有效
     */
    function isReservationActive(r) {
      return Boolean(r && !INACTIVE_RESERVATION_STATUSES.has(r.status));
    }

    /**
     * 正規化學生姓名陣列（去除前後空白並過濾空值）
     * @param {Array<string>} students 學生姓名清單
     * @returns {Array<string>} 正規化後的學生姓名陣列
     */
    function normalizeStudentList(students) {
      if (!Array.isArray(students)) return [];
      return students.map(s => (typeof s === 'string' ? s.trim() : '')).filter(Boolean);
    }

    /**
     * 找出單筆預約與目標學生名單重疊的同學姓名
     * NOTE: 以實際參與組員姓名比對為主（包含發起人本人與所有被加入的共同組員），
     *       僅在舊資料無學生姓名時才退回比對建立者信箱，避免助教代操作時誤判。
     * @param {Object} r 既有預約紀錄
     * @param {Set<string>} studentSet 目標學生姓名集合
     * @param {string} userEmail 目標建立者信箱
     * @returns {Array<string>} 重疊的學生姓名清單（若僅信箱命中則回傳 ['預約本人']）
     */
    function getOverlappingStudentNames(r, studentSet, userEmail = '') {
      const rStudents = normalizeStudentList(r?.students);
      const matched = rStudents.filter(s => studentSet.has(s));
      if (matched.length > 0) return matched;
      if (rStudents.length === 0 && userEmail && r?.email && r.email.trim().toLowerCase() === userEmail.trim().toLowerCase()) {
        return ['預約本人'];
      }
      return [];
    }

    /**
     * 計算某筆預約「實際開始使用」時的結束時間
     * NOTE: 規則
     * 1. 準時（或在報到緩衝內稍晚）開始：緩衝時間 + 使用時間總共不能超過原訂結束時間，
     *    因此結束時間 = 原訂結束時間（遲到的部分從使用時間內扣除）
     * 2. 提早開始（前一位提早結束）：只要比原訂開始提早 10 分鐘以內，
     *    仍可使用到原訂結束時間（等於多得到提早的那幾分鐘）
     * 3. 提早超過 10 分鐘（很早就空出），或原訂時段已整段過去：
     *    從現在起算完整使用時長，避免多佔後面同學的時段
     * @param {Object} target 欲開始的預約（startMinutes / endMinutes 為目前排定的原訂時段）
     * @param {number} nowMinutes 目前時間（分鐘）
     * @returns {number} 實際結束時間（分鐘）
     */
    function calculateUsageEndMinutes(target, nowMinutes) {
      const duration = target.durationMinutes || (target.endMinutes - target.startMinutes) || 20;
      const scheduledStart = target.startMinutes;
      const scheduledEnd = target.endMinutes;

      // NOTE: 現場排隊在叫號前的時間只是預估（前面的人超時就會過時），
      // 只有已被叫號（等候報到，時段是叫號當下重算的）才套用原訂結束時間
      if (target.type === '現場排隊' && target.status !== '等候報到') {
        return nowMinutes + duration;
      }

      // 原訂時段已整段過去，沒有可沿用的結束時間
      if (nowMinutes >= scheduledEnd) return nowMinutes + duration;

      // 規則 1：準時或稍晚開始，不得超出原訂結束時間
      if (nowMinutes >= scheduledStart) return scheduledEnd;

      // 規則 2：提早 10 分鐘以內，仍可用到原訂結束時間
      if (scheduledStart - nowMinutes <= EARLY_FINISH_BONUS_LIMIT_MINUTES) return scheduledEnd;

      // 規則 3：提早很多，維持完整時長
      return nowMinutes + duration;
    }

    const WAITING_RESERVATION_STATUSES = ['等候報到', '等候提前確認', '排隊中', '等待中'];

    /**
     * 將資料庫 reservations 資料列統一映射為前端預約物件
     * NOTE: 完整保留 started_at / finished_at / cancelled_at，供多裝置競態防護識別「已開始使用」的預約
     * @param {Object} row Supabase reservations 資料列
     * @returns {Object} 前端預約物件
     */
    function mapReservationRow(row) {
      return {
        id: row.id,
        machineId: row.machine_id,
        machineName: row.machine_name,
        type: row.type,
        students: row.students || [],
        studentCount: row.student_count,
        durationMinutes: row.duration_minutes,
        timeSlotId: row.time_slot_id,
        startMinutes: row.start_minutes,
        endMinutes: row.end_minutes,
        startTimeFormatted: row.start_time_formatted,
        endTimeFormatted: row.end_time_formatted,
        status: row.status,
        email: row.email,
        createdAt: row.created_at,
        calledAt: row.called_at,
        startedAt: row.started_at,
        finishedAt: row.finished_at,
        cancelledAt: row.cancelled_at,
        advanceOfferedAt: row.advance_offered_at,
        notes: row.notes
      };
    }

    /**
     * 判斷預約是否已經處於上機使用中（或已結束/取消），不可再被逾時掃描或隊列重排退回「排隊中」
     * @param {Object} r 預約物件或資料庫資料列
     * @returns {boolean}
     */
    function hasReservationStartedOrInUse(r) {
      if (!r) return false;
      return r.status === '使用中' || r.status === '已完成' || r.status === '已取消';
    }

    /**
     * 判斷預約是否因逾時未報到且後方無候補者，而已釋放機台退回「排隊中」
     * NOTE: 由於資料庫 reservations 表目前缺少 notes 欄位，逾時釋放時會保留原本非空的 called_at
     *       搭配 status === '排隊中' 作為跨裝置持久化標記；若未來補上 notes 欄位亦可相容識別。
     * @param {Object} r 預約物件
     * @returns {boolean}
     */
    function isOverdueReleasedReservation(r) {
      if (!r || r.status !== '排隊中') return false;
      if (typeof r.notes === 'string' && r.notes.includes('報到逾時')) return true;
      return Boolean(r.calledAt || r.called_at || r.startedAt || r.started_at);
    }

    /**
     * 推算所有有效預約目前實際佔用或「準備要使用」的忙碌時間區間
     * NOTE: 解決靜態帳面時間因前人超時、等候報到或提前確認而與實際預計使用時間脫節的問題，
     *       確保將組員加入排隊或推進隊列時，能精準避開每位組員準備使用的所有時段。
     * @param {Array<Object>} reservations 所有預約清單
     * @param {number|null} nowMinutes 當前課程分鐘數（傳入 null 代表靜態帳面檢查，如開課前 24h 時段預約）
     * @returns {Array<{ start: number, end: number, reservation: Object }>} 忙碌區間陣列
     */
    function getEffectiveBusyIntervals(reservations, nowMinutes = null) {
      const activeList = (reservations || []).filter(isReservationActive);
      if (typeof nowMinutes !== 'number') {
        return activeList.map(r => ({
          start: r.startMinutes,
          end: r.endMinutes,
          reservation: r
        }));
      }

      const intervals = [];
      const byMachine = new Map();
      for (const r of activeList) {
        if (!byMachine.has(r.machineId)) byMachine.set(r.machineId, []);
        byMachine.get(r.machineId).push(r);
      }

      for (const [, macRes] of byMachine.entries()) {
        const inUseList = macRes.filter(r => r.status === '使用中');
        const checkinList = macRes.filter(r => r.status === '等候報到' || r.status === '等候提前確認');
        const waitingList = macRes
          .filter(r => r.status !== '使用中' && r.status !== '等候報到' && r.status !== '等候提前確認')
          .sort((a, b) => a.startMinutes - b.startMinutes);

        let machineFreeAt = nowMinutes;

        // 1. 使用中：至少佔用到原訂結束時間或下一分鐘（若前人微幅超時尚未按結束）
        for (const r of inUseList) {
          const start = Math.min(r.startMinutes, nowMinutes);
          const end = Math.max(r.endMinutes, nowMinutes + 1);
          intervals.push({ start, end, reservation: r });
          machineFreeAt = Math.max(machineFreeAt, end);
        }

        // 2. 等候報到 / 等候提前確認：正準備上機使用
        for (const r of checkinList) {
          const effectiveNow = Math.max(nowMinutes, machineFreeAt);
          if (r.status === '等候提前確認') {
            const earlyEnd = calculateUsageEndMinutes(r, effectiveNow);
            intervals.push({ start: effectiveNow, end: earlyEnd, reservation: r });
            intervals.push({ start: r.startMinutes, end: r.endMinutes, reservation: r });
            machineFreeAt = Math.max(machineFreeAt, earlyEnd);
          } else {
            const estEnd = Math.max(r.endMinutes, calculateUsageEndMinutes(r, effectiveNow));
            const start = Math.min(r.startMinutes, effectiveNow);
            intervals.push({ start, end: estEnd, reservation: r });
            machineFreeAt = Math.max(machineFreeAt, estEnd);
          }
        }

        // 3. 排隊中 / 等待中：依序推算預計使用區間
        // 區分「尚未逾時釋放的固定時段預約」與「現場排隊 / 已逾時釋放保留資格的預約」
        const slotIntervalsOnMac = [];
        const fixedSlotWaiters = waitingList.filter(x => x.type === '時段預約' && !isOverdueReleasedReservation(x));
        const rollingQueueWaiters = waitingList.filter(x => !fixedSlotWaiters.includes(x));

        for (const r of fixedSlotWaiters) {
          const dur = r.durationMinutes || Math.max(10, r.endMinutes - r.startMinutes) || 20;
          const estStart = Math.max(r.startMinutes, machineFreeAt);
          const estEnd = r.startMinutes < machineFreeAt ? (estStart + dur) : Math.max(r.endMinutes, estStart + dur);
          const range = { start: Math.min(r.startMinutes, estStart), end: estEnd, reservation: r };
          intervals.push(range);
          slotIntervalsOnMac.push(range);
          if (estStart <= machineFreeAt) {
            machineFreeAt = Math.max(machineFreeAt, estEnd);
          }
        }

        let runningQueueStart = machineFreeAt;
        for (const r of rollingQueueWaiters) {
          const dur = r.durationMinutes || Math.max(10, r.endMinutes - r.startMinutes) || 20;
          const isOverdueReleased = isOverdueReleasedReservation(r);

          let estStart = Math.max(r.startMinutes, runningQueueStart);
          // 避開同機台已排定的固定時段預約
          let bumped = true;
          while (bumped) {
            bumped = false;
            for (const sRange of slotIntervalsOnMac) {
              if (estStart < sRange.end && estStart + dur > sRange.start) {
                estStart = Math.max(estStart, sRange.end);
                bumped = true;
              }
            }
          }
          const estEnd = estStart + dur;
          const rangeStart = (r.startMinutes < estStart && r.endMinutes > nowMinutes) ? r.startMinutes : estStart;
          intervals.push({ start: rangeStart, end: estEnd, reservation: r, isOverdueReleased });
          // 已逾時釋放者在新同學加入同機台排隊時會自動退到後方禮讓，不推高同機台其他未逾時候補者的基準起點
          if (!isOverdueReleased) {
            runningQueueStart = estEnd;
          }
        }
      }

      return intervals;
    }

    // 檢查機台時段是否有衝突
    function hasReservationConflict(reservations, machineId, startMin, durationMin, ignoreId = null, nowMinutes = null) {
      const endMin = startMin + durationMin;
      const busyIntervals = getEffectiveBusyIntervals(reservations, nowMinutes);
      return busyIntervals.some(({ start, end, reservation: r }) => {
        if (r.machineId !== machineId) return false;
        if (r.id === ignoreId) return false;
        return start < endMin && end > startMin;
      });
    }

    /**
     * 檢查學生名單（含本人與所有共同組員）是否有同時段的預約或排隊衝突
     * @param {Array<Object>} reservations 所有預約資料
     * @param {Array<string>} students 學生名單陣列
     * @param {string} userEmail 建立者信箱
     * @param {number} startMin 時段開始分鐘
     * @param {number} durationMin 時長
     * @param {string|null} ignoreId 忽略的預約 ID（通常為自己）
     * @param {string|null} ignoreMachineId 忽略的機台 ID（同機台隊列已由本機台排程控管時傳入）
     * @param {number|null} nowMinutes 當前課程分鐘數（傳入時啟用動態待用時段推算）
     * @returns {Object|undefined} 衝突的預約物件（附帶 _conflictingStudents 與有效起訖時間）
     */
    function findStudentConflict(reservations, students = [], userEmail = '', startMin = 0, durationMin = 0, ignoreId = null, ignoreMachineId = null, nowMinutes = null) {
      const endMin = startMin + durationMin;
      const studentSet = new Set(normalizeStudentList(students));
      const busyIntervals = getEffectiveBusyIntervals(reservations, nowMinutes);

      for (const { start, end, reservation: r, isOverdueReleased } of busyIntervals) {
        if (r.id === ignoreId) continue;
        // 已逾時釋放的彈性保留單會自動隨新排程往後順推，不反過來鎖死其他機台的正常預約或報到
        if (typeof nowMinutes === 'number' && isOverdueReleased) continue;
        // NOTE: 同一機台的前後排隊順序由機台排程本身控管，傳入 ignoreMachineId 時不重複視為跨機台衝突
        if (ignoreMachineId && r.machineId === ignoreMachineId) continue;
        if (!(start < endMin && end > startMin)) continue;

        const matchedNames = getOverlappingStudentNames(r, studentSet, userEmail);
        if (matchedNames.length > 0) {
          return {
            ...r,
            _conflictingStudents: matchedNames,
            _effectiveStart: start,
            _effectiveEnd: end
          };
        }
      }
      return undefined;
    }

    /**
     * 為單筆現場排隊尋找最早的無衝突開始時間
     * NOTE: 同時避開「本機台阻擋時段（前方隊列與時段預約）」與「名單中每位組員在其他機台的忙碌時段」
     * @param {Object} item 欲排程的預約項目
     * @param {number} minStart 最早可開始分鐘數
     * @param {Array<{ start: number, end: number }>} blockingMachineRanges 本機台已佔用區間
     * @param {Array<Object>} allReservations 所有預約清單
     * @param {number} nowMinutes 目前分鐘數
     * @returns {number} 無衝突的最早開始分鐘數
     */
    function findEarliestValidStartForReservation(item, minStart, blockingMachineRanges, allReservations, nowMinutes) {
      const dur = item.durationMinutes || 20;
      const studentSet = new Set(normalizeStudentList(item.students));
      const busyIntervals = getEffectiveBusyIntervals(allReservations, nowMinutes);
      let candStart = minStart;
      const safetyLimit = 24 * 60 + 360;

      while (candStart < safetyLimit) {
        const candEnd = candStart + dur;
        let maxConflictEnd = -1;

        // 1. 檢查本機台前方已排定區間與時段預約
        for (const mRange of (blockingMachineRanges || [])) {
          if (candStart < mRange.end && candEnd > mRange.start) {
            maxConflictEnd = Math.max(maxConflictEnd, mRange.end);
          }
        }

        // 2. 檢查名單內所有組員在其他機台準備使用或使用中的時段
        const itemIsOverdueReleased = isOverdueReleasedReservation(item);
        for (const { start, end, reservation: r, isOverdueReleased } of busyIntervals) {
          if (r.id === item.id) continue;
          if (r.machineId === item.machineId) continue;
          // 正常預約計算時，其他機台已逾時釋放的保留單會自動往後讓開，不阻擋正常預約
          if (!itemIsOverdueReleased && isOverdueReleased) continue;
          if (!(start < candEnd && end > candStart)) continue;

          const matched = getOverlappingStudentNames(r, studentSet, item.email);
          if (matched.length > 0) {
            maxConflictEnd = Math.max(maxConflictEnd, end);
          }
        }

        if (maxConflictEnd === -1) {
          return candStart;
        }
        candStart = Math.max(maxConflictEnd, candStart + 1);
      }

      return candStart;
    }

    /**
     * 判斷某筆預約/排隊「現在」是否可以按開始使用
     * NOTE: 規則
     * 1. 時段預約：必須已到預約開始時間才能開始（逾時仍保留資格者也可報到）
     * 2. 現場排隊：前面沒有人（無人使用中、無更早排序的等候者），且組員無其他機台同時段衝突即可開始
     * 兩者皆不可在機台有其他人使用中時開始
     * @param {Object} target 欲開始的預約
     * @param {Array<Object>} reservations 所有預約資料
     * @param {number} nowMinutes 目前時間（分鐘）
     * @returns {{ canStart: boolean, reason: string }}
     */
    function getStartEligibility(target, reservations, nowMinutes) {
      const WAITING_STATUSES = ['等候報到', '等候提前確認', '排隊中', '等待中'];
      const sameMachine = reservations.filter(r => r.machineId === target.machineId && r.id !== target.id);

      const inUse = sameMachine.find(r => r.status === '使用中');
      if (inUse) {
        return { canStart: false, reason: `機台目前由【${(inUse.students || []).join(', ')}】使用中（預計 ${inUse.endTimeFormatted} 結束），請等候對方結束後再開始。` };
      }

      if (target.type === '時段預約') {
        if (nowMinutes < target.startMinutes) {
          return { canStart: false, reason: `尚未到預約時段！您的時段為 ${target.startTimeFormatted} ～ ${target.endTimeFormatted}，請於時段開始後再按開始。` };
        }
      } else {
        // 現場排隊：檢查叫號是否已超過報到寬限期（且後面有人等待時不可搶開）
        if (target.status === '等候報到' && target.calledAt) {
          const calledTime = new Date(target.calledAt).getTime();
          const graceMin = 3;
          const hasOtherWaiters = sameMachine.some(r => WAITING_STATUSES.includes(r.status));
          if (hasOtherWaiters && Date.now() - calledTime >= graceMin * 60 * 1000) {
            return { canStart: false, reason: `已超過 ${graceMin} 分鐘報到寬限時間！系統已將機會順延給下一位同學。` };
          }
        }

        // 現場排隊：排序在自己之前、仍在等候的人都算「前面有人」
        const ahead = sameMachine
          .filter(r => WAITING_STATUSES.includes(r.status) && r.startMinutes < target.startMinutes)
          .sort((a, b) => a.startMinutes - b.startMinutes)[0];
        if (ahead) {
          return { canStart: false, reason: `前面還有【${(ahead.students || []).join(', ')}】（${ahead.startTimeFormatted} ～ ${ahead.endTimeFormatted}）尚未使用，請依順序等候叫號。` };
        }
      }

      // 檢查名單中所有組員此刻在其他機台是否有正在使用或重疊的準備使用時段
      const usageEnd = calculateUsageEndMinutes(target, nowMinutes);
      const usageDur = Math.max(1, usageEnd - nowMinutes);
      const crossConflict = findStudentConflict(
        reservations,
        target.students,
        target.email,
        nowMinutes,
        usageDur,
        target.id,
        target.machineId,
        nowMinutes
      );
      if (crossConflict) {
        const who = (crossConflict._conflictingStudents || crossConflict.students || []).join('、') || '組員';
        const cStart = minutesToTime(crossConflict._effectiveStart ?? crossConflict.startMinutes);
        const cEnd = minutesToTime(crossConflict._effectiveEnd ?? crossConflict.endMinutes);
        return {
          canStart: false,
          reason: `組員【${who}】於 ${cStart} ～ ${cEnd} 在【${crossConflict.machineName}】已有${crossConflict.status === '使用中' ? '使用中' : '準備使用的'}時段，請待該時段結束後再開始使用。`
        };
      }

      return { canStart: true, reason: '' };
    }

    /**
     * 重新計算機台隊列時間（用於助教拖曳調動順序）
     * NOTE: 核心規則
     * 1. 現場排隊：依新順序緊接排列，起始時間為 baseStartMin
     * 2. 時段預約（未被手動拖曳者）：保留原預約時間，若被前面排程擠壓則自動順延
     * 3. 時段預約（被助教刻意拖曳者）：視為助教主動調動，緊接在當前排程位置
     * @param {Array} orderedItems 排序後的待處理預約陣列
     * @param {string|null} movedId 剛被助教拖曳移動的預約 ID
     * @param {number} baseStartMin 隊列可開始的最早時間（分鐘）
     * @returns {Array} 包含新 startMinutes, endMinutes, startTimeFormatted, endTimeFormatted 的陣列
     */
    function recalculateMachineSchedule(orderedItems, movedId, baseStartMin) {
      let currentTime = baseStartMin;
      const result = [];

      for (const item of orderedItems) {
        let start;
        if (item.type === '時段預約') {
          if (item.id === movedId) {
            // 助教刻意拖動該時段預約，讓其緊接在前面的人之後
            start = currentTime;
          } else {
            // 未被手動拖曳的時段預約，保留原本預約時間，若被前面擠到才往後順延
            start = Math.max(currentTime, item.startMinutes);
          }
        } else {
          // 現場排隊：依序緊接前面的人
          start = currentTime;
        }
        const dur = item.durationMinutes || 20;
        const end = start + dur;
        result.push({
          ...item,
          startMinutes: start,
          endMinutes: end,
          startTimeFormatted: minutesToTime(start),
          endTimeFormatted: minutesToTime(end)
        });
        currentTime = end;
      }
      return result;
    }

    /**
     * 手動推移/提前單筆預約時間（用於助教手動延遲/提前按鈕）
     * @param {Array} waitingItems 該機台目前所有等候/排隊中的預約清單
     * @param {string} targetId 欲調整的預約 ID
     * @param {number} deltaMinutes 變更的分鐘數（正數為延遲、負數為提前）
     * @param {number} baseStartMin 機台當前最早可開始時間
     * @returns {Array} 更新時間後的預約陣列
     */
    function shiftReservationSchedule(waitingItems, targetId, deltaMinutes, baseStartMin) {
      const targetIdx = waitingItems.findIndex(x => x.id === targetId);
      if (targetIdx === -1) return waitingItems;

      const target = waitingItems[targetIdx];
      // 提前時，不可早於機台最快可用時間，也不可早於前一位同學的結束時間
      let prevEnd = baseStartMin;
      if (targetIdx > 0) {
        prevEnd = Math.max(baseStartMin, waitingItems[targetIdx - 1].endMinutes);
      }

      let newStart = target.startMinutes + deltaMinutes;
      if (newStart < prevEnd) {
        newStart = prevEnd;
      }
      const dur = target.durationMinutes || 20;
      const newEnd = newStart + dur;

      const result = [];
      // 目標之前的預約維持不變
      for (let i = 0; i < targetIdx; i++) {
        result.push({ ...waitingItems[i] });
      }

      // 目標預約設定新時間
      result.push({
        ...target,
        startMinutes: newStart,
        endMinutes: newEnd,
        startTimeFormatted: minutesToTime(newStart),
        endTimeFormatted: minutesToTime(newEnd)
      });

      // 目標之後的預約，若被推擠則依序往後順延
      let runningCurrent = newEnd;
      for (let i = targetIdx + 1; i < waitingItems.length; i++) {
        const item = waitingItems[i];
        let s = item.startMinutes;
        if (s < runningCurrent) {
          s = runningCurrent;
        }
        const d = item.durationMinutes || 20;
        const e = s + d;
        result.push({
          ...item,
          startMinutes: s,
          endMinutes: e,
          startTimeFormatted: minutesToTime(s),
          endTimeFormatted: minutesToTime(e)
        });
        runningCurrent = e;
      }

      return result;
    }

    /**
     * 計算現場排隊即時排程方案（同時檢查本機台隊列與名單中所有組員準備使用的預約時段）
     * NOTE: 當發起人將共同組員（例如張卉妮）一起加入現場排隊時，若任何一位組員在其他機台（或本機台）
     *       已有使用中、等候報到、等候提前確認、時段預約或排隊中的時段重疊，排隊時間將自動往後順延至無衝突的最早可用時段。
     * @param {Array<Object>} reservations 所有預約清單
     * @param {string} machineId 目標機台 ID
     * @param {number} durationMin 使用時長（分鐘）
     * @param {number} courseEndMin 課程結束時間（分鐘）
     * @param {Array<string>} students 參與學生名單（含本人與勾選組員）
     * @param {string} userEmail 建立者信箱
     * @param {number|null} nowOverride 指定當前分鐘數（測試或同步時間基準用）
     * @returns {{ startMin: number, endMin: number, baseNowMin: number, delayedByMachine: boolean, delayedByStudentConflicts: Array<Object> }}
     */
    function calculateDynamicQueuePlan(reservations, machineId, durationMin = 20, courseEndMin = 1020, students = [], userEmail = '', nowOverride = null) {
      const now = new Date();
      const currentMin = typeof nowOverride === 'number' ? nowOverride : (now.getHours() * 60 + now.getMinutes());
      const studentSet = new Set(normalizeStudentList(students));
      const busyIntervals = getEffectiveBusyIntervals(reservations, currentMin);

      let candStart = currentMin;
      let delayedByMachine = false;
      const delayedConflictMap = new Map();

      while (candStart + durationMin <= courseEndMin) {
        const candEnd = candStart + durationMin;

        // 1. 本機台在 [candStart, candEnd] 內是否有任何重疊佔用
        //    （已逾時釋放保留資格的預約在新同學排同機台時會自動禮讓順延，不阻擋新同學優先使用當下空檔）
        const machineHits = busyIntervals.filter(
          x => x.reservation.machineId === machineId && !x.isOverdueReleased && x.start < candEnd && x.end > candStart
        );

        // 2. 名單中所有同學在「所有機台」於 [candStart, candEnd] 內是否有任何準備使用或使用中的重疊預約
        //    （已逾時釋放的保留單本身會彈性順推更新預計時段，不阻擋建立新排隊）
        const studentHits = busyIntervals.filter(x => {
          if (x.isOverdueReleased) return false;
          if (!(x.start < candEnd && x.end > candStart)) return false;
          return getOverlappingStudentNames(x.reservation, studentSet, userEmail).length > 0;
        });

        if (machineHits.length === 0 && studentHits.length === 0) {
          return {
            startMin: candStart,
            endMin: candEnd,
            baseNowMin: currentMin,
            delayedByMachine,
            delayedByStudentConflicts: Array.from(delayedConflictMap.values())
          };
        }

        let maxConflictEnd = candStart + 1;
        for (const mHit of machineHits) {
          delayedByMachine = true;
          maxConflictEnd = Math.max(maxConflictEnd, mHit.end);
        }
        for (const sHit of studentHits) {
          maxConflictEnd = Math.max(maxConflictEnd, sHit.end);
          const r = sHit.reservation;
          const matchedNames = getOverlappingStudentNames(r, studentSet, userEmail);
          if (!delayedConflictMap.has(r.id)) {
            delayedConflictMap.set(r.id, {
              id: r.id,
              studentNames: matchedNames,
              machineId: r.machineId,
              machineName: r.machineName,
              startMinutes: sHit.start,
              endMinutes: sHit.end,
              startTimeFormatted: minutesToTime(sHit.start),
              endTimeFormatted: minutesToTime(sHit.end),
              status: r.status
            });
          } else {
            const prev = delayedConflictMap.get(r.id);
            prev.endMinutes = Math.max(prev.endMinutes, sHit.end);
            prev.endTimeFormatted = minutesToTime(prev.endMinutes);
          }
        }

        candStart = maxConflictEnd;
      }

      return {
        startMin: candStart,
        endMin: candStart + durationMin,
        baseNowMin: currentMin,
        delayedByMachine,
        delayedByStudentConflicts: Array.from(delayedConflictMap.values())
      };
    }

    // 計算現場排隊即時起始時間（相容既有呼叫端，回傳無衝突的最早可用分鐘數）
    function calculateDynamicQueueStart(reservations, machineId, durationMin = 20, courseEndMin = 1020, students = [], userEmail = '', nowOverride = null) {
      return calculateDynamicQueuePlan(reservations, machineId, durationMin, courseEndMin, students, userEmail, nowOverride).startMin;
    }

    // 檢查預約/排隊是否有衝突（同時支援靜態時段預約與動態現場排隊衝突驗證）
    function checkReservationConflict(reservations, machineId, startMin, durationMin, students = [], userEmail = '', courseEndMin = 1020, ignoreId = null, nowMinutes = null) {
      const endMin = startMin + durationMin;
      const studentSet = new Set(normalizeStudentList(students));
      const busyIntervals = getEffectiveBusyIntervals(reservations, nowMinutes);

      // 1. 超過課程結束時間
      if (endMin > courseEndMin) {
        return {
          hasConflict: true,
          type: 'EXCEED_COURSE',
          message: `推算結束時間（${minutesToTime(endMin)}）已超過課程結束時間（${minutesToTime(courseEndMin)}）！`
        };
      }

      // 2. 機台時段衝突（檢查該機台是否有後續已預約/排隊時段重疊；現場排隊模式下，已逾時釋放者會自動禮讓順延）
      const machineInterval = busyIntervals.find(({ start, end, reservation: r, isOverdueReleased }) => {
        if (r.machineId !== machineId) return false;
        if (r.id === ignoreId) return false;
        if (typeof nowMinutes === 'number' && isOverdueReleased) return false;
        return start < endMin && end > startMin;
      });
      if (machineInterval) {
        const machineHit = machineInterval.reservation;
        const mStart = minutesToTime(machineInterval.start);
        const mEnd = minutesToTime(machineInterval.end);
        return {
          hasConflict: true,
          type: 'MACHINE_CONFLICT',
          message: `該機台於 ${mStart} ～ ${mEnd} 已有預約（${(machineHit.students || []).join(', ')}），時段重疊無法預約！`
        };
      }

      // 3. 學生（含所有共同組員）時段衝突
      const studentInterval = busyIntervals.find(({ start, end, reservation: r, isOverdueReleased }) => {
        if (r.id === ignoreId) return false;
        if (typeof nowMinutes === 'number' && isOverdueReleased) return false;
        if (!(start < endMin && end > startMin)) return false;
        return getOverlappingStudentNames(r, studentSet, userEmail).length > 0;
      });
      if (studentInterval) {
        const studentHit = studentInterval.reservation;
        const conflictingStudents = getOverlappingStudentNames(studentHit, studentSet, userEmail);
        const nameStr = conflictingStudents.length > 0 ? conflictingStudents.join(', ') : '名單中的同學';
        const sStart = minutesToTime(studentInterval.start);
        const sEnd = minutesToTime(studentInterval.end);
        return {
          hasConflict: true,
          type: 'STUDENT_CONFLICT',
          message: `${nameStr} 於 ${sStart} ～ ${sEnd} 已在【${studentHit.machineName}】有預約，時段重疊不可重複排隊！`
        };
      }

      return { hasConflict: false };
    }

    function getNextQueueWaiter(reservations, machineId) {
      return reservations
        .filter(r => r.machineId === machineId && (r.status === '排隊中' || r.status === '等待中'))
        .sort((a, b) => a.startMinutes - b.startMinutes)[0];
    }

    // ============================================================
    // 3. AppContext 狀態管理
    // ============================================================
    const AppContext = createContext(null);

    function AppProvider({ children }) {
      const [machines, setMachines] = useState([]);
      const [reservations, setReservations] = useState([]);
      const [students, setStudents] = useState([]);
      const [courseSessions, setCourseSessions] = useState([]);
      const [systemSettings, setSystemSettings] = useState(null);
      const [notifications, setNotifications] = useState([]);
      const [activeUser, setActiveUser] = useState({ name: '李信恩', mail: 'supersamuel0106@gmail.com', role: 'admin' });
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [viewMode, setViewMode] = useState('mobile');
      const [activeTab, setActiveTab] = useState('machines');
      const [isLiveSupabase, setIsLiveSupabase] = useState(true);
      const [isLoading, setIsLoading] = useState(true);
      // NOTE: 課程暫停開始時間（ISO 字串），null 代表未暫停。以資料庫為唯一來源，
      //       這樣電視看板與所有同學手機才會同步看到暫停畫面（原本只存在老師裝置的 localStorage）。
      const [remotePausedAt, setRemotePausedAt] = useState(null);
      // 是否暫停中（資料庫為唯一來源，所有裝置共用；須宣告於 useEffect 之前以避免 TDZ）
      const isCoursePaused = !!remotePausedAt;
      const coursePausedAt = remotePausedAt;
      const lastRefreshAtRef = useRef(0);
      const isScanningRef = useRef(false);

      const refreshData = useCallback(async () => {
        if (!supabaseClient) return null;
        let freshReservations = null;
        try {
          const [mRes, rRes, sRes, csRes, settRes, pauseRes] = await Promise.all([
            supabaseClient.from('machines').select('*').order('id'),
            supabaseClient.from('reservations').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('students').select('*').order('name'),
            supabaseClient.from('course_sessions').select('*').order('session_id'),
            supabaseClient.from('system_settings').select('*').eq('id', 'DEFAULT').single(),
            supabaseClient.from('system_settings').select('manual_course_start_time').eq('id', COURSE_PAUSE_ROW_ID).maybeSingle()
          ]);

          if (mRes.error || rRes.error) {
            throw (mRes.error || rRes.error);
          }

          // NOTE: 機台 id 格式為「N. 名稱」，以字串排序會導致 10 排在 2 前面，改用數字排序
          const rawMachines = (mRes.data || [])
            .map(row => ({ id: row.id, name: row.name, status: row.status }))
            .sort((a, b) => {
              const numA = parseInt(a.id) || 0;
              const numB = parseInt(b.id) || 0;
              return numA - numB;
            });
          const rawReservations = (rRes.data || []).map(mapReservationRow);
          // 依實際回傳的欄位更新「缺少欄位」清單（資料庫補上欄位後自動恢復寫入）
          if ((rRes.data || []).length > 0) {
            const sampleRow = rRes.data[0];
            ['advance_offered_at', 'notes'].forEach(col => {
              if (col in sampleRow) MISSING_RESERVATION_COLUMNS.delete(col);
              else MISSING_RESERVATION_COLUMNS.add(col);
            });
          }

          const rawStudents = (sRes.data || []).map(row => ({ id: row.id, name: row.name, studentNumber: row.student_number, mail: row.mail, role: row.role }));
          const rawSessions = (csRes.data || []).map(row => ({ id: row.id, sessionId: row.session_id, startTime: row.start_time, endTime: row.end_time, isCurrent: row.is_current, notes: row.notes }));

          const updatedMachines = rawMachines.map(mac => {
            const inUse = rawReservations.find(r => r.machineId === mac.id && r.status === '使用中');
            const waitCheckin = rawReservations.find(r => r.machineId === mac.id && (r.status === '等候報到' || r.status === '等候提前確認'));
            const nextW = getNextQueueWaiter(rawReservations, mac.id);

            let computed = '空閒';
            if (inUse) computed = '使用中';
            else if (waitCheckin) computed = '等待報到';

            return {
              ...mac,
              status: computed,
              currentUserName: inUse ? inUse.students.join(', ') : undefined,
              nextUserName: waitCheckin 
                ? waitCheckin.students.join(', ') 
                : nextW 
                ? nextW.students.join(', ') 
                : undefined
            };
          });

          setMachines(updatedMachines);
          setReservations(rawReservations);
          setStudents(rawStudents);
          setCourseSessions(rawSessions);
          setSystemSettings(settRes.data || null);
          // 讀取失敗時保留原狀態，避免網路抖動讓暫停畫面誤消失
          if (!pauseRes.error) {
            setRemotePausedAt(pauseRes.data?.manual_course_start_time || null);
          }
          setIsLiveSupabase(true);
          lastRefreshAtRef.current = Date.now();
          // NOTE: 回傳最新預約快照，讓呼叫端（例如新增排隊後叫號）不必依賴 state 閉包中過期的舊資料
          freshReservations = rawReservations;

          const savedEmail = localStorage.getItem(AUTH_STORAGE_KEY);
          if (savedEmail && rawStudents.length > 0) {
            const matched = rawStudents.find(s => s.mail.toLowerCase() === savedEmail.trim().toLowerCase());
            if (matched) {
              setActiveUser(matched);
              setIsLoggedIn(true);
            }
          }
        } catch (e) {
          console.warn('Supabase fetch failed:', e);
          setIsLiveSupabase(false);
        } finally {
          setIsLoading(false);
        }
        return freshReservations;
      }, []);

      useEffect(() => {
        refreshData();
        const timer = setInterval(refreshData, 8000);
        // NOTE: 當手機螢幕喚醒或分頁從背景切回前景時，立即拉取最新資料庫狀態，消除背景凍結期間的舊快照
        const handleVisibilityOrFocus = () => {
          if (typeof document === 'undefined' || document.visibilityState === 'visible') {
            refreshData();
          }
        };
        window.addEventListener('focus', handleVisibilityOrFocus);
        document.addEventListener('visibilitychange', handleVisibilityOrFocus);
        return () => {
          clearInterval(timer);
          window.removeEventListener('focus', handleVisibilityOrFocus);
          document.removeEventListener('visibilitychange', handleVisibilityOrFocus);
        };
      }, [refreshData]);

      // NOTE: 推進機台隊列核心邏輯
      // 規則：
      // 1. 若下一位是「現場排隊」：不用問，直接叫號（給予 3 分鐘報到緩衝）
      // 2. 若下一位是「時段預約」：發出提前使用邀請（App 頂部顯示 3 分鐘確認倒數），若同意則提前使用，若拒絕或逾時則保留原時段並叫號再下一位！
      // 3. 重算後方隊列或檢查能否立即叫號時，必須同時避開本機台時段預約與組內每位同學在其他機台的預約時段！
      const advanceQueueForMachine = useCallback(async (machineId, reservationsSnapshot, excludeOfferResIds = []) => {
        if (!supabaseClient) return;

        // 優先向資料庫取得即時預約狀態，避免其他裝置剛按下「開始使用」卻被本機過期快照覆寫
        let sourceRes = reservationsSnapshot || reservations;
        const { data: freshRows, error: freshErr } = await supabaseClient
          .from('reservations')
          .select('*');
        if (!freshErr && Array.isArray(freshRows)) {
          sourceRes = freshRows.map(mapReservationRow);
        }

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const graceMin = systemSettings?.checkin_grace_minutes !== undefined ? systemSettings.checkin_grace_minutes : 3;

        // 防護：若機台當前仍有人使用中，不可誤改機台狀態或重複叫號
        const inUseOnMachine = sourceRes.find(r => r.machineId === machineId && r.status === '使用中');
        if (inUseOnMachine) {
          await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', machineId);
          return;
        }

        // 取得該機台尚未完成、未取消且尚未開始使用的所有等候預約
        const activeResList = sourceRes.filter(r => 
          r.machineId === machineId && 
          WAITING_RESERVATION_STATUSES.includes(r.status) &&
          !hasReservationStartedOrInUse(r)
        );

        if (activeResList.length === 0) {
          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', machineId);
          return;
        }

        const queueList = activeResList
          .filter(r => r.type === '現場排隊')
          .sort((a, b) => (a.startMinutes - b.startMinutes) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
        const slotList = activeResList
          .filter(r => r.type === '時段預約')
          .sort((a, b) => a.startMinutes - b.startMinutes);
        const blockingSlots = slotList.filter(s => s.startMinutes + graceMin > nowMinutes);
        const slotRanges = blockingSlots.map(s => ({ start: s.startMinutes, end: s.endMinutes }));
        const eligibleSlotList = slotList.filter(s => !excludeOfferResIds.includes(s.id));

        // 篩選出在目前空檔 [nowMinutes, nowMinutes + duration] 既不撞本機台時段預約、且所有組員在其他機台皆無重疊預約的候選人
        // 同時讓尚未報到逾時的正常排隊者優先於已逾時釋放者
        const availableQueueList = queueList
          .filter(item => findEarliestValidStartForReservation(item, nowMinutes, slotRanges, sourceRes, nowMinutes) === nowMinutes)
          .sort((a, b) => {
            const aOverdue = isOverdueReleasedReservation(a) ? 1 : 0;
            const bOverdue = isOverdueReleasedReservation(b) ? 1 : 0;
            if (aOverdue !== bOverdue) return aOverdue - bOverdue;
            return a.startMinutes - b.startMinutes;
          });

        if (availableQueueList.length > 0) {
          // --- Case A: 現場排隊 ➔ 直接叫號 (3 分鐘報到緩衝) ---
          const nextCandidate = availableQueueList[0];
          const sortedQueue = [nextCandidate, ...queueList.filter(q => q.id !== nextCandidate.id)];
          const scheduledRanges = [...slotRanges];
          let runningStartMin = nowMinutes;
          let firstUpdatedOk = false;

          for (let i = 0; i < sortedQueue.length; i++) {
            const item = sortedQueue[i];
            const isFirst = i === 0;
            const newStatus = isFirst ? '等候報到' : '排隊中';
            const dur = item.durationMinutes || 20;

            const candStart = isFirst
              ? nowMinutes
              : findEarliestValidStartForReservation(item, runningStartMin, scheduledRanges, sourceRes, nowMinutes);
            const candEnd = candStart + dur;
            scheduledRanges.push({ start: candStart, end: candEnd });

            const wasAlreadyCalled = isFirst && item.status === '等候報到' && Boolean(item.calledAt);
            const updatePayload = {
              status: newStatus,
              start_minutes: candStart,
              end_minutes: candEnd,
              start_time_formatted: minutesToTime(candStart),
              end_time_formatted: minutesToTime(candEnd)
            };
            if (isFirst) {
              updatePayload.called_at = wasAlreadyCalled ? item.calledAt : new Date().toISOString();
              updatePayload.advance_offered_at = null;
            } else {
              updatePayload.called_at = null;
            }
            updatePayload.started_at = null;

            // NOTE: 加上原子條件保護，絕不覆寫剛在另一台裝置按下「開始使用」的預約
            const { data: updatedRows } = await supabaseClient
              .from('reservations')
              .update(updatePayload)
              .eq('id', item.id)
              .in('status', WAITING_RESERVATION_STATUSES)
              .select('id');

            if (isFirst) {
              firstUpdatedOk = Boolean(updatedRows && updatedRows.length > 0);
              if (!firstUpdatedOk) {
                return;
              }
            }

            if (isFirst && firstUpdatedOk && !wasAlreadyCalled) {
              sendQueueCallNotification({
                studentNames: item.students.join(', '),
                machineName: item.machineName,
                startTime: minutesToTime(candStart),
                endTime: minutesToTime(candEnd),
                durationMinutes: dur,
                toEmail: item.email || ''
              });

              const notif = {
                id: `N_${Date.now()}`,
                timestamp: new Date().toLocaleTimeString('zh-TW'),
                recipientName: item.students.join(', '),
                machineName: item.machineName,
                subject: '【叫號通知】輪到您使用機台了！',
                body: `親愛的 ${item.students.join(', ')} 同學：您排隊的【${item.machineName}】已輪到您，時段為 ${minutesToTime(candStart)} ～ ${minutesToTime(candEnd)}，請於 3 分鐘內前往工廠報到！`
              };
              setNotifications(prev => [notif, ...prev]);
            }

            runningStartMin = candEnd;
          }

          if (firstUpdatedOk) {
            await supabaseClient.from('machines').update({ status: '等待報到' }).eq('id', machineId);
          }
          return;
        }

        // 若目前沒有任何現場排隊者能在當下立即開始（例如組員在其他機台尚有待用預約，或為保留資格預約），
        // 依序校正隊列中各筆現場排隊的預計開始與結束時間，確保隨當前時間與組員最新預約動態更新
        const scheduledQueueRanges = [];
        if (queueList.length > 0) {
          const combinedRanges = [...slotRanges];
          let runningStartMin = nowMinutes;
          for (const item of queueList) {
            const dur = item.durationMinutes || Math.max(10, (item.endMinutes - item.startMinutes) || 20);
            const isOverdueReleased = isOverdueReleasedReservation(item);
            const candStart = findEarliestValidStartForReservation(item, runningStartMin, combinedRanges, sourceRes, nowMinutes);
            const candEnd = candStart + dur;
            combinedRanges.push({ start: candStart, end: candEnd });
            scheduledQueueRanges.push({ start: candStart, end: candEnd });

            if (candStart !== item.startMinutes || candEnd !== item.endMinutes || item.status !== '排隊中') {
              await supabaseClient
                .from('reservations')
                .update({
                  status: '排隊中',
                  start_minutes: candStart,
                  end_minutes: candEnd,
                  start_time_formatted: minutesToTime(candStart),
                  end_time_formatted: minutesToTime(candEnd),
                  called_at: isOverdueReleased ? (item.calledAt || item.startedAt) : null,
                  started_at: null
                })
                .eq('id', item.id)
                .in('status', WAITING_RESERVATION_STATUSES);
            }
            if (!isOverdueReleased) {
              runningStartMin = candEnd;
            }
          }
        }

        // 檢查是否有後續時段預約可在目前空檔提前使用（不撞組員其他機台預約，也不撞已排定的現場排隊）
        const availableSlotList = eligibleSlotList.filter(slot => {
          const earlyEnd = calculateUsageEndMinutes(slot, nowMinutes);
          const earlyDur = Math.max(1, earlyEnd - nowMinutes);
          const conflict = findStudentConflict(sourceRes, slot.students, slot.email, nowMinutes, earlyDur, slot.id, machineId, nowMinutes);
          if (conflict) return false;
          const hitsQueue = scheduledQueueRanges.some(qRange => nowMinutes < qRange.end && earlyEnd > qRange.start);
          const hitsOtherSlot = blockingSlots.some(s => s.id !== slot.id && nowMinutes < s.endMinutes && earlyEnd > s.startMinutes);
          return !hitsQueue && !hitsOtherSlot;
        });

        if (availableSlotList.length === 0) {
          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', machineId);
          return;
        }

        // --- Case B: 時段預約 ➔ 發出提前詢問（App 頂部顯示 3 分鐘確認倒數） ---
        const nextCandidate = availableSlotList[0];
        if (nextCandidate.status !== '等候提前確認') {
          const updatePayload = {
            status: '等候提前確認',
            advance_offered_at: new Date().toISOString()
          };

          const { data: offeredRows } = await supabaseClient
            .from('reservations')
            .update(updatePayload)
            .eq('id', nextCandidate.id)
            .in('status', WAITING_RESERVATION_STATUSES)
            .select('id');

          if (!offeredRows || offeredRows.length === 0) {
            return;
          }

          const offerTitle = `【機台提早空出！🪚】${nextCandidate.machineName}`;
          const offerBody = `親愛的 ${nextCandidate.students.join(', ')} 同學：您預約的【${nextCandidate.machineName}】目前已有空檔，請問是否要提前現在開始使用？請於 3 分鐘內於 App 頂部確認。`;
          sendBrowserNotification(offerTitle, offerBody, `early-offer-${nextCandidate.id}`);

          const notif = {
            id: `N_${Date.now()}`,
            timestamp: new Date().toLocaleTimeString('zh-TW'),
            recipientName: nextCandidate.students.join(', '),
            machineName: nextCandidate.machineName,
            subject: '【提早使用詢問】機台目前已有空檔',
            body: offerBody
          };
          setNotifications(prev => [notif, ...prev]);
        }

        await supabaseClient.from('machines').update({ status: '等待報到' }).eq('id', machineId);
      }, [reservations, systemSettings]);

      // 同意提前開始使用
      const acceptEarlyStart = async (reservationId) => {
        const latestList = (await refreshData()) || reservations;
        const target = latestList.find(r => r.id === reservationId);
        if (!target) return;

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        // NOTE: 前一位提早 10 分鐘內結束，可使用到原訂結束時間；更早則維持完整時長
        const newEnd = calculateUsageEndMinutes(target, nowMinutes);
        const earlyDur = Math.max(1, newEnd - nowMinutes);

        // 再次確認接受提前時是否有跨機台衝突
        const conflict = findStudentConflict(latestList, target.students, target.email, nowMinutes, earlyDur, target.id, target.machineId, nowMinutes);
        if (conflict) {
          const cStart = minutesToTime(conflict._effectiveStart ?? conflict.startMinutes);
          const cEnd = minutesToTime(conflict._effectiveEnd ?? conflict.endMinutes);
          alert(`⚠️ 無法提前：名單中的同學在【${conflict.machineName}】已有時段（${cStart} ～ ${cEnd}），同時間不可重複使用！已為您保留原預約時段。`);
          await declineEarlyStart(reservationId);
          return;
        }

        await supabaseClient
          .from('reservations')
          .update({
            status: '使用中',
            start_minutes: nowMinutes,
            end_minutes: newEnd,
            start_time_formatted: minutesToTime(nowMinutes),
            end_time_formatted: minutesToTime(newEnd),
            started_at: now.toISOString(),
            called_at: null,
            advance_offered_at: null
          })
          .eq('id', reservationId)
          .in('status', WAITING_RESERVATION_STATUSES);

        await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', target.machineId);
        await refreshData();
      };

      // 婉拒提前開始（保持原本預約時段，機會轉交下一位）
      const declineEarlyStart = async (reservationId) => {
        const target = reservations.find(r => r.id === reservationId);
        if (!target) return;

        await supabaseClient
          .from('reservations')
          .update({
            status: '排隊中',
            called_at: null,
            advance_offered_at: null,
            notes: '已保留原時段（婉拒提前）'
          })
          .eq('id', reservationId)
          .eq('status', '等候提前確認');

        const updatedSnapshot = reservations.map(r => 
          r.id === reservationId ? { ...r, status: '排隊中', advanceOfferedAt: null } : r
        );
        await advanceQueueForMachine(target.machineId, updatedSnapshot, [reservationId]);
        await refreshData();
      };

      /**
       * 逾時未報到處理（取代原本「直接取消」的做法）
       * NOTE: 規則
       * 1. 後面沒有可替補的現場排隊者 ➔ 釋放機台，保留資格並同步更新預計開始～結束時間（以非空 called_at 標記已逾時釋放）
       * 2. 後面有人現場排隊 ➔ 排隊者先使用，逾時者順延到他正後方（同時避開組員跨機台預約）
       * 3. 後面是時段預約、預約之後才有排隊 ➔ 把該排隊者拉到前面替補（需能在下一筆預約開始前用完）
       * 4. 多裝置防護：執行前強制向資料庫查驗最新狀態，且所有 SQL 更新均附帶 status 原子條件鎖，
       *    徹底杜絕背景分頁或舊快照將「使用中」的預約打回「排隊中」！
       * @param overdue 逾時未報到的預約/排隊
       * @param snapshot 目前所有預約資料
       * @param nowMinutes 目前時間（分鐘）
       * @param graceMin 報到緩衝分鐘數
       * @returns 是否有進行調換或釋放
       */
      const handleOverdueReservation = async (overdue, snapshot, nowMinutes, graceMin) => {
        if (!supabaseClient || !overdue?.id) return false;

        // 1. 向資料庫即時拉取全表最新狀態，絕不依賴可能過期的本機 state 快照
        const { data: freshRows, error: freshErr } = await supabaseClient
          .from('reservations')
          .select('*');
        if (freshErr || !Array.isArray(freshRows)) return false;

        const freshSnapshot = freshRows.map(mapReservationRow);
        const freshOverdue = freshSnapshot.find(x => x.id === overdue.id);

        // 若目標紀錄在資料庫已開始使用（使用中）、已完成或已取消，立即中止！
        if (!freshOverdue || hasReservationStartedOrInUse(freshOverdue)) {
          return false;
        }
        if (!WAITING_RESERVATION_STATUSES.includes(freshOverdue.status)) {
          return false;
        }

        const sameMachine = freshSnapshot.filter(x => x.machineId === freshOverdue.machineId && x.id !== freshOverdue.id);

        // NOTE: 機台仍有人使用中（例如剛報到上機或前一位超時），絕不可釋放機台或改動狀態
        if (sameMachine.some(x => x.status === '使用中')) {
          await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', freshOverdue.machineId);
          return false;
        }

        // 以資料庫最新欄位重新驗證是否確實已逾時（防止另一裝置剛重叫號或老師剛恢復課程順延時段）
        const graceMs = graceMin * 60 * 1000;
        if (freshOverdue.type === '現場排隊') {
          const isCallTimedOut = freshOverdue.status === '等候報到' && freshOverdue.calledAt && (Date.now() - new Date(freshOverdue.calledAt).getTime() >= graceMs);
          const isSlotWindowExpired = nowMinutes >= freshOverdue.endMinutes;
          if (!isCallTimedOut && !isSlotWindowExpired) {
            return false;
          }
        } else if (freshOverdue.type === '時段預約') {
          if (nowMinutes < freshOverdue.startMinutes + graceMin) {
            return false;
          }
        }

        const waitingList = sameMachine.filter(x => WAITING_RESERVATION_STATUSES.includes(x.status) && !hasReservationStartedOrInUse(x));
        const allOtherQueues = waitingList
          .filter(x => x.type === '現場排隊')
          .sort((a, b) => a.startMinutes - b.startMinutes);
        // 優先挑選尚未逾時釋放的正常候補者作為替補
        const queueList = allOtherQueues.filter(x => !isOverdueReleasedReservation(x));
        // 只有「尚未逾時」的時段預約需要讓路；已逾時的預約本身也會走這個流程
        const blockingSlots = waitingList
          .filter(x => x.type === '時段預約' && !isOverdueReleasedReservation(x) && x.startMinutes + graceMin > nowMinutes)
          .sort((a, b) => a.startMinutes - b.startMinutes);
        const blockingSlotRanges = blockingSlots.map(s => ({ start: s.startMinutes, end: s.endMinutes }));

        const fitsBeforeNextSlot = (dur) =>
          !blockingSlots.some(s => s.startMinutes < nowMinutes + dur && s.endMinutes > nowMinutes);

        // 規則 1: 後方無可替補的現場排隊者 -> 釋放機台為空閒，保留預約並將預計開始～結束時間同步更新至當前可用時間
        if (queueList.length === 0) {
          if (isOverdueReleasedReservation(freshOverdue)) {
            return false;
          }

          const ovdDur = freshOverdue.durationMinutes || Math.max(10, (freshOverdue.endMinutes - freshOverdue.startMinutes) || 10);
          const newStart = findEarliestValidStartForReservation(freshOverdue, nowMinutes, blockingSlotRanges, freshSnapshot, nowMinutes);
          const newEnd = newStart + ovdDur;
          const releaseCalledAt = freshOverdue.calledAt || new Date().toISOString();

          const { data: releasedRows, error: relErr } = await supabaseClient
            .from('reservations')
            .update({
              status: '排隊中',
              start_minutes: newStart,
              end_minutes: newEnd,
              start_time_formatted: minutesToTime(newStart),
              end_time_formatted: minutesToTime(newEnd),
              called_at: releaseCalledAt,
              started_at: null,
              advance_offered_at: null,
              notes: '報到逾時，已釋放機台'
            })
            .eq('id', freshOverdue.id)
            .in('status', WAITING_RESERVATION_STATUSES)
            .select('id');

          if (relErr || !releasedRows || releasedRows.length === 0) {
            return false;
          }

          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', freshOverdue.machineId);

          const stamp = new Date().toLocaleTimeString('zh-TW');
          setNotifications(prev => [
            {
              id: `N_${Date.now()}_ovd_idle`,
              timestamp: stamp,
              recipientName: (freshOverdue.students || []).join(', '),
              machineName: freshOverdue.machineName,
              subject: '【逾時未報到】機台已釋放',
              body: `親愛的 ${(freshOverdue.students || []).join(', ')} 同學：您在【${freshOverdue.machineName}】超過 ${graceMin} 分鐘未報到，系統已釋放機台並為您保留資格（預計時段更新為 ${minutesToTime(newStart)} ～ ${minutesToTime(newEnd)}）。`
            },
            ...prev
          ]);
          return true;
        }

        // 找第一位「現在就能用完、且名單中所有組員在其他機台沒有衝突」的排隊者
        let substitute = queueList.find(q => {
          const dur = q.durationMinutes || 20;
          if (!fitsBeforeNextSlot(dur)) return false;
          return !findStudentConflict(freshSnapshot, q.students, q.email, nowMinutes, dur, q.id, freshOverdue.machineId, nowMinutes);
        });

        // 若因時段塞不下但後面確實有候補人，直接取第一位無跨機台衝突者替補
        if (!substitute) {
          substitute = queueList.find(q => !findStudentConflict(freshSnapshot, q.students, q.email, nowMinutes, q.durationMinutes || 20, q.id, freshOverdue.machineId, nowMinutes));
        }

        if (!substitute) {
          if (isOverdueReleasedReservation(freshOverdue)) {
            return false;
          }
          // 後面排隊者全都有跨機台衝突：逾時者移開並更新預計時段、標記已逾時釋放，機台設為空閒
          const ovdDur = freshOverdue.durationMinutes || Math.max(10, (freshOverdue.endMinutes - freshOverdue.startMinutes) || 10);
          const newStart = findEarliestValidStartForReservation(freshOverdue, nowMinutes, blockingSlotRanges, freshSnapshot, nowMinutes);
          const newEnd = newStart + ovdDur;
          const releaseCalledAt = freshOverdue.calledAt || new Date().toISOString();

          const { data: conflictRelRows, error: conflictRelErr } = await supabaseClient
            .from('reservations')
            .update({
              status: '排隊中',
              start_minutes: newStart,
              end_minutes: newEnd,
              start_time_formatted: minutesToTime(newStart),
              end_time_formatted: minutesToTime(newEnd),
              called_at: releaseCalledAt,
              started_at: null,
              advance_offered_at: null,
              notes: '報到逾時，候補者皆有時段衝突'
            })
            .eq('id', freshOverdue.id)
            .in('status', WAITING_RESERVATION_STATUSES)
            .select('id');

          if (conflictRelErr || !conflictRelRows || conflictRelRows.length === 0) {
            return false;
          }

          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', freshOverdue.machineId);
          return true;
        }

        // --- 先預算替補者與後方順延隊列時程 ---
        const subDur = substitute.durationMinutes || 20;
        const subEnd = nowMinutes + subDur;
        const restQueue = [freshOverdue, ...allOtherQueues.filter(q => q.id !== substitute.id)];
        const scheduledRanges = [
          { start: nowMinutes, end: subEnd },
          ...blockingSlotRanges
        ];
        let runningStart = subEnd;
        let overdueNewStart = subEnd;
        const restPayloads = [];

        for (const item of restQueue) {
          const dur = item.durationMinutes || Math.max(10, (item.endMinutes - item.startMinutes) || 20);
          const candStart = findEarliestValidStartForReservation(item, runningStart, scheduledRanges, freshSnapshot, nowMinutes);
          const candEnd = candStart + dur;
          scheduledRanges.push({ start: candStart, end: candEnd });

          const payload = {
            status: '排隊中',
            start_minutes: candStart,
            end_minutes: candEnd,
            start_time_formatted: minutesToTime(candStart),
            end_time_formatted: minutesToTime(candEnd),
            called_at: null,
            started_at: null
          };
          if (item.id === freshOverdue.id) {
            // NOTE: 時段預約逾時後就失去固定時段，改以現場排隊身分順延，後續沿用排隊叫號流程
            payload.type = '現場排隊';
            payload.advance_offered_at = null;
            payload.notes = '逾時未報到，已順延至下一位之後';
            overdueNewStart = candStart;
          }
          restPayloads.push({ id: item.id, payload });
          runningStart = candEnd;
        }

        // --- 原子步驟 1：先確認將逾時者順延成功（若逾時者剛按下「開始使用」，此處會回傳 0 筆並立即安全中止） ---
        const overduePlan = restPayloads.find(p => p.id === freshOverdue.id);
        const { data: updatedOverdueRows, error: updOvdErr } = await supabaseClient
          .from('reservations')
          .update(overduePlan.payload)
          .eq('id', freshOverdue.id)
          .in('status', WAITING_RESERVATION_STATUSES)
          .select('id');

        if (updOvdErr || !updatedOverdueRows || updatedOverdueRows.length === 0) {
          return false;
        }

        // --- 原子步驟 2：替補者立即叫號 ---
        const { data: calledSubRows, error: subErr } = await supabaseClient
          .from('reservations')
          .update({
            status: '等候報到',
            start_minutes: nowMinutes,
            end_minutes: subEnd,
            start_time_formatted: minutesToTime(nowMinutes),
            end_time_formatted: minutesToTime(subEnd),
            called_at: new Date().toISOString(),
            started_at: null,
            advance_offered_at: null
          })
          .eq('id', substitute.id)
          .in('status', WAITING_RESERVATION_STATUSES)
          .select('id');

        if (subErr || !calledSubRows || calledSubRows.length === 0) {
          return false;
        }

        sendQueueCallNotification({
          studentNames: substitute.students.join(', '),
          machineName: substitute.machineName,
          startTime: minutesToTime(nowMinutes),
          endTime: minutesToTime(subEnd),
          durationMinutes: subDur,
          toEmail: substitute.email || ''
        });

        // --- 原子步驟 3：更新其餘後方排隊者時程 ---
        for (const entry of restPayloads) {
          if (entry.id === freshOverdue.id) continue;
          await supabaseClient
            .from('reservations')
            .update(entry.payload)
            .eq('id', entry.id)
            .in('status', WAITING_RESERVATION_STATUSES);
        }

        await supabaseClient.from('machines').update({ status: '等待報到' }).eq('id', freshOverdue.machineId);

        const stamp = new Date().toLocaleTimeString('zh-TW');
        setNotifications(prev => [
          {
            id: `N_${Date.now()}_sub`,
            timestamp: stamp,
            recipientName: substitute.students.join(', '),
            machineName: substitute.machineName,
            subject: '【叫號通知】輪到您使用機台了！',
            body: `親愛的 ${substitute.students.join(', ')} 同學：前一位同學逾時未報到，【${substitute.machineName}】改由您先使用，時段為 ${minutesToTime(nowMinutes)} ～ ${minutesToTime(subEnd)}，請於 ${graceMin} 分鐘內前往報到！`
          },
          {
            id: `N_${Date.now()}_ovd`,
            timestamp: stamp,
            recipientName: freshOverdue.students.join(', '),
            machineName: freshOverdue.machineName,
            subject: '【順延通知】逾時未報到，已順延',
            body: `親愛的 ${freshOverdue.students.join(', ')} 同學：您在【${freshOverdue.machineName}】超過 ${graceMin} 分鐘未報到，已先讓下一位同學使用，您的時段順延至約 ${minutesToTime(overdueNewStart)} 開始。`
          },
          ...prev
        ]);

        return true;
      };

      /**
       * 自動推進所有「時間已過但尚未按開始使用」之保留預約/排隊的預計開始與結束時間
       * NOTE: 當預約超過開始時間仍未報到且後方無人時，預約會保留在候位清單中，
       *       此函式確保其預計開始～結束時段隨當前時間即時往後更新（同時避開同機台固定預約與組員跨機台衝突）。
       */
      const syncStaleWaitingSchedules = useCallback(async (baseList, currentMin, graceMin, skipMachineIds = new Set()) => {
        if (!supabaseClient || !Array.isArray(baseList) || baseList.length === 0) return false;

        const byMac = new Map();
        for (const r of baseList) {
          if (!isReservationActive(r)) continue;
          if (!byMac.has(r.machineId)) byMac.set(r.machineId, []);
          byMac.get(r.machineId).push(r);
        }

        let changedAny = false;

        for (const [macId, macList] of byMac.entries()) {
          if (skipMachineIds.has(macId)) continue;

          const inUse = macList.find(x => x.status === '使用中');
          const checkingIn = macList.find(x => x.status === '等候報到' || x.status === '等候提前確認');
          const waitingItems = macList
            .filter(x => x.status === '排隊中' || x.status === '等待中')
            .sort((a, b) => (a.startMinutes - b.startMinutes) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));

          // 1. 若有「現場排隊」正在「等候報到」（3 分鐘緩衝內尚未按開始），且開始時間已落後於現在時間，同步更新預計時段（保留原 called_at 不變）
          let effectiveCheckinEnd = checkingIn ? checkingIn.endMinutes : currentMin;
          if (!inUse && checkingIn && checkingIn.status === '等候報到' && checkingIn.type === '現場排隊' && checkingIn.startMinutes < currentMin) {
            const cDur = checkingIn.durationMinutes || Math.max(10, (checkingIn.endMinutes - checkingIn.startMinutes) || 10);
            const fixedSlotsForCheckin = waitingItems
              .filter(x => x.type === '時段預約' && !isOverdueReleasedReservation(x) && x.startMinutes + graceMin > currentMin)
              .map(s => ({ start: s.startMinutes, end: s.endMinutes }));
            const newCheckinStart = findEarliestValidStartForReservation(checkingIn, currentMin, fixedSlotsForCheckin, baseList, currentMin);
            const newCheckinEnd = newCheckinStart + cDur;
            effectiveCheckinEnd = newCheckinEnd;

            if (newCheckinStart !== checkingIn.startMinutes || newCheckinEnd !== checkingIn.endMinutes) {
              const { data: updChk } = await supabaseClient
                .from('reservations')
                .update({
                  start_minutes: newCheckinStart,
                  end_minutes: newCheckinEnd,
                  start_time_formatted: minutesToTime(newCheckinStart),
                  end_time_formatted: minutesToTime(newCheckinEnd),
                  started_at: null
                })
                .eq('id', checkingIn.id)
                .eq('status', '等候報到')
                .select('id');
              if (updChk && updChk.length > 0) {
                changedAny = true;
              }
            }
          }

          if (waitingItems.length === 0) continue;

          // 2. 區分「尚未逾時的固定時段預約」與「需隨時間推進預計時段的排隊/保留預約」
          const fixedValidSlots = waitingItems.filter(
            x => x.type === '時段預約' && !isOverdueReleasedReservation(x) && x.startMinutes + graceMin > currentMin
          );
          const rollingItems = waitingItems.filter(x => !fixedValidSlots.includes(x));
          if (rollingItems.length === 0) continue;

          let machineBaseMin = currentMin;
          if (inUse) {
            machineBaseMin = Math.max(machineBaseMin, inUse.endMinutes, currentMin + 1);
          }
          if (checkingIn) {
            machineBaseMin = Math.max(machineBaseMin, effectiveCheckinEnd);
          }

          const scheduledRanges = fixedValidSlots.map(s => ({ start: s.startMinutes, end: s.endMinutes }));
          if (inUse) {
            scheduledRanges.push({ start: Math.min(inUse.startMinutes, currentMin), end: Math.max(inUse.endMinutes, currentMin + 1) });
          }
          if (checkingIn) {
            scheduledRanges.push({ start: Math.min(checkingIn.startMinutes, currentMin), end: effectiveCheckinEnd });
          }

          let runningStart = machineBaseMin;
          for (const item of rollingItems) {
            const dur = item.durationMinutes || Math.max(10, (item.endMinutes - item.startMinutes) || 10);
            const minCandidate = isOverdueReleasedReservation(item)
              ? runningStart
              : Math.max(runningStart, item.startMinutes);
            const candStart = findEarliestValidStartForReservation(item, minCandidate, scheduledRanges, baseList, currentMin);
            const candEnd = candStart + dur;
            scheduledRanges.push({ start: candStart, end: candEnd });
            runningStart = candEnd;

            if (candStart !== item.startMinutes || candEnd !== item.endMinutes || Boolean(item.startedAt)) {
              const updatePayload = {
                start_minutes: candStart,
                end_minutes: candEnd,
                start_time_formatted: minutesToTime(candStart),
                end_time_formatted: minutesToTime(candEnd),
                started_at: null
              };
              if (Boolean(item.startedAt) && !item.calledAt) {
                updatePayload.called_at = item.startedAt;
              }

              const { data: updWait } = await supabaseClient
                .from('reservations')
                .update(updatePayload)
                .eq('id', item.id)
                .in('status', ['排隊中', '等待中'])
                .select('id');

              if (updWait && updWait.length > 0) {
                changedAny = true;
              }
            }
          }
        }

        return changedAny;
      }, []);

      // NOTE: 自動逾時掃描機制（每 8 秒自動輪詢）
      // 1. 現場排隊叫號逾時未報到 ➔ 交給 handleOverdueReservation（有人可替補就順延，沒有就保留並更新預計時段）
      // 2. 時段預約提前詢問 3 分鐘未回應 ➔ 保留原時段、叫下一位
      // 3. 時段預約開始後逾時未報到 ➔ 交給 handleOverdueReservation（有人可替補就順延，沒有就保留並更新預計時段）
      // 4. 時間已過但尚未按開始的保留預約 ➔ 自動透過 syncStaleWaitingSchedules 即時更新預計開始與結束時間
      useEffect(() => {
        const scanTimeout = async () => {
          if (!supabaseClient || isCoursePaused) return;
          // 背景分頁或鎖屏狀態不執行逾時寫入，避免喚醒瞬間拿凍結的舊快照誤改資料庫
          if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;
          if (isScanningRef.current) return;

          isScanningRef.current = true;
          try {
            let scanList = reservations;
            // 若距離上次成功同步已超過 6 秒（例如剛從背景切回前景），強制先拉取最新資料庫狀態
            if (Date.now() - lastRefreshAtRef.current > 6000) {
              const latest = await refreshData();
              if (!latest) return;
              scanList = latest;
            }
            if (!scanList || scanList.length === 0) return;

            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const graceMin = systemSettings?.checkin_grace_minutes !== undefined ? systemSettings.checkin_grace_minutes : 3;
            const graceMs = graceMin * 60 * 1000;

            let updatedAny = false;
            const machinesToAdvance = new Set();
            // NOTE: 同一輪掃描每台機台最多做一次替補調換，避免用過期的快照重複改動
            const swappedMachines = new Set();

            for (const r of scanList) {
              // 規則 0: 使用中的同學超過結束時間 -> 自動結束使用，並連動叫下一位、更新機台狀態
              if (r.status === '使用中' && typeof r.endMinutes === 'number' && currentMin >= r.endMinutes) {
                const { data: stopped, error: stopError } = await supabaseClient
                  .from('reservations')
                  .update({ status: '已完成', finished_at: now.toISOString() })
