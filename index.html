    // ============================================================
    // 5. 時段矩陣元件 (TimeTableMatrix) - 動態依照課程時段生成，支援彈性格數選擇
    // ============================================================
    const MINUTES_STEP = [0, 10, 20, 30, 40, 50];

    function TimeTableMatrix({ machineId, minDuration, maxDuration, selectedStartSlot, selectedDuration, selectedStudents, userEmail, onSelectSlot, onSelectDuration }) {
      const { reservations, systemSettings } = useApp();
      const effectiveTimes = getEffectiveCourseTimes(systemSettings);
      const courseStartMin = effectiveTimes.startTime.getHours() * 60 + effectiveTimes.startTime.getMinutes();
      const courseEndMin = effectiveTimes.endTime.getHours() * 60 + effectiveTimes.endTime.getMinutes();

      const startHour = Math.floor(courseStartMin / 60);
      const endHour = Math.floor((Math.max(courseEndMin, courseStartMin + 10) - 1) / 60);

      const hoursList = [];
      for (let h = startHour; h <= endHour; h++) {
        hoursList.push(h);
      }

      const selectedStartMinutes = selectedStartSlot ? timeToMinutes(selectedStartSlot) : null;
      // 實際被選中的格數（以分鐘計）
      const effectiveDuration = selectedDuration || maxDuration;

      const getSlotState = (slotMinutes) => {
        const timeLabel = minutesToTime(slotMinutes);

        // 超出課程時間
        if (slotMinutes < courseStartMin || slotMinutes >= courseEndMin) {
          return { status: 'out_of_course', symbol: '·', label: timeLabel };
        }

        // 已選中的範圍（依照 effectiveDuration 顯示）
        if (
          selectedStartMinutes !== null &&
          slotMinutes >= selectedStartMinutes &&
          slotMinutes < selectedStartMinutes + effectiveDuration
        ) {
          return { status: 'selected', symbol: '●', label: timeLabel };
        }

        // 1. 檢查本機台是否已被占用
        const isOccupied = reservations.some(r => {
          if (r.machineId !== machineId) return false;
          if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
          return slotMinutes >= r.startMinutes && slotMinutes < r.endMinutes;
        });

        if (isOccupied) {
          return { status: 'occupied', symbol: '■', label: timeLabel };
        }

        // 2. 檢查選定同學在其他機台是否已有預約（跨機台衝突）
        const studentHit = findStudentConflict(reservations, selectedStudents, userEmail, slotMinutes, 10);
        if (studentHit) {
          return { status: 'student_busy', symbol: '▲', label: timeLabel, conflictMachine: studentHit.machineName };
        }

        return { status: 'available', symbol: '○', label: timeLabel };
      };

      const handleCellClick = (slotMinutes) => {
        if (slotMinutes < courseStartMin || slotMinutes >= courseEndMin) return;

        // NOTE: 點擊邏輯——
        // 若已有起點，且點擊的格在已選範圍「內部」（非起點），則縮短到該格作為終點
        // 若點擊的格在已選範圍「之後」，且不超過 maxDuration，則延長到該格
        // 否則（點範圍外）：重新設定起點，duration 重置為 maxDuration

        if (selectedStartMinutes !== null) {
          const clickedOffset = slotMinutes - selectedStartMinutes; // 點擊格距起點的分鐘數

          if (clickedOffset > 0 && clickedOffset < effectiveDuration) {
            // 點選已選範圍「內部」：縮短，新 duration = clickedOffset + 10
            const newDuration = clickedOffset + 10;
            if (newDuration >= minDuration) {
              onSelectDuration(newDuration);
              return;
            }
          } else if (clickedOffset >= effectiveDuration && clickedOffset < maxDuration) {
            // 點選已選範圍「之後」：延長到該格（+10 分鐘）
            const newDuration = clickedOffset + 10;
            if (newDuration <= maxDuration) {
              // 檢查延長範圍內是否有本機台衝突
              if (hasReservationConflict(reservations, machineId, selectedStartMinutes, newDuration)) {
                alert(`時段衝突！延長到此格會與該機台已有預約重疊，請選其他範圍。`);
                return;
              }
              // 檢查延長範圍內是否有同學跨機台衝突
              const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, selectedStartMinutes, newDuration);
              if (studentConflict) {
                alert(`跨機台衝突！\n同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約，同時間不可重複預約！`);
                return;
              }
              onSelectDuration(newDuration);
              return;
            }
          }
        }

        // 設定新起點（或重選起點）
        if (slotMinutes + minDuration > courseEndMin) {
          alert(`無法預約！此時段距課程結束不足最少使用時長 ${minDuration} 分鐘（${minutesToTime(courseEndMin)} 結束）。`);
          return;
        }

        // 計算可用的最大 duration（不超過課程結束也不超過 maxDuration）
        const maxPossible = Math.min(maxDuration, courseEndMin - slotMinutes);
        // 對齊為 10 分鐘倍數
        const adjustedMax = Math.floor(maxPossible / 10) * 10;

        if (hasReservationConflict(reservations, machineId, slotMinutes, minDuration)) {
          alert(`時段衝突！該機台從 ${minutesToTime(slotMinutes)} 開始的最少時長（${minDuration} 分鐘）已有預約，請換時段！`);
          return;
        }

        const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, slotMinutes, minDuration);
        if (studentConflict) {
          alert(`跨機台時段衝突！\n名單中的同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約/排隊，同時間不可預約不同機台！`);
          return;
        }

        onSelectSlot(minutesToTime(slotMinutes));
        onSelectDuration(adjustedMax);
      };

      const selectedSlots = effectiveDuration / 10;
      const maxSlots = maxDuration / 10;
      const minSlots = minDuration / 10;

      return (
        <div className="space-y-2">
          <div className="flex items-center justify-between text-xs font-semibold text-slate-700">
            <span>課程時段矩陣 ({minutesToTime(courseStartMin)} ～ {minutesToTime(courseEndMin)})：</span>
            <div className="flex items-center gap-3 text-[11px]">
              <span className="text-emerald-600 font-bold">○ 可選</span>
              <span className="text-blue-600 font-bold">● 選定 ({selectedSlots}格)</span>
              <span className="text-slate-400 font-bold">■ 已占用</span>
              <span className="text-amber-600 font-bold">▲ 跨機台衝突</span>
            </div>
          </div>

          {/* NOTE: 提示使用者可自由調整格數範圍 */}
          <div className="text-[11px] text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
            💡 點選第一格設定起點，再點選範圍內或之後的格子可<strong>縮短或延長</strong>時長。
            可選 <strong className="text-blue-700">{minSlots} 格（{minDuration} 分鐘）</strong> ～ <strong className="text-blue-700">{maxSlots} 格（{maxDuration} 分鐘）</strong>。
          </div>

          <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-2xs">
            <table className="w-full text-center border-collapse text-xs">
              <thead>
                <tr className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <th className="py-2 px-1 border-r border-slate-200 w-14 text-[11px]">小時</th>
                  {MINUTES_STEP.map(m => (
                    <th key={m} className="py-2 px-0.5 border-r border-slate-100 last:border-r-0 text-[10.5px] font-semibold text-slate-600 whitespace-nowrap">
                      {m === 0 ? '0' : m}~{m + 10}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {hoursList.map(hNum => {
                  const hStr = hNum.toString().padStart(2, '0');
                  return (
                    <tr key={hNum} className="border-b border-slate-100 hover:bg-slate-50/50">
                      <td className="py-2 px-2 font-bold text-slate-700 bg-slate-50/80 border-r border-slate-200 text-xs">
                        {hStr}:00
                      </td>
                      {MINUTES_STEP.map(mStep => {
                        const slotMin = hNum * 60 + mStep;
                        const info = getSlotState(slotMin);
                        let style = 'text-slate-200 bg-slate-50/40 cursor-not-allowed select-none';
                        if (info.status === 'selected') style = 'bg-blue-600 text-white font-bold cursor-pointer';
                        else if (info.status === 'occupied') style = 'text-slate-400 bg-slate-100/90 font-bold cursor-not-allowed';
                        else if (info.status === 'student_busy') style = 'text-amber-600 bg-amber-50 font-bold cursor-pointer';
                        else if (info.status === 'available') style = 'text-emerald-600 hover:bg-emerald-50 cursor-pointer font-bold';

                        return (
                          <td
                            key={mStep}
                            className={`py-2 px-1 border-r border-slate-100 last:border-r-0 text-sm select-none ${style}`}
                            onClick={() => (info.status === 'available' || info.status === 'selected' || info.status === 'student_busy') && handleCellClick(slotMin)}
                            title={`${info.label} ${info.status === 'out_of_course' ? '(非課程時段)' : info.status === 'occupied' ? '(機台已占用)' : info.status === 'student_busy' ? `(同學在此時段已預約【${info.conflictMachine}】)` : info.status === 'selected' ? '(點擊縮短至此格)' : '(可預約)'}`}
                          >
                            {info.symbol}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {selectedStartSlot && (
            <div className="bg-blue-50 border border-blue-200 text-blue-900 px-3 py-2 rounded-xl text-xs flex items-center justify-between font-medium">
              <span>已選：<strong>{selectedStartSlot}</strong> ～ <strong>{minutesToTime(timeToMinutes(selectedStartSlot) + effectiveDuration)}</strong></span>
              <span className="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold">共 {effectiveDuration} 分鐘（{selectedSlots} 格）</span>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 6. 新增預約 / 現場排隊 Modal (連動 24h 前時段預約與開課現場排隊限制)
    // ============================================================
    function ReservationModal({ initialMachineId, onClose }) {
      const { machines, students, activeUser, reservations, systemSettings, createReservation } = useApp();
      const effectiveTimes = getEffectiveCourseTimes(systemSettings);
      const phaseInfo = getCurrentBookingPhase(systemSettings);

      const courseStartMin = effectiveTimes.startTime.getHours() * 60 + effectiveTimes.startTime.getMinutes();
      const courseEndMin = effectiveTimes.endTime.getHours() * 60 + effectiveTimes.endTime.getMinutes();

      const [selectedMachineId, setSelectedMachineId] = useState(initialMachineId || machines[0]?.id || '帶鋸機');
      const [reservationType, setReservationType] = useState(
        phaseInfo.allowedType === '現場排隊' ? '現場排隊' : '時段預約'
      );
      const [selectedStudents, setSelectedStudents] = useState([activeUser.name]);
      const [selectedSlotId, setSelectedSlotId] = useState(minutesToTime(courseStartMin));
      const [isSubmitting, setIsSubmitting] = useState(false);

      // NOTE: 最少固定 20 分鐘（2格），最多由學生人數決定
      const MIN_DURATION = 20;
      const maxDuration = calculateUsageMinutes(selectedStudents.length);
      // 使用者自選的時長 state，預設為最大值，切換學生人數時同步更新
      const [selectedDuration, setSelectedDuration] = useState(maxDuration);

      // 當學生人數改變時，若已選 duration > 新的最大值，則自動縮短；若 < 最小值則設回最小值
      useEffect(() => {
        setSelectedDuration(prev => Math.min(Math.max(prev, MIN_DURATION), maxDuration));
      }, [maxDuration]);

      // 切換時段時清除 duration 重設為最大值
      const handleSelectSlot = (slotId) => {
        setSelectedSlotId(slotId);
        setSelectedDuration(maxDuration);
      };

      // 現場排隊推算：傳入 selectedStudents 與 activeUser.mail，若同學在其他機台有排隊則自動往後順延
      const queueStartMin = calculateDynamicQueueStart(reservations, selectedMachineId, selectedDuration, courseEndMin, selectedStudents, activeUser?.mail);

      const isSlotAllowed = phaseInfo.phase === 'SLOT_ONLY';
      const isQueueAllowed = phaseInfo.phase === 'QUEUE_ONLY' && systemSettings?.allow_walk_in_queue !== false;

      useEffect(() => {
        if (phaseInfo.phase === 'QUEUE_ONLY') setReservationType('現場排隊');
        else if (phaseInfo.phase === 'SLOT_ONLY') setReservationType('時段預約');
      }, [phaseInfo.phase]);

      const toggleStudent = (sName) => {
        if (selectedStudents.includes(sName)) {
          if (selectedStudents.length === 1) return alert('預約必須至少選一位學生');
          setSelectedStudents(prev => prev.filter(s => s !== sName));
        } else {
          setSelectedStudents(prev => [...prev, sName]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!selectedMachineId) return alert('請選擇預約機台！');
        if (selectedStudents.length === 0) return alert('請至少選擇一位學生！');

        // 業務防呆驗證 (友善繁體中文提示)
        if (reservationType === '現場排隊') {
          if (phaseInfo.phase !== 'QUEUE_ONLY') {
            alert(`⚠️ 現在是非上課時段，不能進行現場排隊預約！\n\n• 現場排隊開放時段：課程進行中 (${formatDateTime(effectiveTimes.startTime)} ～ ${formatDateTime(effectiveTimes.endTime)})\n• 如需預約下堂課，請於開課前 24 小時使用「時段預約」。`);
            return;
          }
          if (systemSettings?.allow_walk_in_queue === false) {
            alert('⚠️ 目前系統已關閉現場排隊功能，請洽授課老師/助教！');
            return;
          }
        }

        if (reservationType === '時段預約') {
          if (phaseInfo.phase !== 'SLOT_ONLY') {
            if (phaseInfo.phase === 'QUEUE_ONLY') {
              alert('⚠️ 課程已開始進行中，目前僅開放「現場排隊」，時段預約已截止！');
            } else if (phaseInfo.phase === 'NOT_OPEN') {
              alert(`⚠️ 現在非時段預約開放時間！\n\n系統將於課程開始前 24 小時（${formatDateTime(effectiveTimes.openBookingTime)}）正式開放時段預約。`);
            } else {
              alert('⚠️ 本次課程已經結束，不再接受預約！');
            }
            return;
          }

          if (!selectedSlotId) return alert('請於時段矩陣中點選開始預約之時段！');
        }

        setIsSubmitting(true);
        try {
          const res = await createReservation({
            machineId: selectedMachineId,
            type: reservationType,
            students: selectedStudents,
            timeSlotId: selectedSlotId,
            // NOTE: 傳入使用者自選的 duration，後端以此為準而非重新計算
            customDuration: selectedDuration
          });
          if (!res.success) {
            alert(`❌ 預約失敗：${res.message}`);
          } else {
            alert(`✅ ${res.message}`);
            onClose();
          }
        } catch (err) {
          alert(`❌ 系統提示：${err.message || '預約處理發生錯誤'}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[92vh] border border-slate-200">
            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
              <div>
                <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span>🛠️</span> 新增機台預約 / 現場排隊
                </h3>
                <p className="text-[11px] text-slate-500 font-semibold mt-0.5">
                  課程時間：{formatDateTime(effectiveTimes.startTime)} ～ {formatDateTime(effectiveTimes.endTime)}
                </p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg font-bold p-1">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4">
              {/* 開放狀態提示 Banner */}
              <div className={`p-3.5 rounded-2xl border text-xs flex items-start gap-2 ${
                phaseInfo.phase === 'SLOT_ONLY'
                  ? 'bg-blue-50 border-blue-200 text-blue-900'
                  : phaseInfo.phase === 'QUEUE_ONLY'
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
                  : 'bg-amber-50 border-amber-200 text-amber-900'
              }`}>
                <span>{phaseInfo.phase === 'QUEUE_ONLY' ? '⏱️' : phaseInfo.phase === 'SLOT_ONLY' ? '📅' : '⚠️'}</span>
                <div>
                  <div className="font-bold">{phaseInfo.title}</div>
                  <div className="text-[11px] opacity-90 mt-0.5">{phaseInfo.description}</div>
                </div>
              </div>

              {/* 模式切換頁籤 (Tab) - 連動限制 */}
              <div className="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl gap-1">
                <button
                  type="button"
                  className={`py-2 px-3 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all ${
                    reservationType === '時段預約'
                      ? 'bg-white text-blue-600 shadow-xs'
                      : isSlotAllowed
                      ? 'text-slate-600 hover:text-slate-900'
                      : 'text-slate-400 bg-slate-100/50 cursor-pointer'
                  }`}
                  onClick={() => setReservationType('時段預約')}
                >
                  📅 時段預約 (24h前開放) {!isSlotAllowed && '🔒'}
                </button>
                <button
                  type="button"
                  className={`py-2 px-3 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all ${
                    reservationType === '現場排隊'
                      ? 'bg-white text-blue-600 shadow-xs'
                      : isQueueAllowed
                      ? 'text-slate-600 hover:text-slate-900'
                      : 'text-slate-400 bg-slate-100/50 cursor-pointer'
                  }`}
                  onClick={() => setReservationType('現場排隊')}
                >
                  ⏱️ 現場排隊 (上課時開放) {!isQueueAllowed && '🔒'}
                </button>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">預約機台：</label>
                <select
                  className="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold bg-white text-slate-900"
                  value={selectedMachineId}
                  onChange={e => setSelectedMachineId(e.target.value)}
                >
                  {machines.map(m => (
                    <option key={m.id} value={m.id}>{m.name} ({m.status})</option>
                  ))}
                </select>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label className="text-xs font-bold text-slate-700">選擇學生名單 (連動人數時長)：</label>
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-200">
                    {selectedStudents.length} 人 ➔ 最多 {maxDuration} 分鐘
                  </span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 text-xs">
                  {students.map(s => {
                    const sel = selectedStudents.includes(s.name);
                    return (
                      <label key={s.id} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer ${sel ? 'bg-blue-50 border-blue-300 text-blue-900 font-bold' : 'bg-white border-slate-200 text-slate-700'}`}>
                        <input
                          type="checkbox"
                          checked={sel}
                          onChange={() => toggleStudent(s.name)}
                          className="rounded text-blue-600"
                        />
                        <span>{s.name}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {reservationType === '時段預約' ? (
                <TimeTableMatrix
                  machineId={selectedMachineId}
                  minDuration={MIN_DURATION}
                  maxDuration={maxDuration}
                  selectedStartSlot={selectedSlotId}
                  selectedDuration={selectedDuration}
                  selectedStudents={selectedStudents}
                  userEmail={activeUser?.mail}
                  onSelectSlot={handleSelectSlot}
                  onSelectDuration={setSelectedDuration}
                />
              ) : (
                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl space-y-2 text-xs">
                  <p className="text-emerald-900 font-bold">現場排隊即時推算：</p>
                  <p className="text-emerald-800">目前課程進行中，依據機台現有隊列為您推算之預計開始時間為：</p>
                  <div className="bg-white p-3 rounded-xl border border-emerald-200 font-mono text-sm text-center font-bold text-slate-900">
                    {minutesToTime(queueStartMin)} ～ {minutesToTime(queueStartMin + selectedDuration)}
                  </div>
                </div>
              )}

              <div className="pt-3 border-t border-slate-100 flex justify-end gap-3">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">取消</button>
                <button type="submit" disabled={isSubmitting} className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md shadow-blue-500/20">
                  {isSubmitting ? '送出中...' : '確認送出申請'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // ============================================================
    // 7. 機台圖卡 (MachineCard) - 精簡版純圖卡，點擊進入詳情
    // ============================================================
    function MachineCard({ machine, onSelect }) {
      let bgClass = 'status-idle';
      let badge = '🟢 空閒';
      let hex = '#E8F5E9';

      if (machine.status === '使用中') {
        bgClass = 'status-busy';
        badge = '🔴 使用中';
        hex = '#FFEBEE';
      } else if (machine.status === '等待報到') {
        bgClass = 'status-waiting';
        badge = '🟡 等候報到';
        hex = '#FFF8E1';
      }

      return (
        <div
          className={`p-5 rounded-2xl shadow-xs border flex flex-col justify-between transition-all hover:shadow-md active:scale-[0.98] cursor-pointer ${bgClass}`}
          style={{ backgroundColor: hex }}
          onClick={() => onSelect(machine)}
        >
          {/* 頂部圖示與狀態標籤 */}
          <div className="flex items-start justify-between mb-3">
            <div>
              <div className="w-9 h-9 rounded-full bg-black/5 flex items-center justify-center mb-2">
                <span className="text-base">🪚</span>
              </div>
              <h3 className="text-xl font-bold text-slate-900 leading-snug">{machine.name}</h3>
              <p className="text-xs font-semibold text-slate-500 mt-0.5">工廠機台</p>
            </div>
            <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-white/80 border border-slate-200 shadow-2xs">
              {badge}
            </span>
          </div>

          {/* 目前使用者與下一位 */}
          <div className="pt-3 border-t border-black/5">
            <p className="text-xs font-medium text-slate-600">
              目前使用：<span className="font-bold text-slate-800">{machine.currentUserName || '—'}</span>
              {' '}／{' '}
              下一位：<span className="font-bold text-slate-800">{machine.nextUserName || '—'}</span>
            </p>
            <p className="text-[10px] text-slate-400 mt-1.5 flex items-center gap-1">
              <span>點擊查看詳情與預約 →</span>
            </p>
          </div>
        </div>
      );
    }

    // ============================================================
    // 7b. 機台詳情頁 (MachineDetailView) - 顯示排隊清單 + 最快可用時段 + 新增預約
    // ============================================================
    function MachineDetailView({ machine, onBack, onOpenReservationModal }) {
      const { reservations, systemSettings } = useApp();

      // 取得此機台的有效排隊（排除已完成/已取消）
      const machineReservations = reservations
        .filter(r => r.machineId === machine.id && (r.status === '使用中' || r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中'))
        .sort((a, b) => a.startMinutes - b.startMinutes);

      // 計算最快可用時段（動態佇列算法）
      const getNextAvailableTime = () => {
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();
        const roundedNow = Math.ceil(currentMin / 10) * 10;

        if (machineReservations.length === 0) {
          return `現在可立即使用（${minutesToTime(roundedNow)} 起）`;
        }

        const lastRes = machineReservations[machineReservations.length - 1];
        const nextStart = Math.max(lastRes.endMinutes, roundedNow);
        return `${minutesToTime(nextStart)} 開始`;
      };

      // 目前階段（判斷顯示哪種預約方式）
      const phase = systemSettings ? getCurrentBookingPhase(systemSettings) : null;
      const canBook = phase && phase.allowedType !== 'NONE';
      const phaseLabel = phase
        ? (phase.allowedType === '現場排隊' ? '🎟️ 現場排隊（上課時開放）' : phase.allowedType === '時段預約' ? '📅 時段預約（開課前 24 小時）' : '🔒 目前不開放預約')
        : '讀取中...';

      let hex = '#E8F5E9';
      if (machine.status === '使用中') hex = '#FFEBEE';
      else if (machine.status === '等待報到') hex = '#FFF8E1';

      return (
        <div className="space-y-3">
          {/* 頂部返回列 */}
          <div className="flex items-center gap-3">
            <button
              onClick={onBack}
              className="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors shadow-xs"
            >
              ← 返回
            </button>
            <h3 className="font-bold text-slate-900 text-base">{machine.name}</h3>
          </div>

          {/* 機台基本狀態卡 */}
          <div
            className="p-4 rounded-2xl border shadow-xs"
            style={{ backgroundColor: hex }}
          >
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🪚</span>
                <div>
                  <h4 className="font-bold text-slate-900">{machine.name}</h4>
                  <p className="text-xs text-slate-500">工廠機台</p>
                </div>
              </div>
              <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/80 border border-slate-200">
                {machine.status === '使用中' ? '🔴 使用中' : machine.status === '等待報到' ? '🟡 等候報到' : '🟢 空閒'}
              </span>
            </div>
          </div>

          {/* 目前排隊清單 */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
              <span className="text-sm font-bold text-slate-800">📋 目前預約排隊清單</span>
              <span className="text-[11px] bg-slate-100 text-slate-500 font-semibold px-2 py-0.5 rounded-full">
                {machineReservations.length} 組
              </span>
            </div>

            {machineReservations.length === 0 ? (
              <div className="px-4 py-6 text-center text-slate-400 text-sm">
                <p className="text-2xl mb-2">✅</p>
                <p className="font-semibold">目前無人排隊</p>
                <p className="text-xs mt-1">可立即新增預約！</p>
              </div>
            ) : (
              <div className="divide-y divide-slate-50">
                {machineReservations.map((res, index) => (
                  <div key={res.id} className="px-4 py-3 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      {/* 順序號碼 */}
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${
                        res.status === '使用中' ? 'bg-red-100 text-red-600' :
                        res.status === '等候報到' ? 'bg-amber-100 text-amber-700' :
                        'bg-slate-100 text-slate-600'
                      }`}>
                        {index + 1}
                      </div>
                      <div>
                        <p className="text-sm font-bold text-slate-900">{res.students.join(', ')}</p>
                        <p className="text-xs text-slate-500">{res.type}</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <p className="text-sm font-bold text-slate-800">{res.startTimeFormatted} ～ {res.endTimeFormatted}</p>
                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                        res.status === '使用中' ? 'bg-red-50 text-red-600' :
                        res.status === '等候報到' ? 'bg-amber-50 text-amber-700' :
                        'bg-blue-50 text-blue-600'
                      }`}>
                        {res.status}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 最快可用時段資訊 */}
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl px-4 py-3.5">
            <p className="text-xs font-bold text-emerald-700 mb-1">⚡ 最快可使用時段</p>
            <p className="text-base font-bold text-emerald-900">{getNextAvailableTime()}</p>
            {phase && (
              <p className="text-[11px] text-emerald-600 mt-1">{phaseLabel}</p>
            )}
          </div>

          {/* 新增預約按鈕 */}
          <button
            onClick={() => onOpenReservationModal(machine.id)}
            className={`w-full py-4 rounded-2xl font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-all active:scale-[0.98] ${
              canBook
                ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/20'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
            }`}
            disabled={!canBook}
          >
            <span>＋</span>
            <span>新增預約 / 排隊</span>
          </button>
        </div>
      );
    }

    // ============================================================
    // 8. 我的預約 (MyReservationsView) - 1:1 截圖 2 (精準綁定預約 ID)
    // ============================================================
    function MyReservationsView() {
      const { reservations, activeUser, cancelReservation, startMachineUsage, finishMachineUsage, clearCompletedReservations } = useApp();
      const [isClearing, setIsClearing] = useState(false);
      
      const myRes = reservations
        .filter(r => r.email === activeUser.mail || r.students.includes(activeUser.name))
        .sort((a, b) => {
          const statusWeight = (s) => {
            if (s === '使用中') return 1;
            if (s === '等候報到') return 2;
            if (s === '排隊中' || s === '等待中') return 3;
            return 4;
          };
          const wDiff = statusWeight(a.status) - statusWeight(b.status);
          if (wDiff !== 0) return wDiff;
          return a.startMinutes - b.startMinutes;
        });

      const completedList = myRes.filter(r => r.status === '已完成' || r.status === '已取消');
      const hasCompleted = completedList.length > 0;

      const handleClearCompleted = async () => {
        if (!hasCompleted) return alert('目前沒有已完成或已取消的歷史紀錄需要清除！');
        const ok = window.confirm(`確定要清除【${activeUser.name}】所有的已完成預約紀錄嗎？\n\n共 ${completedList.length} 筆歷史紀錄將從 Database 中永久移除。`);
        if (!ok) return;

        setIsClearing(true);
        try {
          const res = await clearCompletedReservations();
          alert(res.message);
        } finally {
          setIsClearing(false);
        }
      };

      return (
        <div className="space-y-3 pb-2">
          {myRes.length === 0 ? (
            <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 text-slate-500 space-y-1">
              <span className="text-3xl block mb-2">📋</span>
              <p className="font-bold text-sm text-slate-800">目前尚無預約紀錄</p>
              <p className="text-xs text-slate-400">請至「機台列表」點擊新增預約。</p>
            </div>
          ) : (
            myRes.map(res => {
              const finished = res.status === '已完成' || res.status === '已取消';
              const isInUse = res.status === '使用中';

              return (
                <div key={res.id} className={`bg-white rounded-2xl p-5 shadow-xs border flex flex-col justify-between space-y-3 ${isInUse ? 'border-red-200 ring-1 ring-red-100 bg-red-50/10' : 'border-slate-200'}`}>
                  <div>
                    <h4 className="text-base font-bold text-slate-900">{res.students.join(', ')}</h4>
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-slate-900 mb-1">{res.machineName}</h3>
                    <div className="flex items-center gap-2 text-xs text-slate-500">
                      <span className="bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded">{res.type}</span>
                      <span>{res.startTimeFormatted} ～ {res.endTimeFormatted} ({res.durationMinutes}分)</span>
                      <span className={`font-bold px-1.5 py-0.5 rounded text-[11px] ${isInUse ? 'bg-red-50 text-red-600 border border-red-200' : res.status === '等候報到' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'text-blue-600'}`}>
                        [{res.status}]
                      </span>
                    </div>
                  </div>

                  {!finished && (
                    <div className="pt-3.5 border-t border-slate-100 flex items-center justify-between">
                      {!isInUse ? (
                        <button onClick={() => cancelReservation(res.id)} className="text-sm font-semibold text-blue-600 hover:text-blue-800">
                          取消
                        </button>
                      ) : (
                        <span className="text-xs text-slate-400 font-medium">使用中（結束請按右側按鈕）</span>
                      )}

                      {!isInUse ? (
                        <button
                          onClick={() => startMachineUsage(res.machineId, res.id)}
                          className="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center hover:bg-slate-800 shadow-md transition-transform active:scale-95"
                          title="開始使用 (立即報到)"
                        >
                          ▶
                        </button>
                      ) : (
                        <button
                          onClick={() => finishMachineUsage(res.machineId, res.id)}
                          className="w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center hover:bg-red-700 shadow-md shadow-red-500/20 text-sm font-bold transition-transform active:scale-95"
                          title="結束使用 (系統將自動呼叫下一位同學)"
                        >
                          ⏹
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })
          )}

          {hasCompleted && (
            <div className="pt-2 text-center">
              <button
                type="button"
                disabled={isClearing}
                onClick={handleClearCompleted}
                className="w-full py-3 px-4 rounded-2xl bg-white hover:bg-red-50 text-red-600 border border-red-200 text-xs font-bold shadow-xs hover:border-red-300 transition-all flex items-center justify-center gap-2 active:scale-98"
              >
                <span>🗑️</span>
                <span>{isClearing ? '正在自 Database 清除中...' : `清除已完成預約紀錄 (${completedList.length} 筆)`}</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 9. 課程場次 (CourseSessionsView) - 支援課程暫停計時與時段順延控制
    // ============================================================
    function CourseSessionsView() {
      const { courseSessions, setCurrentCourseSession, isCoursePaused, coursePausedAt, pauseCourse, resumeCourse } = useApp();
      const [isProcessing, setIsProcessing] = useState(false);
      const [elapsedSec, setElapsedSec] = useState(0);
      const [showAdminOverview, setShowAdminOverview] = useState(false);

      // 動態計時碼表：暫停中時每秒跳動
      useEffect(() => {
        if (!isCoursePaused || !coursePausedAt) {
          setElapsedSec(0);
          return;
        }
        const updateTimer = () => {
          const diff = Math.max(0, Math.floor((Date.now() - new Date(coursePausedAt).getTime()) / 1000));
          setElapsedSec(diff);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [isCoursePaused, coursePausedAt]);

      const formatStopwatch = (totalSec) => {
        const mm = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const ss = (totalSec % 60).toString().padStart(2, '0');
        return `${mm}:${ss}`;
      };

      const handlePause = async () => {
        const ok = window.confirm('確定要暫停課程（開始講解計時）嗎？\n\n• 系統將即時停止所有同學的機台操作與報到。\n• 恢復課程時，所有預約將依暫停的時間自動往後順延！');
        if (!ok) return;
        setIsProcessing(true);
        try {
          await pauseCourse('老師講解中');
        } finally {
          setIsProcessing(false);
        }
      };

      const handleResume = async () => {
        const estMin = Math.max(1, Math.ceil(elapsedSec / 60));
        const ok = window.confirm(`確定要恢復課程嗎？\n\n目前已暫停約 ${estMin} 分鐘，恢復後系統將自動把所有進行中與排隊中的預約時段往後順延 ${estMin} 分鐘！`);
        if (!ok) return;
        setIsProcessing(true);
        try {
          const res = await resumeCourse();
          alert(`✅ 課程已順利恢復！\n\n共將 ${res.count} 筆預約時段自動往後順延 ${res.elapsedMin} 分鐘。`);
        } finally {
          setIsProcessing(false);
        }
      };

      // 若切換至管理者全機台預約總覽頁面
      if (showAdminOverview) {
        return <AdminReservationsOverviewView onBack={() => setShowAdminOverview(false)} />;
      }

      return (
        <div className="space-y-4">
          {/* NOTE: 老師/助教專用 —— 進入管理者全機台預約總覽頁面 */}
          <div className="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 rounded-3xl p-5 text-white shadow-md">
            <div className="flex items-center justify-between">
              <div className="space-y-1">
                <span className="inline-block bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                  👑 管理者專用功能
                </span>
                <h3 className="text-base font-bold text-white leading-tight">全機台預約管理總覽</h3>
                <p className="text-[11px] text-blue-100 font-medium">依機台分類檢視全班同學的預約時段與排隊順序</p>
              </div>
              <button
                type="button"
                onClick={() => setShowAdminOverview(true)}
                className="py-2.5 px-3.5 rounded-2xl bg-white text-blue-700 hover:bg-blue-50 active:scale-95 text-xs font-bold shadow-sm transition-all flex items-center gap-1 shrink-0 cursor-pointer"
              >
                <span>進入頁面</span>
                <span>➔</span>
              </button>
            </div>
          </div>

          {/* NOTE: 老師/助教專用 —— 課程暫停與講解控制卡片 */}
          <div className={`p-5 rounded-3xl border transition-all shadow-xs ${
            isCoursePaused 
              ? 'bg-amber-50 border-amber-300 ring-2 ring-amber-400/50' 
              : 'bg-white border-slate-200'
          }`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">{isCoursePaused ? '⏸️' : '⏱️'}</span>
                <div>
                  <h3 className="text-base font-bold text-slate-900 leading-tight">課程暫停與講解控制</h3>
                  <p className="text-[11px] text-slate-500 font-semibold mt-0.5">老師講解示範時可暫停預約並自動順延</p>
                </div>
              </div>
              <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${
                isCoursePaused 
                  ? 'bg-amber-100 border-amber-300 text-amber-800 animate-pulse' 
                  : 'bg-emerald-50 border-emerald-200 text-emerald-700'
              }`}>
                {isCoursePaused ? '⏸️ 講解暫停中' : '🟢 課程進行中'}
              </span>
            </div>

            {isCoursePaused ? (
              <div className="space-y-4">
                {/* 碼表大計時器 */}
                <div className="bg-white/90 border border-amber-200 rounded-2xl p-4 text-center">
                  <div className="text-[11px] font-bold text-amber-700 uppercase tracking-wider mb-1">
                    ⏱️ 講解已暫停時間
                  </div>
                  <div className="font-mono text-3xl font-extrabold text-amber-900 tracking-wider">
                    {formatStopwatch(elapsedSec)}
                  </div>
                  <div className="text-[10px] text-amber-600 font-semibold mt-1">
                    （每滿 1 分鐘時段將自動往後遞延 1 分鐘）
                  </div>
                </div>

                <button
                  type="button"
                  disabled={isProcessing}
                  onClick={handleResume}
                  className="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-sm font-bold shadow-md shadow-emerald-500/25 flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                  <span className="text-base">▶️</span>
                  <span>{isProcessing ? '正在計算並順延時段...' : '恢復課程（結束講解並自動順延）'}</span>
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  💡 <strong>使用說明：</strong>當需要集合全班講解時，點擊下方按鈕啟動暫停。系統將即時碼表計時，待講解結束恢復時，所有排隊與時段將<strong>精準往後順延</strong>。
                </p>
                <button
                  type="button"
                  disabled={isProcessing}
                  onClick={handlePause}
                  className="w-full py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white text-sm font-bold shadow-md shadow-amber-500/20 flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                  <span className="text-base">⏸️</span>
                  <span>{isProcessing ? '啟動暫停中...' : '暫停課程（開始講解計時）'}</span>
                </button>
              </div>
            )}
          </div>

          {/* 場次清單卡片 */}
          <div className="bg-white rounded-3xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-xs">
            <div className="px-5 py-3.5 bg-slate-50/80 border-b border-slate-100 flex items-center justify-between">
              <h4 className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                <span>📚</span> 課程預設時段場次
              </h4>
              <span className="text-[10px] text-slate-400 font-semibold">點擊 ✓ 切換目前場次</span>
            </div>
            {courseSessions.map(session => (
              <div key={session.id} className="p-4 flex items-center justify-between hover:bg-slate-50">
                <div className="space-y-1">
                  <span className={`inline-block text-xs font-bold px-2 py-0.5 rounded ${session.isCurrent ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-600'}`}>
                    {session.isCurrent ? 'Y' : 'N'}
                  </span>
                  <h4 className="text-base font-bold text-slate-800">
                    {session.notes || `${session.sessionId}：${session.startTime.substring(0,5)}－${session.endTime.substring(0,5)}`}
                  </h4>
                </div>

                <div className="flex items-center gap-2 text-slate-500">
                  <button onClick={() => alert('預設場次不可刪除')} className="p-2 hover:text-red-600">🗑️</button>
                  <button onClick={() => alert(`編輯【${session.sessionId}】`)} className="p-2 hover:text-blue-600">✏️</button>
                  <button 
                    onClick={() => {
                      setCurrentCourseSession(session.id);
                      alert(`已呼叫系統設定同步：設【${session.sessionId}】為目前場次！`);
                    }}
                    className={`p-2 ${session.isCurrent ? 'text-emerald-600 font-bold' : 'hover:text-emerald-600'}`}
                  >
                    ✓
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // 9.5 管理者預約總覽 (AdminReservationsOverviewView)
    // 依機台順序展示全班所有預約場次、排隊與狀態
    // ============================================================
    function AdminReservationsOverviewView({ onBack }) {
      const { machines, reservations, startMachineUsage, finishMachineUsage, cancelReservation } = useApp();
      const [filterStatus, setFilterStatus] = useState('ALL'); // 'ALL', 'ACTIVE', 'COMPLETED', 'CANCELLED'

      // 篩選預約
      const filteredReservations = useMemo(() => {
        if (filterStatus === 'ALL') return reservations;
        if (filterStatus === 'ACTIVE') {
          return reservations.filter(r => r.status === '使用中' || r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中');
        }
        if (filterStatus === 'COMPLETED') {
          return reservations.filter(r => r.status === '已完成');
        }
        if (filterStatus === 'CANCELLED') {
          return reservations.filter(r => r.status === '已取消' || r.status === '未報到');
        }
        return reservations;
      }, [reservations, filterStatus]);

      // 統計數據
      const totalCount = reservations.length;
      const inUseCount = reservations.filter(r => r.status === '使用中').length;
      const waitingCount = reservations.filter(r => r.status === '等候報到' || r.status === '排隊中').length;

      return (
        <div className="space-y-4">
          {/* 返回與標題列 */}
          <div className="bg-white rounded-3xl p-4 shadow-xs border border-slate-200 flex items-center justify-between">
            <button
              type="button"
              onClick={onBack}
              className="flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-slate-950 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition-all active:scale-95 cursor-pointer"
            >
              <span>←</span>
              <span>返回課程場次</span>
            </button>
            <div className="text-right">
              <span className="text-[10px] font-bold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full border border-blue-200">
                👑 全機台預約管理總覽
              </span>
            </div>
          </div>

          {/* 統計摘要卡片 */}
          <div className="grid grid-cols-3 gap-2">
            <div className="bg-white rounded-2xl p-3 border border-slate-200 text-center shadow-xs">
              <div className="text-[10px] font-bold text-slate-500 mb-0.5">總預約筆數</div>
              <div className="text-lg font-black text-slate-900">{totalCount}</div>
            </div>
            <div className="bg-white rounded-2xl p-3 border border-red-200 text-center shadow-xs bg-red-50/20">
              <div className="text-[10px] font-bold text-red-500 mb-0.5">使用中</div>
              <div className="text-lg font-black text-red-600">{inUseCount}</div>
            </div>
            <div className="bg-white rounded-2xl p-3 border border-amber-200 text-center shadow-xs bg-amber-50/20">
              <div className="text-[10px] font-bold text-amber-600 mb-0.5">等候/排隊</div>
              <div className="text-lg font-black text-amber-700">{waitingCount}</div>
            </div>
          </div>

          {/* 狀態過濾按鈕組 */}
          <div className="grid grid-cols-4 bg-slate-200/80 p-1 rounded-2xl text-[11px] font-bold">
            {[
              { id: 'ALL', label: '全部' },
              { id: 'ACTIVE', label: '進行中' },
              { id: 'COMPLETED', label: '已完成' },
              { id: 'CANCELLED', label: '已取消' }
            ].map(f => (
              <button
                key={f.id}
                type="button"
                onClick={() => setFilterStatus(f.id)}
                className={`py-1.5 rounded-xl transition-all cursor-pointer ${
                  filterStatus === f.id ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {/* 依機台順序排列的清單 */}
          <div className="space-y-4">
            {machines.map(mac => {
              const macReservations = filteredReservations
                .filter(r => r.machineId === mac.id)
                .sort((a, b) => a.startMinutes - b.startMinutes);

              const inUseRes = reservations.find(r => r.machineId === mac.id && r.status === '使用中');
              const waitingRes = reservations.filter(r => r.machineId === mac.id && (r.status === '等候報到' || r.status === '排隊中'));

              return (
                <div key={mac.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xs">
                  {/* 機台標頭 */}
                  <div className="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <span className="text-xl">🪚</span>
                      <div>
                        <h3 className="text-base font-bold text-slate-900 leading-tight">{mac.name}</h3>
                        <div className="text-[10px] text-slate-500 font-semibold mt-0.5 flex items-center gap-2">
                          <span>使用中: {inUseRes ? '1' : '0'}</span>
                          <span>•</span>
                          <span>排隊中: {waitingRes.length}</span>
                        </div>
                      </div>
                    </div>

                    <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${
                      mac.status === '使用中' 
                        ? 'bg-red-50 text-red-700 border-red-200 animate-pulse' 
                        : mac.status === '等待報到' 
                        ? 'bg-amber-50 text-amber-700 border-amber-200' 
                        : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                    }`}>
                      {mac.status === '使用中' ? '🔴 使用中' : mac.status === '等待報到' ? '🟡 等待報到' : '🟢 空閒'}
                    </span>
                  </div>

                  {/* 該機台的預約列表 */}
                  <div className="divide-y divide-slate-100">
                    {macReservations.length === 0 ? (
                      <div className="p-5 text-center text-xs text-slate-400 font-semibold">
                        📭 目前無此分類的預約紀錄
                      </div>
                    ) : (
                      macReservations.map(res => {
                        const isInUse = res.status === '使用中';
                        const isWait = res.status === '等候報到';
                        const isQueue = res.status === '排隊中';
                        const isFinished = res.status === '已完成' || res.status === '已取消' || res.status === '未報到';

                        return (
                          <div 
                            key={res.id} 
                            className={`p-4 transition-colors ${
                              isInUse ? 'bg-red-50/30' : isWait ? 'bg-amber-50/30' : 'hover:bg-slate-50/60'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-2">
                              <div className="space-y-1">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                    res.type === '現場排隊' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'
                                  }`}>
                                    {res.type === '現場排隊' ? '⚡ 現場排隊' : '🕒 時段預約'}
                                  </span>

                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                                    isInUse 
                                      ? 'bg-red-100 text-red-800 border-red-200' 
                                      : isWait 
                                      ? 'bg-amber-100 text-amber-800 border-amber-300 animate-pulse' 
                                      : isQueue 
                                      ? 'bg-blue-50 text-blue-700 border-blue-200' 
                                      : res.status === '已完成' 
                                      ? 'bg-slate-100 text-slate-600 border-slate-200' 
                                      : 'bg-red-50 text-red-500 border-red-200'
                                  }`}>
                                    {res.status}
                                  </span>
                                </div>

                                <h4 className="text-sm font-bold text-slate-900 pt-0.5">
                                  👤 {res.students.join(', ')}
                                </h4>

                                <div className="text-xs text-slate-600 font-semibold flex items-center gap-2">
                                  <span>🕒 {res.startTimeFormatted} ～ {res.endTimeFormatted}</span>
                                  <span>({res.durationMinutes} 分鐘)</span>
                                </div>

                                <div className="text-[10px] text-slate-400">
                                  ✉️ {res.email} {res.calledAt ? `• 叫號於 ${new Date(res.calledAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}` : ''}
                                </div>
                              </div>

                              {/* 管理員即時操作快捷鈕 */}
                              {!isFinished && (
                                <div className="flex items-center gap-1.5 shrink-0 pt-1">
                                  {!isInUse ? (
                                    <>
                                      <button
                                        type="button"
                                        onClick={() => {
                                          if (window.confirm(`確定將【${res.students.join(', ')}】設為開始使用機台嗎？`)) {
                                            startMachineUsage(res.machineId, res.id);
                                          }
                                        }}
                                        className="py-1.5 px-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 active:scale-95 shadow-xs cursor-pointer"
                                        title="立即開始使用 (報到)"
                                      >
                                        ▶ 開始
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => {
                                          if (window.confirm(`確定要取消【${res.students.join(', ')}】的預約嗎？`)) {
                                            cancelReservation(res.id);
                                          }
                                        }}
                                        className="py-1.5 px-2.5 rounded-xl bg-slate-100 text-red-600 text-xs font-bold hover:bg-red-50 active:scale-95 border border-slate-200 cursor-pointer"
                                        title="取消此預約"
                                      >
                                        ✕
                                      </button>
                                    </>
                                  ) : (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        if (window.confirm(`確定結束【${res.students.join(', ')}】的使用嗎？\n系統將自動叫號下一位排隊同學！`)) {
                                          finishMachineUsage(res.machineId, res.id);
                                        }
                                      }}
                                      className="py-1.5 px-3 rounded-xl bg-red-600 text-white text-xs font-bold hover:bg-red-700 active:scale-95 shadow-sm shadow-red-500/20 cursor-pointer"
                                      title="結束使用"
                                    >
                                      ⏹ 結束
                                    </button>
                                  )}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ============================================================
    // 10. 預約設定 (BookingSettingsView) - 支援自動模式週三與手動自訂
    // ============================================================
    function BookingSettingsView() {
      const { systemSettings, updateSettings } = useApp();
      const [controlMode, setControlMode] = useState('自動');
      const [startT, setStartT] = useState('');
      const [endT, setEndT] = useState('');
      const [grace, setGrace] = useState(5);
      const [walkIn, setWalkIn] = useState(true);
      const [saving, setSaving] = useState(false);

      const isDirtyRef = React.useRef(false);
      const isInitializedRef = React.useRef(false);

      const toInput = (d) => {
        if (!d) return '';
        const date = new Date(d);
        const yyyy = date.getFullYear();
        const mm = (date.getMonth() + 1).toString().padStart(2, '0');
        const dd = date.getDate().toString().padStart(2, '0');
        const hh = date.getHours().toString().padStart(2, '0');
        const min = date.getMinutes().toString().padStart(2, '0');
        return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
      };

      useEffect(() => {
        if (systemSettings && (!isInitializedRef.current || !isDirtyRef.current)) {
          const mode = systemSettings.control_mode || systemSettings.controlMode || '自動';
          setControlMode(mode);
          setGrace(systemSettings.checkin_grace_minutes || 5);
          setWalkIn(systemSettings.allow_walk_in_queue ?? true);

          const eff = getEffectiveCourseTimes(systemSettings);
          setStartT(toInput(eff.startTime));
          setEndT(toInput(eff.endTime));
          isInitializedRef.current = true;
        }
      }, [systemSettings]);

      const handleModeSwitch = (newMode) => {
        isDirtyRef.current = true;
        setControlMode(newMode);
        const eff = getEffectiveCourseTimes({ ...(systemSettings || {}), control_mode: newMode });
        setStartT(toInput(eff.startTime));
        setEndT(toInput(eff.endTime));
      };

      const handleTimeChange = (type, val) => {
        isDirtyRef.current = true;
        if (type === 'start') setStartT(val);
        else setEndT(val);
      };

      const handleGraceChange = (delta) => {
        isDirtyRef.current = true;
        setGrace(g => Math.max(1, g + delta));
      };

      const handleWalkInChange = (val) => {
        isDirtyRef.current = true;
        setWalkIn(val);
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await updateSettings({
            control_mode: controlMode,
            manual_course_start_time: controlMode === '手動' ? new Date(startT).toISOString() : null,
            manual_course_end_time: controlMode === '手動' ? new Date(endT).toISOString() : null,
            course_start_time: new Date(startT).toISOString(),
            course_end_time: new Date(endT).toISOString(),
            checkin_grace_minutes: grace,
            allow_walk_in_queue: walkIn
          });
          isDirtyRef.current = false;
          alert('預約設定已成功更新並同步至 Supabase！');
        } finally {
          setSaving(false);
        }
      };

      const handleCancel = () => {
        isDirtyRef.current = false;
        if (systemSettings) {
          const mode = systemSettings.control_mode || systemSettings.controlMode || '自動';
          setControlMode(mode);
          setGrace(systemSettings.checkin_grace_minutes || 5);
          setWalkIn(systemSettings.allow_walk_in_queue ?? true);

          const eff = getEffectiveCourseTimes(systemSettings);
          setStartT(toInput(eff.startTime));
          setEndT(toInput(eff.endTime));
        }
        alert('已還原設定！');
      };

      return (
        <form onSubmit={handleSave} className="bg-white rounded-3xl p-6 shadow-xs border border-slate-200 space-y-5">
          {/* 模式切換 */}
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-2">預約控制模式：</label>
            <div className="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl">
              <button
                type="button"
                className={`py-2 px-3 font-bold text-xs rounded-xl transition-all ${controlMode === '自動' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600'}`}
                onClick={() => handleModeSwitch('自動')}
              >
                ⚡ 自動模式 (固定週三)
              </button>
              <button
                type="button"
                className={`py-2 px-3 font-bold text-xs rounded-xl transition-all ${controlMode === '手動' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600'}`}
                onClick={() => handleModeSwitch('手動')}
              >
                ✏️ 手動模式 (自訂時段)
              </button>
            </div>
          </div>

          {/* 模式說明 */}
          {controlMode === '自動' ? (
            <div className="bg-blue-50 border border-blue-200 text-blue-900 p-3.5 rounded-2xl text-xs space-y-1">
              <div className="font-bold">⚡ 自動模式運作規則：</div>
              <p className="text-blue-800 leading-relaxed text-[11px]">
                系統固定設定課程時間為<strong>「每週三 09:00 ~ 12:00」</strong>。<br/>
                • 課程開始前 24 小時（每週二 09:00 起）：僅開放<strong>「時段預約」</strong>。<br/>
                • 課程開始時（每週三 09:00 起）：僅開放<strong>「現場排隊」</strong>。
              </p>
            </div>
          ) : (
            <div className="bg-amber-50 border border-amber-200 text-amber-900 p-3.5 rounded-2xl text-xs space-y-1">
              <div className="font-bold">✏️ 手動模式運作規則：</div>
              <p className="text-amber-800 leading-relaxed text-[11px]">
                允許自由修改下方<strong>「課程開始時間」</strong>與<strong>「課程結束時間」</strong>。<br/>
                • 課程開始前 24 小時內：開放<strong>「時段預約」</strong>。<br/>
                • 課程開始時：開放<strong>「現場排隊」</strong>。
              </p>
            </div>
          )}

          <div>
            <div className="flex justify-between items-center mb-1.5">
              <label className="text-xs font-bold text-slate-700">課程開始時間</label>
              {controlMode === '自動' && <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">系統自動推算 (週三 09:00)</span>}
            </div>
            <input
              type="datetime-local"
              value={startT}
              disabled={controlMode === '自動'}
              onChange={e => handleTimeChange('start', e.target.value)}
              className={`w-full border-2 rounded-xl p-3 text-sm font-semibold ${controlMode === '自動' ? 'bg-slate-50 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-white border-blue-600'}`}
            />
          </div>

          <div>
            <div className="flex justify-between items-center mb-1.5">
              <label className="text-xs font-bold text-slate-700">課程結束時間</label>
              {controlMode === '自動' && <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">系統自動推算 (週三 12:00)</span>}
            </div>
            <input
              type="datetime-local"
              value={endT}
              disabled={controlMode === '自動'}
              onChange={e => handleTimeChange('end', e.target.value)}
              className={`w-full border-2 rounded-xl p-3 text-sm font-semibold ${controlMode === '自動' ? 'bg-slate-50 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-white border-slate-300'}`}
            />
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1.5">報到寬限分鐘</label>
            <div className="flex items-center justify-between border border-slate-300 rounded-xl p-2 bg-white">
              <span className="font-mono text-base font-bold text-slate-900 px-3">{grace}</span>
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => handleGraceChange(-1)} className="w-9 h-9 rounded-lg bg-slate-100 font-bold">－</button>
                <button type="button" onClick={() => handleGraceChange(1)} className="w-9 h-9 rounded-lg bg-slate-100 font-bold">＋</button>
              </div>
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1.5">現場排隊開放</label>
            <select
              value={walkIn ? '開放' : '關閉'}
              onChange={e => handleWalkInChange(e.target.value === '開放')}
              className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-white"
            >
              <option value="開放">開放</option>
              <option value="關閉">關閉</option>
            </select>
          </div>

          <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
            <button type="button" onClick={handleCancel} className="text-sm font-bold text-slate-600 hover:text-slate-900">Cancel</button>
            <button type="submit" disabled={saving} className="px-6 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold">
              {saving ? '儲存中...' : 'Save'}
            </button>
          </div>
        </form>
      );
    }

    // ============================================================
    // 10.8 提前使用確認橫幅 (EarlyOfferBanner)
    // 當機台提早空出，向下一位時段預約同學跳出 3 分鐘確認倒數橫幅
    // ============================================================
    function EarlyOfferBanner({ reservation, onAccept, onDecline }) {
      const [remainingSec, setRemainingSec] = useState(180);
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (!reservation?.advanceOfferedAt) {
          setRemainingSec(180);
          return;
        }

        const updateTimer = () => {
          const offerTime = new Date(reservation.advanceOfferedAt).getTime();
          const elapsed = Math.floor((Date.now() - offerTime) / 1000);
          const left = Math.max(0, 180 - elapsed);
          setRemainingSec(left);
        };

        updateTimer();
        const timer = setInterval(updateTimer, 1000);
        return () => clearInterval(timer);
      }, [reservation]);

      const formatCountdown = (sec) => {
        const mm = Math.floor(sec / 60).toString().padStart(2, '0');
        const ss = (sec % 60).toString().padStart(2, '0');
        return `${mm}:${ss}`;
      };

      const handleAccept = async () => {
        setIsSubmitting(true);
        try {
          await onAccept();
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDecline = async () => {
        setIsSubmitting(true);
        try {
          await onDecline();
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white p-4 shadow-xl z-30 select-none border-b-2 border-indigo-400/30">
          <div className="flex items-start justify-between gap-3 mb-2.5">
            <div className="flex items-center gap-2">
              <span className="text-2xl animate-bounce">🪚</span>
              <div>
                <div className="font-extrabold text-sm text-amber-300 flex items-center gap-1.5 flex-wrap">
                  <span>【機台提早空出詢問】</span>
                  <span className="bg-amber-400 text-slate-950 font-mono text-[11px] px-2 py-0.5 rounded-full font-black">
                    ⏱️ 剩餘 {formatCountdown(remainingSec)}
                  </span>
                </div>
                <div className="text-xs text-blue-100 font-medium mt-1 leading-relaxed">
                  您預約的【<strong>{reservation.machineName}</strong>】（原時段 {reservation.startTimeFormatted} ～ {reservation.endTimeFormatted}）目前已有空檔，請問是否要提前現在開始使用？
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 mt-3">
            <button
              type="button"
              disabled={isSubmitting}
              onClick={handleAccept}
              className="py-2.5 px-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 rounded-xl font-bold text-xs text-white shadow-md shadow-emerald-600/30 flex items-center justify-center gap-1 cursor-pointer transition-transform"
            >
              <span>✅ 提前開始使用</span>
            </button>
            <button
              type="button"
              disabled={isSubmitting}
              onClick={handleDecline}
              className="py-2.5 px-3 bg-white/20 hover:bg-white/30 active:scale-95 rounded-xl font-bold text-xs text-white flex items-center justify-center gap-1 cursor-pointer transition-transform border border-white/30"
            >
              <span>❌ 保持原時段</span>
            </button>
          </div>
        </div>
      );
    }

    // ============================================================
    // 11. 主畫面排版 (MainLayout) - 純手機 App 排版 (Mobile-Only)
    // ============================================================
    function MainLayout() {
      const { 
        machines, 
        activeTab, 
        setActiveTab, 
        activeUser, 
        isLoggedIn, 
        logout, 
        refreshData, 
        isCoursePaused, 
        coursePausedAt,
        reservations,
        acceptEarlyStart,
        declineEarlyStart
      } = useApp();
      const [isResModalOpen, setIsResModalOpen] = useState(false);
      const [selectedMacId, setSelectedMacId] = useState(null);
      // NOTE: 機台詳情頁切換狀態 —— null 代表列表，有值代表詳情頁
      const [selectedMachine, setSelectedMachine] = useState(null);

      // NOTE: 檢查目前登入者是否為老師 / 助教 / 管理員 (例如 supersamuel0106@gmail.com)
      const isAdmin = isTeacherOrTA(activeUser);

      // 檢查目前登入者是否有收到「提早使用詢問」的預約 (包含個人或小組成員)
      const earlyOfferRes = (reservations || []).find(r => 
        r.status === '等候提前確認' && 
        (r.email === activeUser?.mail || (r.students || []).includes(activeUser?.name))
      );

      // 若非管理員且當前在管理頁面，自動切回機台列表
      useEffect(() => {
        if (!isAdmin && (activeTab === 'courses' || activeTab === 'settings')) {
          setActiveTab('machines');
        }
      }, [isAdmin, activeTab, setActiveTab]);

      const openModal = (id) => {
        setSelectedMacId(id || null);
        setIsResModalOpen(true);
      };

      // 點擊機台圖卡進入詳情
      const handleSelectMachine = (machine) => {
        setSelectedMachine(machine);
      };

      // 返回機台列表
      const handleBackToList = () => {
        setSelectedMachine(null);
      };

      // 切換 Tab 時同時清除機台詳情選取
      const handleSetActiveTab = (tab) => {
        setSelectedMachine(null);
        setActiveTab(tab);
      };

      if (!isLoggedIn) {
        return <LoginView />;
      }

      // 目前頁面標題
      const getTitle = () => {
        if (activeTab === 'machines') {
          return selectedMachine ? selectedMachine.name : '機台列表';
        }
        if (activeTab === 'reservations') return '我的預約';
        if (activeTab === 'courses') return '課程場次';
        if (activeTab === 'settings') return '預約設定';
        return '';
      };

      return (
        <div className="min-h-screen bg-slate-900 py-0 sm:py-6 flex flex-col items-center justify-center">
          <div className="w-full max-w-sm sm:max-w-md h-screen sm:h-[840px] bg-slate-50 sm:rounded-[44px] sm:border-[10px] sm:border-slate-800 shadow-2xl overflow-hidden flex flex-col relative">
            {/* 頂部狀態列 */}
            <div className="h-10 bg-white flex items-center justify-between px-6 text-xs font-semibold text-slate-800 border-b border-slate-100 select-none">
              <span>09:41</span>
              <span>📶 ⚡ 100%</span>
            </div>

            {/* 手機 App Header */}
            <div className="bg-white px-4 py-3 border-b border-slate-200 flex items-center justify-between shadow-2xs relative z-10">
              <div className="flex items-center gap-2.5">
                <button onClick={logout} className="p-1.5 text-slate-500 hover:text-red-600 rounded-xl hover:bg-slate-100 text-sm transition-colors" title="登出並返回驗證介面">
                  🚪
                </button>
                <div>
                  <h2 className="font-bold text-base text-slate-900 leading-tight">
                    {getTitle()}
                  </h2>
                  <span className="text-[10px] text-slate-500 font-semibold block">
                    👤 {activeUser.name} ({activeUser.mail}) {isAdmin ? '👑 老師/助教' : '🎓 學生'}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={refreshData} className="p-1.5 text-slate-600 hover:text-slate-900 text-sm" title="重新整理">🔄</button>
                {/* NOTE: 詳情頁不顯示全域新增按鈕，改由詳情頁底部按鈕操作 */}
                {!selectedMachine && (
                  <button onClick={() => openModal()} className="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md font-bold text-base transition-transform active:scale-95">
                    ＋
                  </button>
                )}
              </div>
            </div>

            {/* NOTE: 提前使用詢問全域頂部互動 Banner (App 最上方跳出通知問他是否需要提前) */}
            {earlyOfferRes && (
              <EarlyOfferBanner
                reservation={earlyOfferRes}
                onAccept={() => acceptEarlyStart(earlyOfferRes.id)}
                onDecline={() => declineEarlyStart(earlyOfferRes.id)}
              />
            )}

            {/* NOTE: 課程暫停全域醒目廣播 Banner (對所有頁面與所有師生可見) */}
            {isCoursePaused && (
              <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-4 py-2.5 flex items-center justify-between text-xs font-bold shadow-md z-20 select-none">
                <div className="flex items-center gap-2">
                  <span className="text-base animate-bounce">⏸️</span>
                  <div>
                    <div>【老師講解示範中】課程暫停</div>
                    <div className="text-[10px] font-normal opacity-90">所有機台暫停使用，時段將於講解後自動順延</div>
                  </div>
                </div>
              </div>
            )}

            {/* 內容區 */}
            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-100/70">
              {activeTab === 'machines' && (
                selectedMachine ? (
                  // 機台詳情頁
                  <MachineDetailView
                    machine={selectedMachine}
                    onBack={handleBackToList}
                    onOpenReservationModal={(id) => {
                      openModal(id);
                    }}
                  />
                ) : (
                  // 機台列表
                  <div className="space-y-3">
                    {machines.map(m => (
                      <MachineCard key={m.id} machine={m} onSelect={handleSelectMachine} />
                    ))}
                  </div>
                )
              )}
              {activeTab === 'reservations' && <MyReservationsView />}
              {isAdmin && activeTab === 'courses' && <CourseSessionsView />}
              {isAdmin && activeTab === 'settings' && <BookingSettingsView />}
            </div>

            {/* 底部導覽列 (依權限動態顯示) */}
            <div className="h-16 bg-white border-t border-slate-200 flex items-center justify-around z-20 select-none shadow-lg">
              {[
                { id: 'machines', label: '機台列表', icon: '🪚' },
                { id: 'reservations', label: '我的預約', icon: '📋' },
                ...(isAdmin ? [
                  { id: 'courses', label: '課程場次', icon: '📚' },
                  { id: 'settings', label: '預約設定', icon: '⚙️' }
                ] : [])
              ].map(t => {
                const active = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => handleSetActiveTab(t.id)}
                    className={`flex-1 h-full flex flex-col items-center justify-center gap-1 relative ${active ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
                  >
                    <span className="text-lg">{t.icon}</span>
                    <span className="text-[11px] leading-none">{t.label}</span>
                    {active && <span className="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 bg-blue-600 rounded-t-full" />}
                  </button>
                );
              })}
            </div>
          </div>

          {isResModalOpen && (
            <ReservationModal initialMachineId={selectedMacId} onClose={() => setIsResModalOpen(false)} />
          )}
        </div>
      );
    }

    function App() {
      return (
        <AppProvider>
          <MainLayout />
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
