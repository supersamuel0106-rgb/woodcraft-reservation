<body>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, createContext, useContext } = React;

    // ============================================================
    // 1. Supabase 連線設定
    // ============================================================
    const SUPABASE_URL = 'https://svksjbgkjnkonvntpbha.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6AavmvJ1L-BFXXisShqFvA_ikn_mnSY';
    const AUTH_STORAGE_KEY = 'factory_v04_logged_in_email';
    const supabaseClient = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // ============================================================
    // 1b. EmailJS 通知設定（★ 請於 emailjs.com 設定完成後填入以下金鑰 ★）
    // ============================================================
    // NOTE: 請依照下方設定說明完成 EmailJS 帳號設定，再將對應值填入此處。
    //       未來若需要更換寄信 Gmail，只需在 EmailJS 後台重新連接即可，不用改程式碼。
    const EMAILJS_PUBLIC_KEY    = 'I2DLcYWgikVfuUwck';       // EmailJS > Account > Public Key
    const EMAILJS_SERVICE_ID    = 'service_mo2q2ae';       // EmailJS > Email Services > Service ID
    const EMAILJS_TEMPLATE_ID   = 'template_3mo7121';      // EmailJS > Email Templates > Template ID
    const EMAILJS_ENABLED = EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY' && EMAILJS_TEMPLATE_ID !== 'YOUR_TEMPLATE_ID'; // 尚未設定時自動跳過

    // EmailJS 初始化（僅於設定完成後執行）
    if (EMAILJS_ENABLED && window.emailjs) {
      window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    // 已通知的提醒 ID 集合（防止重複推播，存於 localStorage）
    const NOTIFIED_REMINDERS_KEY = 'wc_notified_reminders_v1';

    // ============================================================
    // 1c. 通知工具函式（瀏覽器推播 + Email）
    // ============================================================

    /**
     * 請求瀏覽器通知授權
     * 於使用者登入後呼叫，讓系統可在叫號時推播手機/桌面通知
     */
    async function requestNotificationPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    /**
     * 發送瀏覽器系統推播通知（App 開著或在背景分頁時均可收到）
     * @param {string} title - 通知標題
     * @param {string} body  - 通知內容
     * @param {string} tag   - 通知唯一標籤（相同 tag 會取代舊通知，避免重複）
     */
    function sendBrowserNotification(title, body, tag) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      try {
        new Notification(title, {
          body,
          tag,
          icon: 'https://woodcraft-reservation.vercel.app/favicon.ico',
          requireInteraction: true // 通知不會自動消失，需要使用者手動關閉
        });
      } catch (e) {
        console.warn('Browser notification failed:', e);
      }
    }

    /**
     * 發送 EmailJS Email 通知
     * 若 EmailJS 未設定或寄送失敗（例如扣打用完），靜默略過不影響系統運作
     * @param {object} params - EmailJS 模板參數
     */
    async function sendEmailNotification(params) {
      if (!EMAILJS_ENABLED || !window.emailjs) return;
      try {
        await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
        console.info('[EmailJS] 已成功寄送通知至', params.to_email);
      } catch (err) {
        // NOTE: 扣打用完或其他錯誤時靜默略過，不影響系統正常使用
        console.warn('[EmailJS] 寄送失敗（可能扣打已用完或設定尚未完成）:', err);
      }
    }

    /**
     * 發送叫號通知（瀏覽器推播 + Email 二合一）
     * 當前一位同學結束使用，系統自動對下一位被叫號的同學發送通知
     */
    async function sendQueueCallNotification({ studentNames, machineName, startTime, endTime, durationMinutes, toEmail }) {
      const title = `【輪到您了！🎟️】${machineName}`;
      const body = `${studentNames}，您的機台已可使用！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n請於 3 分鐘內前往工廠報到，逾時將視為放棄。`;
      const tag = `queue-call-${toEmail}-${Date.now()}`;

      sendBrowserNotification(title, body, tag);

      await sendEmailNotification({
        to_email: toEmail,
        to_name: studentNames,
        subject: `【叫號通知】${machineName} 輪到您使用了！`,
        machine_name: machineName,
        start_time: startTime,
        end_time: endTime,
        duration_minutes: durationMinutes,
        message: body,
        notification_type: '叫號通知'
      });
    }

    /**
     * 發送時段前 5 分鐘提醒通知（瀏覽器推播 + Email 二合一）
     * 由前端輪詢機制每 30 秒掃描一次即將開始的預約
     */
    async function sendReminderNotification({ studentNames, machineName, startTime, endTime, durationMinutes, toEmail, reservationId }) {
      // 防止重複推播
      const notified = JSON.parse(localStorage.getItem(NOTIFIED_REMINDERS_KEY) || '{}');
      const notifKey = `${reservationId}_5min`;
      if (notified[notifKey]) return;

      const title = `【即將開始！⏰】${machineName}`;
      const body = `${studentNames}，您的機台預約 5 分鐘後開始！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n請準備前往工廠！`;
      const tag = `reminder-${reservationId}`;

      sendBrowserNotification(title, body, tag);

      await sendEmailNotification({
        to_email: toEmail,
        to_name: studentNames,
        subject: `【時段提醒】${machineName} 即將於 ${startTime} 開始！`,
        machine_name: machineName,
        start_time: startTime,
        end_time: endTime,
        duration_minutes: durationMinutes,
        message: body,
        notification_type: '5分鐘提醒'
      });

      // 記錄已通知，避免重複
      notified[notifKey] = Date.now();
      localStorage.setItem(NOTIFIED_REMINDERS_KEY, JSON.stringify(notified));
    }

    /**
     * 發送小組預約 / 排隊成立通知 (包含發起人與所有被加入的小組成員)
     */
    async function sendGroupReservationNotification({
      recipientName,
      isCreator,
      creatorName,
      machineName,
      type,
      startTime,
      endTime,
      durationMinutes,
      toEmail,
      allStudentNames
    }) {
      const isGroup = allStudentNames && allStudentNames.length > 1;
      const groupInfo = isGroup ? `（同組成員：${allStudentNames.join('、')}）` : '';

      let title, body, subject;
      if (isCreator) {
        title = type === '時段預約' ? `【預約成功！📅】${machineName}` : `【排隊成功！🎟️】${machineName}`;
        body = `親愛的 ${recipientName}：您已成功建立【${machineName}】的${type}！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n${groupInfo}`;
        subject = `【${type}成功通知】您已建立【${machineName}】預約`;
      } else {
        title = type === '時段預約' ? `【您已被加入預約！👥】${machineName}` : `【您已被加入排隊！👥】${machineName}`;
        body = `親愛的 ${recipientName}：${creatorName} 同學已將您加入【${machineName}】的${type}！\n時段：${startTime} ～ ${endTime}（${durationMinutes} 分鐘）\n${groupInfo}`;
        subject = `【小組${type}通知】${creatorName} 同學已將您加入【${machineName}】`;
      }

      const tag = `group-res-${toEmail || recipientName}-${Date.now()}`;
      sendBrowserNotification(title, body, tag);

      if (toEmail) {
        await sendEmailNotification({
          to_email: toEmail,
          to_name: recipientName,
          subject,
          machine_name: machineName,
          start_time: startTime,
          end_time: endTime,
          duration_minutes: durationMinutes,
          message: body,
          notification_type: `${type}成立`
        });
      }

      return {
        id: `N_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
        timestamp: new Date().toLocaleTimeString('zh-TW'),
        recipientName,
        machineName,
        subject,
        body
      };
    }

    // ============================================================
    // 1d. 老師與助教 (管理員) 權限名單
    // ============================================================
    // NOTE: 目前指定 supersamuel0106@gmail.com 為管理員；
    //       未來若取得其他老師或助教的 Email，直接在此陣列加入即可！
    const ADMIN_EMAILS = [
      'supersamuel0106@gmail.com'
    ];

    function isTeacherOrTA(user) {
      if (!user) return false;
      if (user.role === 'admin' || user.role === 'teacher' || user.role === 'ta') return true;
      if (user.mail && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.mail.trim().toLowerCase())) return true;
      return false;
    }

    // ============================================================
    // 2. 核心計算公式 (Domain Rules)
    // ============================================================
    function calculateUsageMinutes(studentCount) {
      if (studentCount <= 0) return 0;
      return 20 + (studentCount - 1) * 10;
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [hh, mm] = timeStr.split(':').map(Number);
      return (hh || 0) * 60 + (mm || 0);
    }

    function minutesToTime(minutes) {
      const hh = Math.floor(minutes / 60).toString().padStart(2, '0');
      const mm = (minutes % 60).toString().padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function formatDateTime(d) {
      if (!d) return '';
      const date = new Date(d);
      const yyyy = date.getFullYear();
      const mm = (date.getMonth() + 1).toString().padStart(2, '0');
      const dd = date.getDate().toString().padStart(2, '0');
      const hh = date.getHours().toString().padStart(2, '0');
      const min = date.getMinutes().toString().padStart(2, '0');
      return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
    }

    // 計算有效課程時間 (自動固定週三 09:00~12:00 vs 手動模式)
    function getEffectiveCourseTimes(settings) {
      const isAuto = !settings || settings.control_mode === '自動' || settings.controlMode === '自動';
      const now = new Date();

      if (isAuto) {
        // 下一個週三 (day 3)
        const currentDay = now.getDay();
        let daysUntilWed = (3 - currentDay + 7) % 7;
        if (daysUntilWed === 0) {
          const todayNoon = new Date(now);
          todayNoon.setHours(12, 0, 0, 0);
          if (now >= todayNoon) daysUntilWed = 7;
        }

        const targetWed = new Date(now);
        targetWed.setDate(now.getDate() + daysUntilWed);

        const start = new Date(targetWed);
        start.setHours(9, 0, 0, 0);

        const end = new Date(targetWed);
        end.setHours(12, 0, 0, 0);

        const openTime = new Date(start.getTime() - 24 * 60 * 60 * 1000);
        return { startTime: start, endTime: end, openBookingTime: openTime, isAuto: true };
      } else {
        const startStr = settings.manual_course_start_time || settings.course_start_time || settings.courseStartTime || now.toISOString();
        const endStr = settings.manual_course_end_time || settings.course_end_time || settings.courseEndTime || now.toISOString();
        const start = new Date(startStr);
        const end = new Date(endStr);
        const openTime = new Date(start.getTime() - 24 * 60 * 60 * 1000);
        return { startTime: start, endTime: end, openBookingTime: openTime, isAuto: false };
      }
    }

    // 判定預約階段
    function getCurrentBookingPhase(settings) {
      const { startTime, endTime, openBookingTime } = getEffectiveCourseTimes(settings);
      const now = new Date();

      if (now >= endTime) {
        return {
          phase: 'CLOSED',
          title: '本次課程已結束',
          description: `課程已於 ${formatDateTime(endTime)} 結束。`,
          allowedType: 'NONE',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      if (now >= startTime && now < endTime) {
        return {
          phase: 'QUEUE_ONLY',
          title: '課程進行中（開放現場排隊）',
          description: '課程已開始，目前僅開放「現場排隊」即時排號！',
          allowedType: '現場排隊',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      if (now >= openBookingTime && now < startTime) {
        return {
          phase: 'SLOT_ONLY',
          title: '課程前 24 小時（開放時段預約）',
          description: `距離開課 (${formatDateTime(startTime)}) 不足 24 小時，目前僅開放「時段預約」！`,
          allowedType: '時段預約',
          effectiveStart: startTime,
          effectiveEnd: endTime
        };
      }

      return {
        phase: 'NOT_OPEN',
        title: '預約尚未開放',
        description: `將於開課前 24 小時（${formatDateTime(openBookingTime)}）正式開放時段預約。`,
        allowedType: 'NONE',
        effectiveStart: startTime,
        effectiveEnd: endTime
      };
    }

    // 檢查機台時段是否有衝突
    function hasReservationConflict(reservations, machineId, startMin, durationMin, ignoreId) {
      const endMin = startMin + durationMin;
      return reservations.some(r => {
        if (r.machineId !== machineId) return false;
        if (r.id === ignoreId) return false;
        if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
        return r.startMinutes < endMin && r.endMinutes > startMin;
      });
    }

    // 檢查學生名單在「所有機台」中是否有同時段的衝突（同時間不可預約不同機台）
    function findStudentConflict(reservations, students = [], userEmail = '', startMin = 0, durationMin = 0, ignoreId = null) {
      const endMin = startMin + durationMin;
      const studentSet = new Set(students || []);
      return reservations.find(r => {
        if (r.id === ignoreId) return false;
        if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
        const hasOverlap = r.startMinutes < endMin && r.endMinutes > startMin;
        if (!hasOverlap) return false;

        const isSameEmail = userEmail && r.email && r.email.toLowerCase() === userEmail.toLowerCase();
        const hasCommonStudent = (r.students || []).some(s => studentSet.has(s));
        return isSameEmail || hasCommonStudent;
      });
    }

    // 動態計算現場排隊起始時間（若學生在其他機台有排隊/使用中，自動往後順延避免時間衝突）
    function calculateDynamicQueueStart(reservations, machineId, durationMin = 20, courseEndMin = 1020, students = [], userEmail = '') {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const roundedNow = Math.ceil(currentMin / 10) * 10;

      // 1. 本機台現有有效隊列的最晚結束時間
      const machineActiveRes = reservations.filter(r => 
        r.machineId === machineId && 
        (r.status === '排隊中' || r.status === '等待中' || r.status === '等候報到' || r.status === '使用中')
      );
      let machineBaseline = roundedNow;
      if (machineActiveRes.length > 0) {
        machineBaseline = Math.max(roundedNow, ...machineActiveRes.map(r => r.endMinutes));
      }

      // 2. 學生在「其他機台」的現有預約/排隊最晚結束時間（若有排其他機台，自動往後順延）
      const studentSet = new Set(students || []);
      const studentActiveRes = reservations.filter(r => {
        if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
        const isSameEmail = userEmail && r.email && r.email.toLowerCase() === userEmail.toLowerCase();
        const hasCommonStudent = (r.students || []).some(s => studentSet.has(s));
        return isSameEmail || hasCommonStudent;
      });
      let studentBaseline = roundedNow;
      if (studentActiveRes.length > 0) {
        studentBaseline = Math.max(roundedNow, ...studentActiveRes.map(r => r.endMinutes));
      }

      // 初始候選時間：取兩者中較晚者（保證機台空閒 且 同學有空）
      let cand = Math.max(roundedNow, machineBaseline, studentBaseline);

      while (cand + durationMin <= courseEndMin) {
        const machineHit = hasReservationConflict(reservations, machineId, cand, durationMin);
        const studentHit = findStudentConflict(reservations, students, userEmail, cand, durationMin);
        if (!machineHit && !studentHit) {
          return cand;
        }
        cand += 10;
      }
      return cand;
    }

    function getNextQueueWaiter(reservations, machineId) {
      return reservations
        .filter(r => r.machineId === machineId && (r.status === '排隊中' || r.status === '等待中'))
        .sort((a, b) => a.startMinutes - b.startMinutes)[0];
    }

    // ============================================================
    // 3. AppContext 狀態管理
    // ============================================================
    const AppContext = createContext(null);

    function AppProvider({ children }) {
      const [machines, setMachines] = useState([]);
      const [reservations, setReservations] = useState([]);
      const [students, setStudents] = useState([]);
      const [courseSessions, setCourseSessions] = useState([]);
      const [systemSettings, setSystemSettings] = useState(null);
      const [notifications, setNotifications] = useState([]);
      const [activeUser, setActiveUser] = useState({ name: '李信恩', mail: 'supersamuel0106@gmail.com', role: 'admin' });
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [viewMode, setViewMode] = useState('mobile');
      const [activeTab, setActiveTab] = useState('machines');
      const [isLiveSupabase, setIsLiveSupabase] = useState(true);
      const [isLoading, setIsLoading] = useState(true);

      const refreshData = useCallback(async () => {
        if (!supabaseClient) return;
        try {
          const [mRes, rRes, sRes, csRes, settRes] = await Promise.all([
            supabaseClient.from('machines').select('*').order('id'),
            supabaseClient.from('reservations').select('*').order('created_at', { ascending: false }),
            supabaseClient.from('students').select('*').order('name'),
            supabaseClient.from('course_sessions').select('*').order('session_id'),
            supabaseClient.from('system_settings').select('*').eq('id', 'DEFAULT').single()
          ]);

          const rawMachines = (mRes.data || []).map(row => ({ id: row.id, name: row.name, status: row.status }));
          const rawReservations = (rRes.data || []).map(row => ({
            id: row.id,
            machineId: row.machine_id,
            machineName: row.machine_name,
            type: row.type,
            students: row.students || [],
            studentCount: row.student_count,
            durationMinutes: row.duration_minutes,
            timeSlotId: row.time_slot_id,
            startMinutes: row.start_minutes,
            endMinutes: row.end_minutes,
            startTimeFormatted: row.start_time_formatted,
            endTimeFormatted: row.end_time_formatted,
            status: row.status,
            email: row.email,
            createdAt: row.created_at,
            calledAt: row.called_at,
            advanceOfferedAt: row.advance_offered_at,
            notes: row.notes
          }));
          const rawStudents = (sRes.data || []).map(row => ({ id: row.id, name: row.name, studentNumber: row.student_number, mail: row.mail, role: row.role }));
          const rawSessions = (csRes.data || []).map(row => ({ id: row.id, sessionId: row.session_id, startTime: row.start_time, endTime: row.end_time, isCurrent: row.is_current, notes: row.notes }));

          const updatedMachines = rawMachines.map(mac => {
            const inUse = rawReservations.find(r => r.machineId === mac.id && r.status === '使用中');
            const waitCheckin = rawReservations.find(r => r.machineId === mac.id && (r.status === '等候報到' || r.status === '等候提前確認'));
            const nextW = getNextQueueWaiter(rawReservations, mac.id);

            let computed = '空閒';
            if (inUse) computed = '使用中';
            else if (waitCheckin) computed = '等待報到';

            return {
              ...mac,
              status: computed,
              currentUserName: inUse ? inUse.students.join(', ') : undefined,
              nextUserName: waitCheckin 
                ? waitCheckin.students.join(', ') 
                : nextW 
                ? nextW.students.join(', ') 
                : undefined
            };
          });

          setMachines(updatedMachines);
          setReservations(rawReservations);
          setStudents(rawStudents);
          setCourseSessions(rawSessions);
          setSystemSettings(settRes.data || null);
          setIsLiveSupabase(true);

          const savedEmail = localStorage.getItem(AUTH_STORAGE_KEY);
          if (savedEmail && rawStudents.length > 0) {
            const matched = rawStudents.find(s => s.mail.toLowerCase() === savedEmail.trim().toLowerCase());
            if (matched) {
              setActiveUser(matched);
              setIsLoggedIn(true);
            }
          }
        } catch (e) {
          console.warn('Supabase fetch failed:', e);
          setIsLiveSupabase(false);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        refreshData();
        const timer = setInterval(refreshData, 8000);
        return () => clearInterval(timer);
      }, [refreshData]);

      // NOTE: 推進機台隊列核心邏輯
      // 規則：
      // 1. 若下一位是「現場排隊」：不用問，直接叫號（給予 3 分鐘報到緩衝）
      // 2. 若下一位是「時段預約」：發出提前使用邀請（App 頂部顯示 3 分鐘確認倒數），若同意則提前使用，若拒絕或逾時則保留原時段並叫號再下一位！
      const advanceQueueForMachine = useCallback(async (machineId, reservationsSnapshot, excludeOfferResIds = []) => {
        const sourceRes = reservationsSnapshot || reservations;
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();

        // 取得該機台尚未完成且未取消的所有預約
        const activeResList = sourceRes.filter(r => 
          r.machineId === machineId && 
          (r.status === '等候報到' || r.status === '等候提前確認' || r.status === '排隊中' || r.status === '等待中')
        );

        if (activeResList.length === 0) {
          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', machineId);
          return;
        }

        const queueList = activeResList.filter(r => r.type === '現場排隊').sort((a, b) => a.startMinutes - b.startMinutes);
        const slotList = activeResList.filter(r => r.type === '時段預約').sort((a, b) => a.startMinutes - b.startMinutes);
        const eligibleSlotList = slotList.filter(s => !excludeOfferResIds.includes(s.id));

        // 篩選出在目前空檔 [nowMinutes, nowMinutes + duration] 於其他機台「沒有預約或排隊衝突」的候選人
        // 規則：若預備提前/叫號的那位同學在該時段本來預計有其他機台的預約或排隊，則直接跳過！
        const availableQueueList = queueList.filter(item => {
          const dur = item.durationMinutes || 20;
          const conflict = findStudentConflict(sourceRes, item.students, item.email, nowMinutes, dur, item.id);
          return !conflict;
        });

        const availableSlotList = eligibleSlotList.filter(slot => {
          const dur = slot.durationMinutes || 20;
          const conflict = findStudentConflict(sourceRes, slot.students, slot.email, nowMinutes, dur, slot.id);
          return !conflict;
        });

        // 決定下一位候補者：
        // 1. 若有現場排隊者（且目前時段無跨機台衝突），優先叫號
        // 2. 若無現場排隊，但有後續時段預約（且目前時段無跨機台衝突），向最近者發出提前詢問
        let nextCandidate = null;
        if (availableQueueList.length > 0) {
          nextCandidate = availableQueueList[0];
        } else if (availableSlotList.length > 0) {
          nextCandidate = availableSlotList[0];
        }

        if (!nextCandidate) {
          await supabaseClient.from('machines').update({ status: '空閒' }).eq('id', machineId);
          return;
        }

        if (nextCandidate.type === '現場排隊') {
          // --- Case A: 現場排隊 ➔ 直接叫號 (3 分鐘報到緩衝) ---
          let runningStartMin = nowMinutes;

          for (let i = 0; i < queueList.length; i++) {
            const item = queueList[i];
            const isFirst = i === 0;
            const newStatus = isFirst ? '等候報到' : '排隊中';

            let candStart = runningStartMin;
            const dur = item.durationMinutes || 20;

            for (const slot of slotList) {
              if (candStart < slot.endMinutes && candStart + dur > slot.startMinutes) {
                candStart = Math.max(candStart, slot.endMinutes);
              }
            }

            const updatePayload = {
              status: newStatus,
              start_minutes: candStart,
              end_minutes: candStart + dur,
              start_time_formatted: minutesToTime(candStart),
              end_time_formatted: minutesToTime(candStart + dur)
            };
            if (isFirst) {
              updatePayload.called_at = new Date().toISOString();
              updatePayload.advance_offered_at = null;
            }

            await supabaseClient.from('reservations').update(updatePayload).eq('id', item.id);

            if (isFirst) {
              sendQueueCallNotification({
                studentNames: item.students.join(', '),
                machineName: item.machineName,
                startTime: minutesToTime(candStart),
                endTime: minutesToTime(candStart + dur),
                durationMinutes: dur,
                toEmail: item.email || ''
              });

              const notif = {
                id: `N_${Date.now()}`,
                timestamp: new Date().toLocaleTimeString('zh-TW'),
                recipientName: item.students.join(', '),
                machineName: item.machineName,
                subject: '【叫號通知】輪到您使用機台了！',
                body: `親愛的 ${item.students.join(', ')} 同學：您排隊的【${item.machineName}】已輪到您，時段為 ${minutesToTime(candStart)} ～ ${minutesToTime(candStart + dur)}，請於 3 分鐘內前往工廠報到！`
              };
              setNotifications(prev => [notif, ...prev]);
            }

            runningStartMin = candStart + dur;
          }

          await supabaseClient.from('machines').update({ status: '等待報到' }).eq('id', machineId);
        } else {
          // --- Case B: 時段預約 ➔ 發出提前詢問（App 頂部顯示 3 分鐘確認倒數） ---
          const updatePayload = {
            status: '等候提前確認',
            advance_offered_at: new Date().toISOString()
          };

          await supabaseClient.from('reservations').update(updatePayload).eq('id', nextCandidate.id);

          const offerTitle = `【機台提早空出！🪚】${nextCandidate.machineName}`;
          const offerBody = `親愛的 ${nextCandidate.students.join(', ')} 同學：您預約的【${nextCandidate.machineName}】目前已有空檔，請問是否要提前現在開始使用？請於 3 分鐘內於 App 頂部確認。`;
          sendBrowserNotification(offerTitle, offerBody, `early-offer-${nextCandidate.id}`);

          if (nextCandidate.email) {
            sendEmailNotification({
              to_email: nextCandidate.email,
              to_name: nextCandidate.students.join(', '),
              subject: `【提早使用詢問】${nextCandidate.machineName} 目前已有空檔，是否提前開始？`,
              machine_name: nextCandidate.machineName,
              start_time: nextCandidate.startTimeFormatted,
              end_time: nextCandidate.endTimeFormatted,
              duration_minutes: nextCandidate.durationMinutes,
              message: offerBody,
              notification_type: '提前詢問'
            });
          }

          const notif = {
            id: `N_${Date.now()}`,
            timestamp: new Date().toLocaleTimeString('zh-TW'),
            recipientName: nextCandidate.students.join(', '),
            machineName: nextCandidate.machineName,
            subject: '【提早使用詢問】機台目前已有空檔',
            body: offerBody
          };
          setNotifications(prev => [notif, ...prev]);

          await supabaseClient.from('machines').update({ status: '等待報到' }).eq('id', machineId);
        }
      }, [reservations]);

      // 同意提前開始使用
      const acceptEarlyStart = async (reservationId) => {
        const target = reservations.find(r => r.id === reservationId);
        if (!target) return;

        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        const newEnd = nowMinutes + target.durationMinutes;

        // 再次確認接受提前時是否有跨機台衝突
        const conflict = findStudentConflict(reservations, target.students, target.email, nowMinutes, target.durationMinutes, target.id);
        if (conflict) {
          alert(`⚠️ 無法提前：名單中的同學在【${conflict.machineName}】已有時段（${conflict.startTimeFormatted} ～ ${conflict.endTimeFormatted}），同時間不可重複使用！已為您保留原預約時段。`);
          await declineEarlyStart(reservationId);
          return;
        }

        await supabaseClient.from('reservations').update({
          status: '使用中',
          start_minutes: nowMinutes,
          end_minutes: newEnd,
          start_time_formatted: minutesToTime(nowMinutes),
          end_time_formatted: minutesToTime(newEnd),
          started_at: now.toISOString(),
          advance_offered_at: null
        }).eq('id', reservationId);

        await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', target.machineId);
        await refreshData();
      };

      // 婉拒提前開始（保持原本預約時段，機會轉交下一位）
      const declineEarlyStart = async (reservationId) => {
        const target = reservations.find(r => r.id === reservationId);
        if (!target) return;

        await supabaseClient.from('reservations').update({
          status: '排隊中',
          advance_offered_at: null,
          notes: '已保留原時段（婉拒提前）'
        }).eq('id', reservationId);

        const updatedSnapshot = reservations.map(r => 
          r.id === reservationId ? { ...r, status: '排隊中', advanceOfferedAt: null } : r
        );
        await advanceQueueForMachine(target.machineId, updatedSnapshot, [reservationId]);
        await refreshData();
      };

      // NOTE: 自動過號與逾時取消掃描機制（每 8 秒自動輪詢）
      // 1. 現場排隊叫號 3 分鐘未報到 ➔ 自動跳過、叫下一位
      // 2. 時段預約提前詢問 3 分鐘未回應 ➔ 保留原時段、叫下一位
      // 3. 時段預約開始後 3 分鐘未報到 ➔ 自動取消該時段，釋出給現場排隊遞補
      useEffect(() => {
        const scanTimeout = async () => {
          if (!supabaseClient || isCoursePaused || reservations.length === 0) return;

          const now = new Date();
          const currentMin = now.getHours() * 60 + now.getMinutes();
          const graceMin = systemSettings?.checkin_grace_minutes !== undefined ? systemSettings.checkin_grace_minutes : 3;
          const graceMs = graceMin * 60 * 1000;

          let updatedAny = false;
          const machinesToAdvance = new Set();

          for (const r of reservations) {
            // 規則 1: 現場排隊等候報到 逾時 3 分鐘未開始使用 -> 自動過號
            if (r.type === '現場排隊' && r.status === '等候報到') {
              if (r.calledAt) {
                const calledTime = new Date(r.calledAt).getTime();
                if (now.getTime() - calledTime >= graceMs) {
                  console.log(`[Auto-Skip] 現場排隊叫號逾時 3 分鐘未報到：${r.id} (${r.students.join(', ')})`);
                  await supabaseClient.from('reservations').update({
                    status: '未報到',
                    cancelled_at: now.toISOString()
                  }).eq('id', r.id);

                  const notif = {
                    id: `N_${Date.now()}`,
                    timestamp: now.toLocaleTimeString('zh-TW'),
                    recipientName: r.students.join(', '),
                    machineName: r.machineName,
                    subject: '【過號通知】排隊叫號逾時未報到',
                    body: `親愛的 ${r.students.join(', ')} 同學：您排隊的【${r.machineName}】因超過 ${graceMin} 分鐘未報到，系統已自動跳過並叫號下一位同學。`
                  };
                  setNotifications(prev => [notif, ...prev]);

                  machinesToAdvance.add(r.machineId);
                  updatedAny = true;
                }
              }
            }

            // 規則 2: 時段預約等候提前確認 逾時 3 分鐘未回應 -> 保留原時段，自動叫下一位
            if (r.type === '時段預約' && r.status === '等候提前確認') {
              if (r.advanceOfferedAt) {
                const offerTime = new Date(r.advanceOfferedAt).getTime();
                if (now.getTime() - offerTime >= graceMs) {
                  console.log(`[Early-Offer-Timeout] 時段預約提前詢問 3 分鐘逾時未回應：${r.id} (${r.students.join(', ')})`);
                  await supabaseClient.from('reservations').update({
                    status: '排隊中',
                    advance_offered_at: null,
                    notes: '提前確認逾時，已為您保留原預約時段'
                  }).eq('id', r.id);

                  const notif = {
                    id: `N_${Date.now()}`,
                    timestamp: now.toLocaleTimeString('zh-TW'),
                    recipientName: r.students.join(', '),
                    machineName: r.machineName,
                    subject: '【保留原時段】提前使用確認已逾時',
                    body: `親愛的 ${r.students.join(', ')} 同學：您預約的【${r.machineName}】因未於 ${graceMin} 分鐘內確認提前，系統已為您保留原預約時段（${r.startTimeFormatted} ～ ${r.endTimeFormatted}），並將提前機會讓給下一位同學。`
                  };
                  setNotifications(prev => [notif, ...prev]);

                  machinesToAdvance.add(r.machineId);
                  updatedAny = true;
                }
              }
            }

            // 規則 3: 時段預約到達原本預約時間後，超過 3 分鐘未開始使用 -> 自動取消該時段
            if (r.type === '時段預約' && (r.status === '排隊中' || r.status === '等候報到')) {
              if (currentMin >= r.startMinutes + graceMin) {
                console.log(`[Auto-Cancel] 時段預約逾時未報到：${r.id} (${r.students.join(', ')})`);
                await supabaseClient.from('reservations').update({
                  status: '未報到',
                  cancelled_at: now.toISOString()
                }).eq('id', r.id);

                const notif = {
                  id: `N_${Date.now()}`,
                  timestamp: now.toLocaleTimeString('zh-TW'),
                  recipientName: r.students.join(', '),
                  machineName: r.machineName,
                  subject: '【預約逾時取消】時段逾時未報到',
                  body: `親愛的 ${r.students.join(', ')} 同學：您預約的【${r.machineName}】（時段 ${r.startTimeFormatted} ～ ${r.endTimeFormatted}）因超過開始時間 ${graceMin} 分鐘未報到，系統已自動取消該時段，釋出給現場排隊同學。`
                };
                setNotifications(prev => [notif, ...prev]);

                machinesToAdvance.add(r.machineId);
                updatedAny = true;
              }
            }
          }

          // 對有變動的機台推進隊列
          for (const macId of machinesToAdvance) {
            await advanceQueueForMachine(macId);
          }

          if (updatedAny) {
            await refreshData();
          }
        };

        const timer = setInterval(scanTimeout, 8000);
        return () => clearInterval(timer);
      }, [reservations, isCoursePaused, systemSettings, refreshData]);

      // NOTE: 每 30 秒掃描一次，對距離開始 4~6 分鐘內的預約發送「時段前 5 分鐘提醒」通知
      // 僅通知目前登入者自己的預約，並用 localStorage 防止重複推播
      useEffect(() => {
        const checkReminders = () => {
          if (!isLoggedIn || !activeUser.mail) return;
          const now = new Date();
          const currentMin = now.getHours() * 60 + now.getMinutes();

          reservations.forEach(r => {
            // 只通知當前登入者的預約
            if (r.email !== activeUser.mail) return;
            // 只通知尚未開始的排隊或等候報到
            if (r.status !== '排隊中' && r.status !== '等候報到') return;

            const minutesUntilStart = r.startMinutes - currentMin;
            // 在開始前 4~6 分鐘觸發（容許 30 秒輪詢誤差）
            if (minutesUntilStart >= 4 && minutesUntilStart <= 6) {
              sendReminderNotification({
                studentNames: r.students.join(', '),
                machineName: r.machineName,
                startTime: r.startTimeFormatted,
                endTime: r.endTimeFormatted,
                durationMinutes: r.durationMinutes,
                toEmail: r.email,
                reservationId: r.id
              });
            }
          });
        };

        // 立即執行一次，之後每 30 秒掃描
        checkReminders();
        const reminderTimer = setInterval(checkReminders, 30000);
        return () => clearInterval(reminderTimer);
      }, [reservations, isLoggedIn, activeUser]);

      const loginWithEmail = async (email) => {
        const trimmed = email.trim().toLowerCase();
        const matched = students.find(s => s.mail.toLowerCase() === trimmed);

        if (!matched) {
          return {
            success: false,
            message: `驗證失敗：【${email}】未出現在修課名單中！請確認輸入無誤，或向老師/助教確認。`
          };
        }

        setActiveUser(matched);
        setIsLoggedIn(true);
        localStorage.setItem(AUTH_STORAGE_KEY, matched.mail);

        // NOTE: 登入成功後請求瀏覽器通知授權，讓系統可推播叫號與時段提醒
        requestNotificationPermission();

        return {
          success: true,
          message: `歡迎回來，${matched.name} ${matched.role === 'admin' ? '老師' : '同學'}！`
        };
      };

      const logout = () => {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        setIsLoggedIn(false);
      };

      const createReservation = async (data) => {
        const targetMac = machines.find(m => m.id === data.machineId);
        if (!targetMac) return { success: false, message: '找不到機台' };
        if (data.students.length === 0) return { success: false, message: '請至少選一位學生' };

        // 1. 檢查小組預約名單中「每一位個別同學」的上限 (每人最多 3 筆時段預約、3 筆現場排隊)
        for (const sName of data.students) {
          const studentResList = reservations.filter(r => {
            if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
            return (r.students || []).includes(sName);
          });

          if (data.type === '時段預約') {
            const slotCount = studentResList.filter(r => r.type === '時段預約').length;
            if (slotCount >= 3) {
              return {
                success: false,
                message: `同學「${sName}」目前已有 ${slotCount} 筆進行中的「時段預約」（已達每人 3 筆上限）！請先完成或取消既有預約後再加入。`
              };
            }
          } else if (data.type === '現場排隊') {
            const queueCount = studentResList.filter(r => r.type === '現場排隊').length;
            if (queueCount >= 3) {
              return {
                success: false,
                message: `同學「${sName}」目前已有 ${queueCount} 筆進行中的「現場排隊」（已達每人 3 筆上限）！請先完成或取消既有排隊後再加入。`
              };
            }
          }
        }

        // 2. 檢查目前登入帳號（預約發起人）本人的上限
        if (activeUser?.mail) {
          const emailResList = reservations.filter(r => {
            if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
            return r.email && r.email.toLowerCase() === activeUser.mail.toLowerCase();
          });

          if (data.type === '時段預約') {
            const emailSlotCount = emailResList.filter(r => r.type === '時段預約').length;
            if (emailSlotCount >= 3) {
              return {
                success: false,
                message: `您目前已建立了 ${emailSlotCount} 筆進行中的「時段預約」（已達每人 3 筆上限）！`
              };
            }
          } else if (data.type === '現場排隊') {
            const emailQueueCount = emailResList.filter(r => r.type === '現場排隊').length;
            if (emailQueueCount >= 3) {
              return {
                success: false,
                message: `您目前已建立了 ${emailQueueCount} 筆進行中的「現場排隊」（已達每人 3 筆上限）！`
              };
            }
          }
        }

        // NOTE: 若使用者自選了時長（customDuration），以自選值為準；否則退回自動計算
        const duration = data.customDuration || calculateUsageMinutes(data.students.length);
        let startMin = 540;
        let slotId = data.timeSlotId;

        if (data.type === '時段預約') {
          if (!slotId) return { success: false, message: '請於時段矩陣選擇起始時段' };
          startMin = timeToMinutes(slotId);

          // 限制條件 1：同一機台時段衝突檢查
          if (hasReservationConflict(reservations, data.machineId, startMin, duration)) {
            return { success: false, message: `時段衝突：該機台在 ${slotId} ～ ${minutesToTime(startMin + duration)} 已被預約！` };
          }

          // 限制條件 1：跨機台時段重疊檢查（同學同時間不可預約不同機台）
          const studentConflict = findStudentConflict(reservations, data.students, activeUser?.mail, startMin, duration);
          if (studentConflict) {
            return {
              success: false,
              message: `跨機台時段衝突：名單中的同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約/排隊，同時間不可重複預約不同機台！`
            };
          }
        } else {
          // 限制條件 2：現場排隊若有排其他機台，自動往後順延避免時間衝突
          startMin = calculateDynamicQueueStart(reservations, data.machineId, duration, 1020, data.students, activeUser?.mail);
          slotId = null; // 現場排隊不綁定 time_slots 外鍵
        }

        const endMin = startMin + duration;

        const payload = {
          machine_id: data.machineId,
          machine_name: targetMac.name,
          type: data.type,
          students: data.students,
          student_count: data.students.length,
          duration_minutes: duration,
          time_slot_id: slotId,
          start_minutes: startMin,
          end_minutes: endMin,
          start_time_formatted: minutesToTime(startMin),
          end_time_formatted: minutesToTime(endMin),
          status: '排隊中',
          email: activeUser.mail
        };

        const { error } = await supabaseClient.from('reservations').insert(payload);
        if (error) {
          console.error('Supabase error:', error);
          return { success: false, message: `資料庫儲存失敗：${error.message}` };
        }

        // NOTE: 發送通知給所有名單中的同學（包含發起人本人與所有被加入的小組成員）
        for (const sName of data.students) {
          const matched = students.find(s => s.name === sName);
          const studentEmail = matched?.mail || (sName === activeUser.name ? activeUser.mail : '');
          const isCreator = (sName === activeUser.name) || (studentEmail && activeUser.mail && studentEmail.toLowerCase() === activeUser.mail.toLowerCase());

          sendGroupReservationNotification({
            recipientName: sName,
            isCreator,
            creatorName: activeUser.name,
            machineName: targetMac.name,
            type: data.type,
            startTime: minutesToTime(startMin),
            endTime: minutesToTime(endMin),
            durationMinutes: duration,
            toEmail: studentEmail,
            allStudentNames: data.students
          }).then(notif => {
            setNotifications(prev => [notif, ...prev]);
          }).catch(e => console.warn('Group notification error:', e));
        }

        await refreshData();
        return {
          success: true,
          message: `成功建立【${data.type}】！預約時段：${minutesToTime(startMin)} ～ ${minutesToTime(endMin)}`
        };
      };

      const startMachineUsage = async (machineId, reservationId) => {
        if (isCoursePaused) {
          alert('⚠️ 目前課程暫停（老師講解中），機台暫停使用！請待老師恢復課程後再報到使用。');
          return;
        }

        let targetRes;
        if (reservationId) {
          targetRes = reservations.find(r => r.id === reservationId);
        } else {
          targetRes = reservations.find(r => 
            r.machineId === machineId && 
            (r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中')
          );
        }

        if (targetRes) {
          const realMacId = targetRes.machineId || machineId;
          const now = new Date();
          const nowMinutes = now.getHours() * 60 + now.getMinutes();
          const newEndMinutes = nowMinutes + targetRes.durationMinutes;

          await supabaseClient.from('reservations').update({
            status: '使用中',
            start_minutes: nowMinutes,
            end_minutes: newEndMinutes,
            start_time_formatted: minutesToTime(nowMinutes),
            end_time_formatted: minutesToTime(newEndMinutes),
            started_at: new Date().toISOString()
          }).eq('id', targetRes.id);

          await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', realMacId);
          await refreshData();
        }
      };

      const finishMachineUsage = async (machineId, reservationId) => {
        let targetResId = reservationId;
        if (!targetResId) {
          const cur = reservations.find(r => r.machineId === machineId && r.status === '使用中');
          targetResId = cur?.id;
        }

        if (targetResId) {
          await supabaseClient.from('reservations').update({ status: '已完成', finished_at: new Date().toISOString() }).eq('id', targetResId);
        }

        // 推進現場排隊隊列 (不改動時段預約)
        await advanceQueueForMachine(machineId, reservations.filter(r => r.id !== targetResId));
        await refreshData();
      };

      const cancelReservation = async (resId) => {
        const target = reservations.find(r => r.id === resId);
        await supabaseClient.from('reservations').update({ status: '已取消', cancelled_at: new Date().toISOString() }).eq('id', resId);
        
        if (target) {
          await advanceQueueForMachine(target.machineId, reservations.filter(r => r.id !== resId));
        }
        await refreshData();
      };

      const clearCompletedReservations = async () => {
        const { data, error } = await supabaseClient
          .from('reservations')
          .delete()
          .eq('email', activeUser.mail)
          .in('status', ['已完成', '已取消'])
          .select();

        if (error) {
          console.error('Clear completed error:', error);
          return { success: false, message: `清除失敗：${error.message}`, count: 0 };
        }
        await refreshData();
        return {
          success: true,
          message: `已成功從資料庫清除 ${data ? data.length : 0} 筆已完成預約紀錄！`,
          count: data ? data.length : 0
        };
      };

      const [localPauseState, setLocalPauseState] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('wc_course_pause_state') || '{"isPaused":false}');
        } catch {
          return { isPaused: false };
        }
      });

      // 是否暫停中（優先看 systemSettings 或 local state）
      const isCoursePaused = !!(systemSettings?.course_paused || localPauseState.isPaused);
      const coursePausedAt = systemSettings?.course_paused_at || localPauseState.pausedAt || null;

      const pauseCourse = async (notes = '老師講解中') => {
        const pauseObj = {
          isPaused: true,
          pausedAt: new Date().toISOString(),
          notes
        };
        setLocalPauseState(pauseObj);
        localStorage.setItem('wc_course_pause_state', JSON.stringify(pauseObj));

        try {
          await supabaseClient.from('system_settings').update({
            course_paused: true,
            course_paused_at: pauseObj.pausedAt
          }).eq('id', 'DEFAULT');
        } catch (e) {
          console.warn('Supabase pause update note:', e);
        }

        const notif = {
          id: `N_${Date.now()}`,
          timestamp: new Date().toLocaleTimeString('zh-TW'),
          recipientName: '全體師生',
          machineName: '全機台',
          subject: '【課程暫停】老師講解中',
          body: `老師已啟動課程暫停（講解進行中），所有機台操作暫停，時段將於講解結束後自動往後順延！`
        };
        setNotifications(prev => [notif, ...prev]);
        await refreshData();
      };

      const resumeCourse = async () => {
        const pausedAtStr = coursePausedAt || new Date().toISOString();
        const pausedAt = new Date(pausedAtStr);
        const now = new Date();
        const diffMs = Math.max(0, now.getTime() - pausedAt.getTime());
        // 向上取整至少 1 分鐘
        const elapsedMin = Math.max(1, Math.ceil(diffMs / (1000 * 60)));

        // 找出所有需要順延的預約（使用中、等候報到、排隊中、等待中）
        const activeList = reservations.filter(r => 
          r.status === '使用中' || r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中'
        );

        // 順延預約時段
        for (const r of activeList) {
          const newStart = r.startMinutes + elapsedMin;
          const newEnd = r.endMinutes + elapsedMin;
          await supabaseClient.from('reservations').update({
            start_minutes: newStart,
            end_minutes: newEnd,
            start_time_formatted: minutesToTime(newStart),
            end_time_formatted: minutesToTime(newEnd)
          }).eq('id', r.id);
        }

        setLocalPauseState({ isPaused: false });
        localStorage.removeItem('wc_course_pause_state');

        try {
          await supabaseClient.from('system_settings').update({
            course_paused: false,
            course_paused_at: null
          }).eq('id', 'DEFAULT');
        } catch (e) {
          console.warn('Supabase resume update note:', e);
        }

        const notif = {
          id: `N_${Date.now()}`,
          timestamp: new Date().toLocaleTimeString('zh-TW'),
          recipientName: '全體師生',
          machineName: '全機台',
          subject: '【課程已恢復】時段已自動順延',
          body: `老師講解結束，課程已恢復！所有進行中與排隊中的預約已自動往後順延 ${elapsedMin} 分鐘。`
        };
        setNotifications(prev => [notif, ...prev]);

        await refreshData();
        return { success: true, elapsedMin, count: activeList.length };
      };

      const setCurrentCourseSession = async (sessId) => {
        await supabaseClient.from('course_sessions').update({ is_current: false }).neq('id', '00000000-0000-0000-0000-000000000000');
        await supabaseClient.from('course_sessions').update({ is_current: true }).eq('id', sessId);
        await refreshData();
      };

      const updateSettings = async (sett) => {
        await supabaseClient.from('system_settings').update(sett).eq('id', 'DEFAULT');
        await refreshData();
      };

      return (
        <AppContext.Provider value={{
          machines,
          reservations,
          students,
          courseSessions,
          systemSettings,
          notifications,
          activeUser,
          isLoggedIn,
          activeTab,
          isLiveSupabase,
          isLoading,
          isCoursePaused,
          coursePausedAt,
          pauseCourse,
          resumeCourse,
          setActiveTab,
          setActiveUser,
          loginWithEmail,
          logout,
          createReservation,
          startMachineUsage,
          finishMachineUsage,
          cancelReservation,
          clearCompletedReservations,
          setCurrentCourseSession,
          acceptEarlyStart,
          declineEarlyStart,
          updateSettings,
          refreshData
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useApp = () => useContext(AppContext);
