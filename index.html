    // ============================================================
    // 7b. 機台詳情頁 (MachineDetailView) - 顯示排隊清單 + 最快可用時段 + 新增預約
    // ============================================================
    function MachineDetailView({ machine, onBack, onOpenReservationModal }) {
      const { 
        reservations, 
        systemSettings
      } = useApp();

      // 檢查是否為當天日期（隔天自動清除歷史紀錄）
      const isToday = (dateStr) => {
        if (!dateStr) return true;
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return true;
        const now = new Date();
        return d.getFullYear() === now.getFullYear() &&
               d.getMonth() === now.getMonth() &&
               d.getDate() === now.getDate();
      };

      // 取得此機台的當日預約清單（順序：使用過 → 正在使用 → 未來使用）
      const machineReservations = useMemo(() => {
        // 1. 當天已完成（使用過）
        const completedList = reservations
          .filter(r => r.machineId === machine.id && r.status === '已完成' && isToday(r.createdAt || r.created_at))
          .sort((a, b) => a.startMinutes - b.startMinutes);

        // 2. 正在使用中
        const inUseList = reservations
          .filter(r => r.machineId === machine.id && r.status === '使用中');

        // 3. 未來使用（等候報到、等候提前確認、排隊中、等待中）
        const upcomingList = reservations
          .filter(r => r.machineId === machine.id && (r.status === '等候報到' || r.status === '等候提前確認' || r.status === '排隊中' || r.status === '等待中'))
          .sort((a, b) => a.startMinutes - b.startMinutes);

        return [...completedList, ...inUseList, ...upcomingList];
      }, [reservations, machine.id]);

      // 計算最快可用時段（排除已完成的歷史紀錄）
      const getNextAvailableTime = () => {
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();
        const roundedNow = Math.ceil(currentMin / 10) * 10;

        const activeUpcoming = machineReservations.filter(r => 
          r.status === '使用中' || r.status === '等候報到' || r.status === '等候提前確認' || r.status === '排隊中' || r.status === '等待中'
        );

        if (activeUpcoming.length === 0) {
          return `${minutesToTime(roundedNow)}`;
        }

        const lastRes = activeUpcoming[activeUpcoming.length - 1];
        const nextStart = Math.max(lastRes.endMinutes, roundedNow);
        return `${minutesToTime(nextStart)}`;
      };

      // 目前階段（判斷顯示哪種預約方式）
      const phase = systemSettings ? getCurrentBookingPhase(systemSettings) : null;
      const canBook = phase && phase.allowedType !== 'NONE';
      const phaseLabel = phase
        ? (phase.allowedType === '現場排隊' ? '現場排隊（上課時開放）' : phase.allowedType === '時段預約' ? '時段預約（開課前 24 小時）' : '目前不開放預約')
        : '讀取中...';

      let hex = '#E8F5E9';
      if (machine.status === '使用中') hex = '#FFEBEE';
      else if (machine.status === '等待報到') hex = '#FFF8E1';

      const completedCount = machineReservations.filter(r => r.status === '已完成').length;

      return (
        <div className="space-y-3">
          {/* 頂部返回列 */}
          <div className="flex items-center gap-3">
            <button
              onClick={onBack}
              className="px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs transition-colors shadow-xs cursor-pointer flex items-center gap-1"
            >
              <span>←</span>
              <span>返回機台列表</span>
            </button>
          </div>

          {/* 機台資訊與預約整合卡片 */}
          <div
            className={`p-4 rounded-3xl border shadow-xs transition-colors ${
              machine.status === '使用中'
                ? 'border-red-200'
                : machine.status === '等待報到'
                ? 'border-amber-200'
                : 'border-emerald-200'
            }`}
            style={{ backgroundColor: hex }}
          >
            <div className="flex items-start justify-between gap-3">
              {/* 左側：機台名稱、狀態燈號與最快使用時段 */}
              <div className="space-y-1.5 flex-1 min-w-0">
                {/* 第一行：機台名稱 + 狀態燈號 */}
                <div className="flex items-center gap-2 flex-wrap">
                  <h4 className="font-extrabold text-slate-900 text-lg leading-tight">
                    {machine.name}
                  </h4>
                  {/* 狀態燈號標籤 */}
                  <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-white/90 border border-slate-200 shadow-2xs flex items-center gap-1 flex-shrink-0">
                    {machine.status === '使用中' ? '🔴 使用中' : machine.status === '等待報到' ? '🟡 等候報到' : '🟢 空閒'}
                  </span>
                </div>

                {/* 第二行：最快使用時間與開放階段 */}
                <div className="pt-0.5">
                  <div className="text-xs font-bold text-slate-800 flex items-center gap-1 flex-wrap">
                    <span className="text-slate-700 font-bold">最快使用時間：</span>
                    <span className="text-slate-900 font-black">{getNextAvailableTime()}</span>
                  </div>
                  {phase && (
                    <div className="text-[11px] text-slate-500 font-medium mt-0.5">
                      {phaseLabel}
                    </div>
                  )}
                </div>
              </div>

              {/* 右側：新增預約/排隊按鈕 */}
              <div className="flex-shrink-0 pt-0.5">
                <button
                  type="button"
                  onClick={() => onOpenReservationModal(machine.id)}
                  disabled={!canBook}
                  className={`px-3.5 py-2.5 rounded-2xl font-bold text-xs shadow-md flex items-center justify-center gap-1 transition-transform active:scale-95 whitespace-nowrap ${
                    canBook
                      ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/25 cursor-pointer'
                      : 'bg-slate-300 text-slate-500 cursor-not-allowed shadow-none border border-slate-300/60'
                  }`}
                >
                  <span className="text-sm font-black">＋</span>
                  <span>新增預約 / 排隊</span>
                </button>
              </div>
            </div>
          </div>

          {/* 目前排隊與預約清單 */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold text-slate-800">📋 目前預約排隊清單</span>
                <span className="text-[11px] bg-slate-100 text-slate-500 font-semibold px-2 py-0.5 rounded-full">
                  {machineReservations.length} 組
                </span>
              </div>
              {completedCount > 0 && (
                <span className="text-[10px] text-slate-400 font-medium">
                  含當日已使用 {completedCount} 組
                </span>
              )}
            </div>

            {machineReservations.length === 0 ? (
              <div className="px-4 py-6 text-center text-slate-400 text-sm">
                <p className="text-2xl mb-2">✅</p>
                <p className="font-semibold">目前無人排隊</p>
                <p className="text-xs mt-1">可立即新增預約！</p>
              </div>
            ) : (
              <div className="divide-y divide-slate-50">
                {machineReservations.map((res, index) => {
                  const isCompleted = res.status === '已完成';
                  const isInUse = res.status === '使用中';

                  let rowClass = "bg-white hover:bg-slate-50/60";
                  let numBadgeClass = "bg-slate-100 text-slate-600 font-medium";
                  let nameClass = "text-sm font-normal text-slate-800";
                  let timeClass = "text-sm font-normal text-slate-700";
                  let subTextClass = "text-xs text-slate-500";
                  let statusBadgeClass = "bg-blue-50 text-blue-600 font-normal";

                  if (isCompleted) {
                    // 1. 使用過的同學：飽和度較低的灰色／灰階顯示
                    rowClass = "bg-slate-50/80 opacity-60 grayscale border-b border-slate-100/60";
                    numBadgeClass = "bg-slate-200/80 text-slate-400 font-medium";
                    nameClass = "text-sm font-normal text-slate-400";
                    timeClass = "text-sm font-normal text-slate-400";
                    subTextClass = "text-[11px] text-slate-400";
                    statusBadgeClass = "bg-slate-200/70 text-slate-500 font-normal border border-slate-300/40";
                  } else if (isInUse) {
                    // 2. 正在使用中的同學：凸顯明顯一點，字體相較於其他字體加粗
                    rowClass = "bg-red-50/80 border-l-4 border-l-red-500 border-red-200 ring-1 ring-red-200/40 shadow-xs";
                    numBadgeClass = "bg-red-500 text-white font-black animate-pulse shadow-sm";
                    nameClass = "text-base font-extrabold text-red-950";
                    timeClass = "text-sm font-extrabold text-red-900";
                    subTextClass = "text-xs font-bold text-red-600";
                    statusBadgeClass = "bg-red-100 text-red-700 font-black px-2 py-0.5 shadow-2xs";
                  } else {
                    // 3. 未來使用的同學：一般字體
                    if (res.status === '等候報到') {
                      statusBadgeClass = "bg-amber-50 text-amber-700 font-semibold border border-amber-200";
                      numBadgeClass = "bg-amber-100 text-amber-800 font-bold";
                      nameClass = "text-sm font-semibold text-slate-900";
                    } else if (res.status === '等候提前確認') {
                      statusBadgeClass = "bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200";
                      numBadgeClass = "bg-indigo-100 text-indigo-800 font-bold";
                      nameClass = "text-sm font-semibold text-slate-900";
                    }
                  }

                  return (
                    <div key={res.id} className={`px-4 py-3 flex items-center justify-between transition-all ${rowClass}`}>
                      <div className="flex items-center gap-3">
                        {/* 順序號碼 */}
                        <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs flex-shrink-0 ${numBadgeClass}`}>
                          {isCompleted ? '✓' : index + 1}
                        </div>
                        <div>
                          <p className={nameClass}>
                            {res.students.join(', ')}
                            {isInUse && <span className="ml-1.5 text-xs text-red-600 font-black">● 正在使用</span>}
                            {isCompleted && <span className="ml-1 text-[11px] text-slate-400 font-normal">（已使用）</span>}
                          </p>
                          <p className={subTextClass}>{res.type}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className={timeClass}>{res.startTimeFormatted} ～ {res.endTimeFormatted}</p>
                        <span className={`text-[10px] px-1.5 py-0.5 rounded inline-block mt-0.5 ${statusBadgeClass}`}>
                          {isCompleted ? '已使用' : res.status}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // 8. 我的預約 (MyReservationsView) - 1:1 截圖 2 (精準綁定預約 ID)
    // ============================================================
    function MyReservationsView() {
      const { reservations, activeUser, cancelReservation, startMachineUsage, finishMachineUsage, clearCompletedReservations } = useApp();
      const [isClearing, setIsClearing] = useState(false);
      
      const myRes = reservations
        .filter(r => r.email === activeUser.mail || r.students.includes(activeUser.name))
        .sort((a, b) => {
          const statusWeight = (s) => {
            if (s === '使用中') return 1;
            if (s === '等候報到') return 2;
            if (s === '排隊中' || s === '等待中') return 3;
            return 4;
          };
          const wDiff = statusWeight(a.status) - statusWeight(b.status);
          if (wDiff !== 0) return wDiff;
          return a.startMinutes - b.startMinutes;
        });

      const completedList = myRes.filter(r => r.status === '已完成' || r.status === '已取消');
      const hasCompleted = completedList.length > 0;

      const handleClearCompleted = async () => {
        if (!hasCompleted) return alert('目前沒有已完成或已取消的歷史紀錄需要清除！');
        const ok = window.confirm(`確定要清除【${activeUser.name}】所有的已完成預約紀錄嗎？\n\n共 ${completedList.length} 筆歷史紀錄將從 Database 中永久移除。`);
        if (!ok) return;

        setIsClearing(true);
        try {
          const res = await clearCompletedReservations();
          alert(res.message);
        } finally {
          setIsClearing(false);
        }
      };

      return (
        <div className="space-y-3 pb-2">
          {myRes.length === 0 ? (
            <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 text-slate-500 space-y-1">
              <span className="text-3xl block mb-2">📋</span>
              <p className="font-bold text-sm text-slate-800">目前尚無預約紀錄</p>
              <p className="text-xs text-slate-400">請至「機台列表」點擊新增預約。</p>
            </div>
          ) : (
            myRes.map(res => {
              const finished = res.status === '已完成' || res.status === '已取消';
              const isInUse = res.status === '使用中';
              const nowDate = new Date();
              const eligibility = getStartEligibility(res, reservations, nowDate.getHours() * 60 + nowDate.getMinutes());

              return (
                <div key={res.id} className={`bg-white rounded-2xl p-5 shadow-xs border flex flex-col justify-between space-y-3 ${isInUse ? 'border-red-200 ring-1 ring-red-100 bg-red-50/10' : 'border-slate-200'}`}>
                  <div>
                    <h4 className="text-base font-bold text-slate-900">{res.students.join(', ')}</h4>
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-slate-900 mb-1">{res.machineName}</h3>
                    <div className="flex items-center gap-2 text-xs text-slate-500">
                      <span className="bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded">{res.type}</span>
                      <span>{res.startTimeFormatted} ～ {res.endTimeFormatted} ({res.durationMinutes}分)</span>
                      <span className={`font-bold px-1.5 py-0.5 rounded text-[11px] ${isInUse ? 'bg-red-50 text-red-600 border border-red-200' : res.status === '等候報到' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'text-blue-600'}`}>
                        [{res.status}]
                      </span>
                    </div>
                  </div>

                  {!finished && (
                    <div className="pt-3.5 border-t border-slate-100 flex items-center justify-between">
                      {!isInUse ? (
                        <button onClick={() => cancelReservation(res.id)} className="text-sm font-semibold text-blue-600 hover:text-blue-800">
                          取消
                        </button>
                      ) : (
                        <span className="text-xs text-slate-400 font-medium">使用中（結束請按右側按鈕）</span>
                      )}

                      {!isInUse ? (
                        <button
                          onClick={() => {
                            // NOTE: 不用 disabled，讓同學點了能看到「為什麼還不能開始」
                            if (!eligibility.canStart) {
                              alert(`⚠️ 目前無法開始使用\n\n${eligibility.reason}`);
                              return;
                            }
                            startMachineUsage(res.machineId, res.id);
                          }}
                          className={`w-10 h-10 rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95 ${eligibility.canStart ? 'bg-slate-900 text-white hover:bg-slate-800' : 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'}`}
                          title={eligibility.canStart ? '開始使用 (立即報到)' : eligibility.reason}
                        >
                          ▶
                        </button>
                      ) : (
                        <button
                          onClick={() => finishMachineUsage(res.machineId, res.id)}
                          className="w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center hover:bg-red-700 shadow-md shadow-red-500/20 text-sm font-bold transition-transform active:scale-95"
                          title="結束使用 (系統將自動呼叫下一位同學)"
                        >
                          ⏹
                        </button>
                      )}
                    </div>
                  )}
                </div>
              );
            })
          )}

          {hasCompleted && (
            <div className="pt-2 text-center">
              <button
                type="button"
                disabled={isClearing}
                onClick={handleClearCompleted}
                className="w-full py-3 px-4 rounded-2xl bg-white hover:bg-red-50 text-red-600 border border-red-200 text-xs font-bold shadow-xs hover:border-red-300 transition-all flex items-center justify-center gap-2 active:scale-98"
              >
                <span>🗑️</span>
                <span>{isClearing ? '正在自 Database 清除中...' : `清除已完成預約紀錄 (${completedList.length} 筆)`}</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 9. 課程場次 (CourseSessionsView) - 支援課程暫停計時與時段順延控制
    // ============================================================
    function CourseSessionsView({ onOpenReservationModal, onOpenTvDisplay }) {
      const { courseSessions, setCurrentCourseSession, isCoursePaused, coursePausedAt, pauseCourse, resumeCourse } = useApp();
      const [isProcessing, setIsProcessing] = useState(false);
      const [elapsedSec, setElapsedSec] = useState(0);
      const [showAdminOverview, setShowAdminOverview] = useState(false);

      // 動態計時碼表：暫停中時每秒跳動
      useEffect(() => {
        if (!isCoursePaused || !coursePausedAt) {
          setElapsedSec(0);
          return;
        }
        const updateTimer = () => {
          const diff = Math.max(0, Math.floor((Date.now() - new Date(coursePausedAt).getTime()) / 1000));
          setElapsedSec(diff);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [isCoursePaused, coursePausedAt]);

      const formatStopwatch = (totalSec) => {
        const mm = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const ss = (totalSec % 60).toString().padStart(2, '0');
        return `${mm}:${ss}`;
      };

      const handlePause = async () => {
        const ok = window.confirm('確定要暫停課程（開始講解計時）嗎？\n\n• 系統將即時停止所有同學的機台操作與報到。\n• 恢復課程時，所有預約將依暫停的時間自動往後順延！');
        if (!ok) return;
        setIsProcessing(true);
        try {
          await pauseCourse('老師講解中');
        } finally {
          setIsProcessing(false);
        }
      };

      const handleResume = async () => {
        const estMin = Math.max(1, Math.ceil(elapsedSec / 60));
        const ok = window.confirm(`確定要恢復課程嗎？\n\n目前已暫停約 ${estMin} 分鐘，恢復後系統將自動把所有進行中與排隊中的預約時段往後順延 ${estMin} 分鐘！`);
        if (!ok) return;
        setIsProcessing(true);
        try {
          const res = await resumeCourse();
          alert(`✅ 課程已順利恢復！\n\n共將 ${res.count} 筆預約時段自動往後順延 ${res.elapsedMin} 分鐘。`);
        } finally {
          setIsProcessing(false);
        }
      };

      // 若切換至管理者全機台預約總覽頁面
      if (showAdminOverview) {
        return <AdminReservationsOverviewView onBack={() => setShowAdminOverview(false)} onOpenReservationModal={onOpenReservationModal} onOpenTvDisplay={onOpenTvDisplay} />;
      }

      return (
        <div className="space-y-4">
          {/* NOTE: 老師/助教專用 —— 進入管理者全機台預約總覽頁面 */}
          <div className="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 rounded-3xl p-5 text-white shadow-md">
            <div className="flex items-center justify-between">
              <div className="space-y-1">
                <span className="inline-block bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                  👑 管理者專用功能
                </span>
                <h3 className="text-base font-bold text-white leading-tight">全機台預約管理總覽</h3>
                <p className="text-[11px] text-blue-100 font-medium">依機台分類檢視全班同學的預約時段與排隊順序</p>
              </div>
              <button
                type="button"
                onClick={() => setShowAdminOverview(true)}
                className="py-2.5 px-3.5 rounded-2xl bg-white text-blue-700 hover:bg-blue-50 active:scale-95 text-xs font-bold shadow-sm transition-all flex items-center gap-1 shrink-0 cursor-pointer"
              >
                <span>進入頁面</span>
                <span>➔</span>
              </button>
            </div>
          </div>

          {/* NOTE: 老師/助教專用 —— 開啟現場大電視叫號看板（全螢幕顯示，可按 Esc 或右上角按鈕退出） */}
          <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-teal-700 rounded-3xl p-5 text-white shadow-md">
            <div className="flex items-center justify-between">
              <div className="space-y-1">
                <span className="inline-block bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                  📺 管理者專用功能
                </span>
                <h3 className="text-base font-bold text-white leading-tight">電視看板</h3>
                <p className="text-[11px] text-emerald-100 font-medium">於現場大電視顯示各機台使用與叫號狀態</p>
              </div>
              <button
                type="button"
                onClick={onOpenTvDisplay}
                className="py-2.5 px-3.5 rounded-2xl bg-white text-teal-700 hover:bg-emerald-50 active:scale-95 text-xs font-bold shadow-sm transition-all flex items-center gap-1 shrink-0 cursor-pointer"
              >
                <span>開啟看板</span>
                <span>➔</span>
              </button>
            </div>
          </div>

          {/* NOTE: 老師/助教專用 —— 課程暫停與講解控制卡片 */}
          <div className={`p-5 rounded-3xl border transition-all shadow-xs ${
            isCoursePaused 
              ? 'bg-amber-50 border-amber-300 ring-2 ring-amber-400/50' 
              : 'bg-white border-slate-200'
          }`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">{isCoursePaused ? '⏸️' : '⏱️'}</span>
                <div>
                  <h3 className="text-base font-bold text-slate-900 leading-tight">課程暫停與講解控制</h3>
                  <p className="text-[11px] text-slate-500 font-semibold mt-0.5">老師講解示範時可暫停預約並自動順延</p>
                </div>
              </div>
              <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${
                isCoursePaused 
                  ? 'bg-amber-100 border-amber-300 text-amber-800 animate-pulse' 
                  : 'bg-emerald-50 border-emerald-200 text-emerald-700'
              }`}>
                {isCoursePaused ? '⏸️ 講解暫停中' : '🟢 課程進行中'}
              </span>
            </div>

            {isCoursePaused ? (
              <div className="space-y-4">
                {/* 碼表大計時器 */}
                <div className="bg-white/90 border border-amber-200 rounded-2xl p-4 text-center">
                  <div className="text-[11px] font-bold text-amber-700 uppercase tracking-wider mb-1">
                    ⏱️ 講解已暫停時間
                  </div>
                  <div className="font-mono text-3xl font-extrabold text-amber-900 tracking-wider">
                    {formatStopwatch(elapsedSec)}
                  </div>
                  <div className="text-[10px] text-amber-600 font-semibold mt-1">
                    （每滿 1 分鐘時段將自動往後遞延 1 分鐘）
                  </div>
                </div>

                <button
                  type="button"
                  disabled={isProcessing}
                  onClick={handleResume}
                  className="w-full py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-sm font-bold shadow-md shadow-emerald-500/25 flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                  <span className="text-base">▶️</span>
                  <span>{isProcessing ? '正在計算並順延時段...' : '恢復課程（結束講解並自動順延）'}</span>
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-2xl border border-slate-100">
                  💡 <strong>使用說明：</strong>當需要集合全班講解時，點擊下方按鈕啟動暫停。系統將即時碼表計時，待講解結束恢復時，所有排隊與時段將<strong>精準往後順延</strong>。
                </p>
                <button
                  type="button"
                  disabled={isProcessing}
                  onClick={handlePause}
                  className="w-full py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white text-sm font-bold shadow-md shadow-amber-500/20 flex items-center justify-center gap-2 transition-all cursor-pointer"
                >
                  <span className="text-base">⏸️</span>
                  <span>{isProcessing ? '啟動暫停中...' : '暫停課程（開始講解計時）'}</span>
                </button>
              </div>
            )}
          </div>

          {/* 場次清單卡片 */}
          <div className="bg-white rounded-3xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-xs">
            <div className="px-5 py-3.5 bg-slate-50/80 border-b border-slate-100 flex items-center justify-between">
              <h4 className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                <span>📚</span> 課程預設時段場次
              </h4>
              <span className="text-[10px] text-slate-400 font-semibold">點擊 ✓ 切換目前場次</span>
            </div>
            {courseSessions.map(session => (
              <div key={session.id} className="p-4 flex items-center justify-between hover:bg-slate-50">
                <div className="space-y-1">
                  <span className={`inline-block text-xs font-bold px-2 py-0.5 rounded ${session.isCurrent ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-600'}`}>
                    {session.isCurrent ? 'Y' : 'N'}
                  </span>
                  <h4 className="text-base font-bold text-slate-800">
                    {session.notes || `${session.sessionId}：${session.startTime.substring(0,5)}－${session.endTime.substring(0,5)}`}
                  </h4>
                </div>

                <div className="flex items-center gap-2 text-slate-500">
                  <button onClick={() => alert('預設場次不可刪除')} className="p-2 hover:text-red-600">🗑️</button>
                  <button onClick={() => alert(`編輯【${session.sessionId}】`)} className="p-2 hover:text-blue-600">✏️</button>
                  <button 
                    onClick={() => {
                      setCurrentCourseSession(session.id);
                      alert(`已呼叫系統設定同步：設【${session.sessionId}】為目前場次！`);
                    }}
                    className={`p-2 ${session.isCurrent ? 'text-emerald-600 font-bold' : 'hover:text-emerald-600'}`}
                  >
                    ✓
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /**
     * 單一機台之預約管理與排隊拖曳卡片元件 (助教控制面板專用)
     * 支援 SortableJS 拖曳調動排隊順序、手動順延/提前時段
     */
    function AdminMachineQueueCard({
      mac,
      allReservations,
      filterStatus,
      onReorder,
      onShift,
      onStart,
      onFinish,
      onCancel,
      onOpenReservationModal
    }) {
      const sortableRef = useRef(null);
      const sortableInst = useRef(null);
      const [isUpdating, setIsUpdating] = useState(false);

      // 分類該機台的預約 (相容各種機台 ID 與名稱比對)
      const macAll = useMemo(() => {
        return allReservations
          .filter(r => r.machineId === mac.id || r.machineName === mac.name || (mac.name && r.machineId && mac.name.includes(r.machineId)))
          .sort((a, b) => a.startMinutes - b.startMinutes);
      }, [allReservations, mac.id, mac.name]);

      const inUseRes = useMemo(() => {
        return macAll.find(r => r.status === '使用中');
      }, [macAll]);

      const waitingQueue = useMemo(() => {
        return macAll.filter(r => 
          r.status === '等候報到' || 
          r.status === '等候提前確認' || 
          r.status === '排隊中' || 
          r.status === '等待中'
        );
      }, [macAll]);

      const historyRes = useMemo(() => {
        return macAll.filter(r => 
          r.status === '已完成' || 
          r.status === '已取消' || 
          r.status === '未報到'
        );
      }, [macAll]);

      // 初始化 SortableJS 拖曳排序
      useEffect(() => {
        if (!sortableRef.current || !window.Sortable) return;
        if (sortableInst.current) {
          sortableInst.current.destroy();
        }

        sortableInst.current = new window.Sortable(sortableRef.current, {
          handle: '.drag-handle',
          animation: 180,
          ghostClass: 'bg-indigo-50/80',
          chosenClass: 'bg-indigo-100/60',
          dragClass: 'shadow-2xl',
          onEnd: async (evt) => {
            const { oldIndex, newIndex } = evt;
            if (oldIndex == null || newIndex == null || oldIndex === newIndex) return;

            const movedItem = waitingQueue[oldIndex];
            const newOrder = [...waitingQueue];
            const [removed] = newOrder.splice(oldIndex, 1);
            newOrder.splice(newIndex, 0, removed);

            setIsUpdating(true);
            try {
              await onReorder(mac.id, newOrder.map(r => r.id), movedItem ? movedItem.id : null);
            } finally {
              setIsUpdating(false);
            }
          }
        });

        return () => {
          if (sortableInst.current) {
            sortableInst.current.destroy();
            sortableInst.current = null;
          }
        };
      }, [waitingQueue, mac.id, onReorder]);

      const handleShiftCustom = async (res) => {
        const input = window.prompt(`請輸入要為【${res.students.join(', ')}】調整的分鐘數：\n（例如：+10 延後十分鐘、-10 提前十分鐘、+30 延前半小時）`, '+10');
        if (!input) return;
        const delta = parseInt(input, 10);
        if (isNaN(delta) || delta === 0) {
          alert('請輸入有效的非零整數分鐘（如 10、-10）');
          return;
        }
        setIsUpdating(true);
        try {
          await onShift(res.id, delta);
        } finally {
          setIsUpdating(false);
        }
      };

      const handleShiftClick = async (resId, delta) => {
        setIsUpdating(true);
        try {
          await onShift(resId, delta);
        } finally {
          setIsUpdating(false);
        }
      };

      // 依 filterStatus 決定顯示哪些區塊
      const showInUse = filterStatus === 'ALL' || filterStatus === 'ACTIVE';
      const showWaiting = filterStatus === 'ALL' || filterStatus === 'ACTIVE';
      const showHistory = filterStatus === 'ALL' || filterStatus === 'COMPLETED' || filterStatus === 'CANCELLED';

      const totalVisible = 
        (showInUse && inUseRes ? 1 : 0) +
        (showWaiting ? waitingQueue.length : 0) +
        (showHistory ? historyRes.length : 0);

      return (
        <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xs relative">
          {/* 載入中遮罩 */}
          {isUpdating && (
            <div className="absolute inset-0 bg-white/70 backdrop-blur-xs z-20 flex items-center justify-center">
              <div className="text-xs font-bold text-indigo-700 bg-white px-3.5 py-1.5 rounded-full shadow-md border border-indigo-100 flex items-center gap-1.5 animate-pulse">
                <span>🔄</span>
                <span>正在重新計算並儲存排程...</span>
              </div>
            </div>
          )}

          {/* 機台標頭 */}
          <div className="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
            <div>
              <h3 className="text-base font-bold text-slate-900 leading-tight">{mac.name}</h3>
              <div className="text-[10px] text-slate-500 font-semibold mt-0.5 flex items-center gap-2">
                <span>使用中: {inUseRes ? '1' : '0'}</span>
                <span>•</span>
                <span>等候/排隊: {waitingQueue.length}</span>
                {historyRes.length > 0 && <span>• 歷史: {historyRes.length}</span>}
              </div>
            </div>

            <div className="flex items-center gap-2">
              {onOpenReservationModal && (
                <button
                  type="button"
                  onClick={() => onOpenReservationModal(mac.id)}
                  className="py-1 px-2.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-[11px] font-bold border border-blue-200 transition-colors cursor-pointer active:scale-95 flex items-center gap-1 shadow-2xs"
                  title="為此機台新增預約或排隊"
                >
                  <span>＋</span>
                  <span>新增排隊</span>
                </button>
              )}
              <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${
                mac.status === '使用中' 
                  ? 'bg-red-50 text-red-700 border-red-200 animate-pulse' 
                  : mac.status === '等待報到' 
                  ? 'bg-amber-50 text-amber-700 border-amber-200' 
                  : 'bg-emerald-50 text-emerald-700 border-emerald-200'
              }`}>
                {mac.status === '使用中' ? '🔴 使用中' : mac.status === '等待報到' ? '🟡 等待報到' : '🟢 空閒'}
              </span>
            </div>
          </div>

          {/* 總體無預約時的清晰空狀態與操作提示 */}
          {totalVisible === 0 ? (
            <div className="p-6 text-center space-y-2.5 bg-slate-50/50">
              <div className="space-y-0.5">
                <p className="text-xs font-bold text-slate-700">目前本機台尚無排隊或預約記錄</p>
                <p className="text-[11px] text-slate-400">機台處於空閒狀態，同學可直接至現場報到使用</p>
              </div>
              {onOpenReservationModal && (
                <div className="pt-1">
                  <button
                    type="button"
                    onClick={() => onOpenReservationModal(mac.id)}
                    className="inline-flex items-center gap-1 py-1.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold shadow-xs transition-all cursor-pointer"
                  >
                    <span>＋</span>
                    <span>幫同學加入排隊 / 預約</span>
                  </button>
                </div>
              )}
            </div>
          ) : (
            <div className="divide-y divide-slate-100">
              {/* 1. 使用中區塊 (固定不可拖曳) */}
              {showInUse && inUseRes && (
                <div className="p-4 bg-red-50/40 border-l-4 border-l-red-500">
                  <div className="flex items-start justify-between gap-2">
                    <div className="space-y-1">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-200 animate-pulse">
                          🔴 使用中
                        </span>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">
                          {inUseRes.type}
                        </span>
                      </div>
                      <h4 className="text-sm font-extrabold text-slate-900">
                        👤 {inUseRes.students.join(', ')}
                      </h4>
                      <div className="text-xs text-red-700 font-bold flex items-center gap-2">
                        <span>🕒 {inUseRes.startTimeFormatted} ～ {inUseRes.endTimeFormatted}</span>
                        <span>({inUseRes.durationMinutes} 分鐘)</span>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        if (window.confirm(`確定結束【${inUseRes.students.join(', ')}】的使用嗎？\n系統將自動叫號下一位排隊同學！`)) {
                          onFinish(mac.id, inUseRes.id);
                        }
                      }}
                      className="py-1.5 px-3 rounded-xl bg-red-600 text-white text-xs font-bold hover:bg-red-700 active:scale-95 shadow-sm shadow-red-500/20 cursor-pointer shrink-0"
                      title="結束使用"
                    >
                      ⏹ 結束
                    </button>
                  </div>
                </div>
              )}

              {/* 2. 可調度排隊/等候名單區塊 (支援 SortableJS 拖曳排序) */}
              {showWaiting && (
                <div>
                  {waitingQueue.length > 0 && (
                    <div className="px-4 py-2 bg-indigo-50/50 border-b border-indigo-100/50 flex items-center justify-between text-[11px] text-indigo-700 font-semibold">
                      <div className="flex items-center gap-1">
                        <span>💡</span>
                        <span>按住 <strong>⠿</strong> 可上下拖曳調動順序，或點 <strong>⏪/⏩</strong> 調整時段</span>
                      </div>
                      <span className="text-[10px] bg-indigo-100/80 px-2 py-0.5 rounded-full">
                        共 {waitingQueue.length} 筆待使用
                      </span>
                    </div>
                  )}

                  <div ref={sortableRef} className="divide-y divide-slate-100">
                    {waitingQueue.map((res, qIdx) => {
                      const isWait = res.status === '等候報到';
                      const isOffer = res.status === '等候提前確認';

                      return (
                        <div 
                          key={res.id} 
                          data-id={res.id}
                          className={`p-3.5 transition-colors flex items-start gap-2.5 ${
                            isWait ? 'bg-amber-50/35' : isOffer ? 'bg-indigo-50/20' : 'hover:bg-slate-50/80'
                          }`}
                        >
                          {/* 拖曳把手 */}
                          <div 
                            className="drag-handle touch-none cursor-grab active:cursor-grabbing p-1.5 text-slate-400 hover:text-indigo-600 active:text-indigo-800 select-none flex items-center justify-center rounded-xl hover:bg-slate-100 transition-colors shrink-0 mt-0.5" 
                            title="按住拖曳調換排隊順序"
                          >
                            <span className="text-lg leading-none font-bold">⠿</span>
                          </div>

                          {/* 排隊順序序號徽章 */}
                          <div className="w-5 h-5 rounded-full bg-slate-100 text-slate-600 font-bold text-[10px] flex items-center justify-center shrink-0 mt-1">
                            {qIdx + 1}
                          </div>

                          {/* 預約詳情 */}
                          <div className="flex-1 min-w-0 space-y-1">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                res.type === '現場排隊' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'
                              }`}>
                                {res.type === '現場排隊' ? '⚡ 現場排隊' : '🕒 時段預約'}
                              </span>

                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                                isWait 
                                  ? 'bg-amber-100 text-amber-800 border-amber-300 animate-pulse' 
                                  : isOffer 
                                  ? 'bg-indigo-100 text-indigo-800 border-indigo-200' 
                                  : 'bg-blue-50 text-blue-700 border-blue-200'
                              }`}>
                                {res.status}
                              </span>
                            </div>

                            <h4 className="text-sm font-bold text-slate-900 truncate">
                              👤 {res.students.join(', ')}
                            </h4>

                            <div className="text-xs text-slate-600 font-semibold flex items-center gap-2 flex-wrap">
                              <span className="font-mono">🕒 {res.startTimeFormatted} ～ {res.endTimeFormatted}</span>
                              <span className="text-slate-400">({res.durationMinutes} 分鐘)</span>
                            </div>

                            {res.email && (
                              <div className="text-[10px] text-slate-400 truncate">
                                ✉️ {res.email} {res.calledAt ? `• 叫號於 ${new Date(res.calledAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}` : ''}
                              </div>
                            )}

                            {/* 助教時段手動微調按鈕組 */}
                            <div className="pt-1.5 flex items-center gap-1 flex-wrap">
                              <button
                                type="button"
                                onClick={() => handleShiftClick(res.id, -10)}
                                className="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 text-[10px] font-bold border border-slate-200 transition-colors active:scale-95 cursor-pointer"
                                title="將此預約提前 10 分鐘"
                              >

                              </button>
                              <button

                                onClick={() => handleShiftClick(res.id, 10)}

                                onClick={() => handleShiftCustom(res)}

                                ⏱️ 自訂
                              </button>
                            </div>
                          </div>

                          {/* 管理員即時操作快捷鈕 */}
                          <div className="flex flex-col gap-1 shrink-0 pt-0.5">
                            <button
                              type="button"
                              onClick={() => {
                                const nd = new Date();
                                const elig = getStartEligibility(res, allReservations, nd.getHours() * 60 + nd.getMinutes());
                                const msg = elig.canStart
                                  ? `確定將【${res.students.join(', ')}】設為開始使用機台嗎？`
                                  : `⚠️ 依規則目前不可開始：\n${elig.reason}\n\n確定要以管理員身分強制將【${res.students.join(', ')}】設為開始使用嗎？`;
                                if (window.confirm(msg)) {
                                  onStart(mac.id, res.id, true);
                                }
                              }}
                              className="py-1.5 px-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 active:scale-95 shadow-xs cursor-pointer text-center"
                              title="立即開始使用 (報到)"
                            >
                              ▶ 開始
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                if (window.confirm(`確定要取消【${res.students.join(', ')}】的預約嗎？`)) {
                                  onCancel(res.id);
                                }
                              }}
                              className="py-1 px-2.5 rounded-xl bg-slate-100 text-red-600 text-xs font-bold hover:bg-red-50 active:scale-95 border border-slate-200 cursor-pointer text-center"
                              title="取消此預約"
                            >
                              ✕ 取消
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 3. 已完成 / 已取消歷史紀錄區塊 */}
              {showHistory && historyRes.length > 0 && (
                <div className="bg-slate-50/50">
                  <div className="px-4 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                    歷史紀錄（{historyRes.length}）
                  </div>
                  <div className="divide-y divide-slate-100">
                    {historyRes.map(res => (
                      <div key={res.id} className="p-3.5 flex items-center justify-between text-slate-400">
                        <div className="space-y-0.5">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 font-semibold">
                              {res.type}
                            </span>
                            <span className="text-xs font-semibold text-slate-600">
                              {res.students.join(', ')}
                            </span>
                          </div>
                          <div className="text-[11px] font-mono">
                            🕒 {res.startTimeFormatted} ～ {res.endTimeFormatted}
                          </div>
                        </div>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                          res.status === '已完成' 
                            ? 'bg-slate-100 text-slate-600 border-slate-200' 
                            : 'bg-red-50 text-red-500 border-red-200'
                        }`}>
                          {res.status}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 10. 預約設定 (BookingSettingsView) - 支援自動模式週三與手動自訂
    // ============================================================
    function BookingSettingsView() {
      const { systemSettings, updateSettings } = useApp();
      const [controlMode, setControlMode] = useState('自動');
      const [startT, setStartT] = useState('');
      const [endT, setEndT] = useState('');
      const [grace, setGrace] = useState(5);
      const [walkIn, setWalkIn] = useState(true);
      const [saving, setSaving] = useState(false);

      const isDirtyRef = React.useRef(false);
      const isInitializedRef = React.useRef(false);

      const toInput = (d) => {
        if (!d) return '';
        const date = new Date(d);
        const yyyy = date.getFullYear();
        const mm = (date.getMonth() + 1).toString().padStart(2, '0');
        const dd = date.getDate().toString().padStart(2, '0');
        const hh = date.getHours().toString().padStart(2, '0');
        const min = date.getMinutes().toString().padStart(2, '0');
        return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
      };

      useEffect(() => {
        if (systemSettings && (!isInitializedRef.current || !isDirtyRef.current)) {
          const mode = systemSettings.control_mode || systemSettings.controlMode || '自動';
          setControlMode(mode);
          setGrace(systemSettings.checkin_grace_minutes || 5);
          setWalkIn(systemSettings.allow_walk_in_queue ?? true);

          const eff = getEffectiveCourseTimes(systemSettings);
          setStartT(toInput(eff.startTime));
          setEndT(toInput(eff.endTime));
          isInitializedRef.current = true;
        }
      }, [systemSettings]);

      const handleModeSwitch = (newMode) => {
        isDirtyRef.current = true;
        setControlMode(newMode);
        const eff = getEffectiveCourseTimes({ ...(systemSettings || {}), control_mode: newMode });
        setStartT(toInput(eff.startTime));
        setEndT(toInput(eff.endTime));
      };

      const handleTimeChange = (type, val) => {
        isDirtyRef.current = true;
        if (type === 'start') setStartT(val);
        else setEndT(val);
      };

      const handleGraceChange = (delta) => {
        isDirtyRef.current = true;
        setGrace(g => Math.max(1, g + delta));
      };

      const handleWalkInChange = (val) => {
        isDirtyRef.current = true;
        setWalkIn(val);
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await updateSettings({
            control_mode: controlMode,
            manual_course_start_time: controlMode === '手動' ? new Date(startT).toISOString() : null,
            manual_course_end_time: controlMode === '手動' ? new Date(endT).toISOString() : null,
            course_start_time: new Date(startT).toISOString(),
            course_end_time: new Date(endT).toISOString(),
            checkin_grace_minutes: grace,
            allow_walk_in_queue: walkIn
          });
          isDirtyRef.current = false;
          alert('預約設定已成功更新並同步至 Supabase！');
        } finally {
          setSaving(false);
        }
      };

      const handleCancel = () => {
        isDirtyRef.current = false;
        if (systemSettings) {
          const mode = systemSettings.control_mode || systemSettings.controlMode || '自動';
          setControlMode(mode);
          setGrace(systemSettings.checkin_grace_minutes || 5);
          setWalkIn(systemSettings.allow_walk_in_queue ?? true);

          const eff = getEffectiveCourseTimes(systemSettings);
          setStartT(toInput(eff.startTime));
          setEndT(toInput(eff.endTime));
        }
        alert('已還原設定！');
      };

      return (
        <form onSubmit={handleSave} className="bg-white rounded-3xl p-6 shadow-xs border border-slate-200 space-y-5">
          {/* 模式切換 */}
          <div>
            <label className="block text-xs font-bold text-slate-700 mb-2">預約控制模式：</label>
            <div className="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl">
              <button
                type="button"
                className={`py-2 px-3 font-bold text-xs rounded-xl transition-all ${controlMode === '自動' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600'}`}
                onClick={() => handleModeSwitch('自動')}
              >
                ⚡ 自動模式 (固定週三)
              </button>
              <button
                type="button"
                className={`py-2 px-3 font-bold text-xs rounded-xl transition-all ${controlMode === '手動' ? 'bg-white text-blue-600 shadow-xs' : 'text-slate-600'}`}
                onClick={() => handleModeSwitch('手動')}
              >
                ✏️ 手動模式 (自訂時段)
              </button>
            </div>
          </div>

          {/* 模式說明 */}
          {controlMode === '自動' ? (
            <div className="bg-blue-50 border border-blue-200 text-blue-900 p-3.5 rounded-2xl text-xs space-y-1">
              <div className="font-bold">⚡ 自動模式運作規則：</div>
              <p className="text-blue-800 leading-relaxed text-[11px]">
                系統固定設定課程時間為<strong>「每週三 09:00 ~ 12:00」</strong>。<br/>
                • 課程開始前 24 小時（每週二 09:00 起）：僅開放<strong>「時段預約」</strong>。<br/>
                • 課程開始時（每週三 09:00 起）：僅開放<strong>「現場排隊」</strong>。
              </p>
            </div>
          ) : (
            <div className="bg-amber-50 border border-amber-200 text-amber-900 p-3.5 rounded-2xl text-xs space-y-1">
              <div className="font-bold">✏️ 手動模式運作規則：</div>
              <p className="text-amber-800 leading-relaxed text-[11px]">
                允許自由修改下方<strong>「課程開始時間」</strong>與<strong>「課程結束時間」</strong>。<br/>
                • 課程開始前 24 小時內：開放<strong>「時段預約」</strong>。<br/>
                • 課程開始時：開放<strong>「現場排隊」</strong>。
              </p>
            </div>
          )}

          <div>
            <div className="flex justify-between items-center mb-1.5">
              <label className="text-xs font-bold text-slate-700">課程開始時間</label>
              {controlMode === '自動' && <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">系統自動推算 (週三 09:00)</span>}
            </div>
            <input
              type="datetime-local"
              value={startT}
              disabled={controlMode === '自動'}
              onChange={e => handleTimeChange('start', e.target.value)}
              className={`w-full border-2 rounded-xl p-3 text-sm font-semibold ${controlMode === '自動' ? 'bg-slate-50 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-white border-blue-600'}`}
            />
          </div>

          <div>
            <div className="flex justify-between items-center mb-1.5">
              <label className="text-xs font-bold text-slate-700">課程結束時間</label>
              {controlMode === '自動' && <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">系統自動推算 (週三 12:00)</span>}
            </div>
            <input
              type="datetime-local"
              value={endT}
              disabled={controlMode === '自動'}
              onChange={e => handleTimeChange('end', e.target.value)}
              className={`w-full border-2 rounded-xl p-3 text-sm font-semibold ${controlMode === '自動' ? 'bg-slate-50 border-slate-200 text-slate-500 cursor-not-allowed' : 'bg-white border-slate-300'}`}
            />
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1.5">報到寬限分鐘</label>
            <div className="flex items-center justify-between border border-slate-300 rounded-xl p-2 bg-white">
              <span className="font-mono text-base font-bold text-slate-900 px-3">{grace}</span>
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => handleGraceChange(-1)} className="w-9 h-9 rounded-lg bg-slate-100 font-bold">－</button>
                <button type="button" onClick={() => handleGraceChange(1)} className="w-9 h-9 rounded-lg bg-slate-100 font-bold">＋</button>
              </div>
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-700 mb-1.5">現場排隊開放</label>
            <select
              value={walkIn ? '開放' : '關閉'}
              onChange={e => handleWalkInChange(e.target.value === '開放')}
              className="w-full border border-slate-300 rounded-xl p-3 text-sm font-semibold bg-white"
            >
              <option value="開放">開放</option>
              <option value="關閉">關閉</option>
            </select>
          </div>

          <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
            <button type="button" onClick={handleCancel} className="text-sm font-bold text-slate-600 hover:text-slate-900">Cancel</button>
            <button type="submit" disabled={saving} className="px-6 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold">
              {saving ? '儲存中...' : 'Save'}
            </button>
          </div>
        </form>
      );
    }

    // ============================================================
    // 10.8 提前使用確認橫幅 (EarlyOfferBanner)
    // 當機台提早空出，向下一位時段預約同學跳出 3 分鐘確認倒數橫幅
    // ============================================================
    function EarlyOfferBanner({ reservation, onAccept, onDecline }) {
      const [remainingSec, setRemainingSec] = useState(180);
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (!reservation?.advanceOfferedAt) {
          setRemainingSec(180);
          return;
        }

        const updateTimer = () => {
          const offerTime = new Date(reservation.advanceOfferedAt).getTime();
          const elapsed = Math.floor((Date.now() - offerTime) / 1000);
          const left = Math.max(0, 180 - elapsed);
          setRemainingSec(left);
        };

        updateTimer();
        const timer = setInterval(updateTimer, 1000);
        return () => clearInterval(timer);
      }, [reservation]);

      const formatCountdown = (sec) => {
        const mm = Math.floor(sec / 60).toString().padStart(2, '0');
        const ss = (sec % 60).toString().padStart(2, '0');
        return `${mm}:${ss}`;
      };

      const handleAccept = async () => {
        setIsSubmitting(true);
        try {
          await onAccept();
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDecline = async () => {
        setIsSubmitting(true);
        try {
          await onDecline();
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white p-4 shadow-xl z-30 select-none border-b-2 border-indigo-400/30">
          <div className="flex items-start justify-between gap-3 mb-2.5">
            <div>
              <div className="font-extrabold text-sm text-amber-300 flex items-center gap-1.5 flex-wrap">
                <span>【機台提早空出詢問】</span>
                <span className="bg-amber-400 text-slate-950 font-mono text-[11px] px-2 py-0.5 rounded-full font-black">
                  ⏱️ 剩餘 {formatCountdown(remainingSec)}
                </span>
              </div>
              <div className="text-xs text-blue-100 font-medium mt-1 leading-relaxed">
                您預約的【<strong>{reservation.machineName}</strong>】（原時段 {reservation.startTimeFormatted} ～ {reservation.endTimeFormatted}）目前已有空檔，請問是否要提前現在開始使用？
              </div>
            </div>
          </div>

    // ============================================================
    // 11. 主畫面排版 (MainLayout) - 純手機 App 排版 (Mobile-Only)
    // ============================================================
    // ============================================================
    // 12. 電視看板 (TvDisplayView) - 木工課現場大電視顯示機台叫號狀態
    // ============================================================
    // NOTE: 以 1920x1080 固定畫布設計，再依視窗大小等比縮放，
    //       確保在任何 16:9 電視 / 螢幕上版面都與設計稿一致。
    const TV_CANVAS_WIDTH = 1920;
    const TV_CANVAS_HEIGHT = 1080;
    const TV_QUEUE_PAGE_SIZE = 5;       // 報到清單每頁顯示筆數
    const TV_QUEUE_ROTATE_MS = 6000;    // 報到清單自動換頁間隔
    const TV_UPCOMING_STATUSES = ['等候報到', '等候提前確認', '排隊中', '等待中'];
    const TV_THEME = {
      idle:    { dot: '#4CAF50', bg: '#E8F6E4', border: '#5BAA5E' },
      waiting: { dot: '#FFA45C', bg: '#FFE8D4', border: '#F2A25E' },
      busy:    { dot: '#E5484D', bg: '#FFE5E7', border: '#D9545C' }
    };

    // NOTE: 看板版面依「機台類型」分欄（設計稿 4 欄 x 5 列），
    //       同類型機台（手壓鉋 1/2、角切機 makita/Bosch…）需放在固定位置，
    //       因此以「基礎名稱 + 區分條件」對應格位，而非單純依機台編號排序。
    const TV_MACHINE_SLOTS = [
      { base: '手壓鉋', digit: '1', col: 1, row: 1 },
      { base: '角切機', text: 'makita', col: 1, row: 2 },
      { base: '自動鉋', text: '手動', col: 1, row: 3 },
      { base: '垂直鑽床', text: '無保護罩', col: 1, row: 4 },
      { base: '水平鑽床', col: 1, row: 5 },
      { base: '手壓鉋', digit: '2', col: 2, row: 1 },
      { base: '角切機', text: 'bosch', col: 2, row: 2 },
      { base: '自動鉋', text: '數位', col: 2, row: 3 },
      { base: '垂直鑽床', text: '有保護罩', col: 2, row: 4 },
      { base: '臥式花鉋機', col: 2, row: 5 },
      { base: '圓鋸機', col: 3, row: 1 },
      { base: '推台鋸', col: 3, row: 2 },
      { base: '帶鋸機', col: 4, row: 1 },
      { base: '落地式線鋸機', col: 4, row: 2 }
    ];

    /**
     * 解析機台名稱，例如「5. 自動鉋2（數位）」→ { base: '自動鉋', digit: '2', note: '數位', tag: '02 數位' }
     * @param rawName 資料庫中的機台名稱
     * @returns 基礎名稱、編號、備註與看板上小標籤文字
     */
    function parseTvMachineName(rawName) {
      const stripped = (rawName || '').replace(/^\s*\d+\s*[.．、]\s*/, '');
      const noteMatch = stripped.match(/^(.*?)[（(]([^）)]*)[）)]\s*$/);
      let base = noteMatch ? noteMatch[1].trim() : stripped.trim();
      let note = noteMatch ? noteMatch[2].trim() : '';
      let digit = '';

      const trailingDigit = base.match(/^(.*?)(\d+)$/);
      if (trailingDigit) {
        base = trailingDigit[1].trim();
        digit = String(parseInt(trailingDigit[2], 10));
      } else if (/^\d+$/.test(note)) {
        // 「手壓鉋（1）」的括號內是編號而非備註
        digit = String(parseInt(note, 10));
        note = '';
      }

      const tag = [digit ? digit.padStart(2, '0') : '', note].filter(Boolean).join(' ');
      return { base, digit, note, tag };
    }

    /**
     * 依 TV_MACHINE_SLOTS 將機台安排到看板格位
     * 先以區分條件精準比對，剩餘空格再以同基礎名稱遞補（容錯資料庫命名差異）
     */
    function arrangeTvMachines(machines) {
      const parsedList = machines.map(machine => ({ machine, parsed: parseTvMachineName(machine.name) }));
      const used = new Set();
      const assigned = new Array(TV_MACHINE_SLOTS.length).fill(null);

      const matchesSlot = (slot, parsed) => {
        if (parsed.base !== slot.base) return false;
        if (slot.digit) return parsed.digit === slot.digit;
        if (slot.text) return `${parsed.note} ${parsed.tag}`.toLowerCase().includes(slot.text.toLowerCase());
        return true;
      };

      TV_MACHINE_SLOTS.forEach((slot, idx) => {
        const hit = parsedList.find(p => !used.has(p.machine.id) && matchesSlot(slot, p.parsed));
        if (hit) { used.add(hit.machine.id); assigned[idx] = hit; }
      });
      TV_MACHINE_SLOTS.forEach((slot, idx) => {
        if (assigned[idx]) return;
        const hit = parsedList.find(p => !used.has(p.machine.id) && p.parsed.base === slot.base);
        if (hit) { used.add(hit.machine.id); assigned[idx] = hit; }
      });

      const leftovers = parsedList.filter(p => !used.has(p.machine.id));
      if (leftovers.length > 0) {
        console.warn('[TV] 以下機台未對應到看板格位，將不會顯示：', leftovers.map(p => p.machine.name));
      }

      return assigned
        .map((item, idx) => (item ? { ...item, col: TV_MACHINE_SLOTS[idx].col, row: TV_MACHINE_SLOTS[idx].row } : null))
        .filter(Boolean);
    }

    /**
     * 電視看板跑馬燈文字元件 (TvMarqueeText)
     * 當名單長度放得下時，維持靜態靠左、時段緊鄰靠右；
     * 當多人預約（例如 2 人以上）文字超出卡片邊界時，自動啟動無縫循環跑馬燈，
     * 開頭停留約 3 秒方便辨識，隨後絲滑平移展示完整名單，避免文字被「…」截斷。
     */
    function TvMarqueeText({ text, style, className, forceMarquee }) {
      const containerRef = useRef(null);
      const textRef = useRef(null);
      const [isOverflow, setIsOverflow] = useState(false);

      useEffect(() => {
        const check = () => {
          if (forceMarquee) {
            setIsOverflow(true);
            return;
          }
          if (containerRef.current && textRef.current) {
            const textWidth = textRef.current.scrollWidth;
            const containerWidth = containerRef.current.clientWidth;
            setIsOverflow(textWidth > containerWidth + 2);
          }
        };

        check();
        const timer = setTimeout(check, 120);

        let ro = null;
        if (typeof ResizeObserver !== 'undefined' && containerRef.current) {
          ro = new ResizeObserver(check);
          ro.observe(containerRef.current);
        }
        window.addEventListener('resize', check);

        return () => {
          clearTimeout(timer);
          if (ro) ro.disconnect();
          window.removeEventListener('resize', check);
        };
      }, [text, forceMarquee]);

      const animDuration = useMemo(() => {
        const len = (text || '').length;
        const secs = Math.max(8, Math.min(16, Math.round(len * 1.3)));
        return `${secs}s`;
      }, [text]);

      return (
        <div
          ref={containerRef}
          className={`tv-marquee-container ${isOverflow ? 'is-overflow' : ''} ${className || ''}`}
          style={{ ...style }}
        >
          <div
            className={isOverflow ? 'tv-marquee-track' : 'tv-marquee-static'}
            style={isOverflow ? { animationDuration: animDuration } : undefined}
          >
            <span ref={textRef} className="tv-marquee-item">
              {text}
            </span>
            {isOverflow && (
              <>
                <span className="tv-marquee-spacer" />
                <span className="tv-marquee-item" aria-hidden="true">
                  {text}
                </span>
                <span className="tv-marquee-spacer" />
              </>
            )}
          </div>
        </div>
      );
    }
