                  .eq('id', r.id)
                  .eq('status', '使用中')
                  .lte('end_minutes', currentMin)
                  .select('id');

                if (stopError) {
                  console.error('[Auto-Stop] 自動結束失敗:', stopError);
                } else if (stopped && stopped.length > 0) {
                  console.log(`[Auto-Stop] 使用時間已到，自動結束：${r.machineName}（${(r.students || []).join(', ')}）`);

                  const isMine = (r.students || []).includes(activeUser?.name) ||
                    (r.email && activeUser?.mail && r.email.toLowerCase() === activeUser.mail.toLowerCase());
                  if (isMine) {
                    const stopTitle = `【使用時間已到⏱️】${r.machineName}`;
                    const stopBody = `您在【${r.machineName}】的使用時間（${r.startTimeFormatted} ～ ${r.endTimeFormatted}）已結束，系統已自動停止使用並交給下一位，請盡快將機台整理乾淨。`;
                    sendBrowserNotification(stopTitle, stopBody, `auto-stop-${r.id}`);
                    setNotifications(prev => [{
                      id: `N_${Date.now()}_${r.id}`,
                      timestamp: now.toLocaleTimeString('zh-TW'),
                      recipientName: (r.students || []).join(', '),
                      machineName: r.machineName,
                      subject: '【使用時間已到】系統已自動結束',
                      body: stopBody
                    }, ...prev]);
                  }

                  // 連動：叫下一位（現場排隊直接叫號、時段預約發提前詢問），並更新機台狀態
                  await advanceQueueForMachine(r.machineId, scanList.filter(x => x.id !== r.id));
                  swappedMachines.add(r.machineId);
                  updatedAny = true;
                }
                continue;
              }

              // 規則 1: 現場排隊等候報到逾時 -> 有人可替補就順延，沒有就保留資格並更新預計時段
              if (r.type === '現場排隊' && r.status === '等候報到' && r.calledAt && !hasReservationStartedOrInUse(r)) {
                const calledTime = new Date(r.calledAt).getTime();
                if (now.getTime() - calledTime >= graceMs && !swappedMachines.has(r.machineId)) {
                  const swapped = await handleOverdueReservation(r, scanList, currentMin, graceMin);
                  if (swapped) {
                    console.log(`[Overdue-Swap] 現場排隊叫號逾時，已處理釋放或替補：${r.id}`);
                    swappedMachines.add(r.machineId);
                    updatedAny = true;
                  }
                }
              }

              // 規則 1b: 現場排隊排在首位，但時段結束時間已過且尚未開始使用（逾期未報到）
              if (r.type === '現場排隊' && (r.status === '等候報到' || r.status === '排隊中') && !hasReservationStartedOrInUse(r) && !swappedMachines.has(r.machineId)) {
                const sameMacActive = scanList.filter(x => x.machineId === r.machineId && (x.status === '使用中' || x.status === '等候報到' || x.status === '排隊中'));
                const isFirst = sameMacActive.sort((a, b) => a.startMinutes - b.startMinutes)[0]?.id === r.id;
                const macInUse = sameMacActive.some(x => x.status === '使用中');
                const hasUnreleasedSubstitute = sameMacActive.some(
                  x => x.id !== r.id && x.type === '現場排隊' && !hasReservationStartedOrInUse(x) && !isOverdueReleasedReservation(x)
                );
                if (isFirst && !macInUse && currentMin >= r.endMinutes && (!isOverdueReleasedReservation(r) || hasUnreleasedSubstitute)) {
                  console.log(`[Queue-Expired] 現場排隊時段已過期未報到，直接順延換下一位：${r.machineName}`);
                  const swapped = await handleOverdueReservation(r, scanList, currentMin, graceMin);
                  if (swapped) {
                    swappedMachines.add(r.machineId);
                    updatedAny = true;
                  }
                }
              }

              // 規則 2: 時段預約等候提前確認 逾時 3 分鐘未回應 -> 保留原時段，自動叫下一位
              if (r.type === '時段預約' && r.status === '等候提前確認' && !hasReservationStartedOrInUse(r)) {
                if (r.advanceOfferedAt) {
                  const offerTime = new Date(r.advanceOfferedAt).getTime();
                  if (now.getTime() - offerTime >= graceMs) {
                    const { data: revertedOffer, error: revErr } = await supabaseClient
                      .from('reservations')
                      .update({
                        status: '排隊中',
                        called_at: null,
                        advance_offered_at: null,
                        notes: '提前確認逾時，已為您保留原預約時段'
                      })
                      .eq('id', r.id)
                      .eq('status', '等候提前確認')
                      .select('id');

                    if (!revErr && revertedOffer && revertedOffer.length > 0) {
                      console.log(`[Early-Offer-Timeout] 時段預約提前詢問 3 分鐘逾時未回應：${r.id} (${r.students.join(', ')})`);
                      const notif = {
                        id: `N_${Date.now()}`,
                        timestamp: now.toLocaleTimeString('zh-TW'),
                        recipientName: r.students.join(', '),
                        machineName: r.machineName,
                        subject: '【保留原時段】提前使用確認已逾時',
                        body: `親愛的 ${r.students.join(', ')} 同學：您預約的【${r.machineName}】因未於 ${graceMin} 分鐘內確認提前，系統已為您保留原預約時段（${r.startTimeFormatted} ～ ${r.endTimeFormatted}），並將提前機會讓給下一位同學。`
                      };
                      setNotifications(prev => [notif, ...prev]);

                      machinesToAdvance.add(r.machineId);
                      updatedAny = true;
                    }
                  }
                }
              }

              // 規則 3: 時段預約超過開始時間仍未報到 -> 有人可替補就順延，沒有就保留資格並更新預計時段
              if (r.type === '時段預約' && (r.status === '排隊中' || r.status === '等候報到') && !hasReservationStartedOrInUse(r)) {
                const hasUnreleasedSubstitute = scanList.some(
                  x => x.machineId === r.machineId && x.id !== r.id && x.type === '現場排隊' && WAITING_RESERVATION_STATUSES.includes(x.status) && !isOverdueReleasedReservation(x)
                );
                if (currentMin >= r.startMinutes + graceMin && !swappedMachines.has(r.machineId) && (!isOverdueReleasedReservation(r) || hasUnreleasedSubstitute)) {
                  const swapped = await handleOverdueReservation(r, scanList, currentMin, graceMin);
                  if (swapped) {
                    console.log(`[Overdue-Swap] 時段預約逾時，已處理釋放或替補：${r.id}`);
                    swappedMachines.add(r.machineId);
                    updatedAny = true;
                  }
                }
              }
            }

            // NOTE: 自我修復 —— 機台沒人使用、也沒有人被叫號，卻有現場排隊者停在「排隊中」時，
            //       代表先前的叫號沒有成功，或原本組員在其他機台的衝突時段已經結束，此處自動補叫號。
            //       排除已因「報到逾時」釋放機台的紀錄，避免無人替補時每輪重複發送叫號通知。
            const busyMachineIds = new Set(
              scanList
                .filter(r => r.status === '使用中' || r.status === '等候報到' || r.status === '等候提前確認')
                .map(r => r.machineId)
            );
            for (const r of scanList) {
              if (r.type !== '現場排隊' || r.status !== '排隊中') continue;
              if (hasReservationStartedOrInUse(r)) continue;
              if (busyMachineIds.has(r.machineId) || machinesToAdvance.has(r.machineId) || swappedMachines.has(r.machineId)) continue;
              if (isOverdueReleasedReservation(r)) continue;

              const macBlockingSlotRanges = scanList
                .filter(x => x.machineId === r.machineId && x.type === '時段預約' && isReservationActive(x) && x.startMinutes + graceMin > currentMin)
                .map(x => ({ start: x.startMinutes, end: x.endMinutes }));
              const earliestStart = findEarliestValidStartForReservation(r, currentMin, macBlockingSlotRanges, scanList, currentMin);
              if (earliestStart !== currentMin) continue;

              console.log(`[Queue-Heal] 機台閒置且組員時段已無衝突，自動叫號：${r.machineId}`);
              machinesToAdvance.add(r.machineId);
              updatedAny = true;
            }

            // 對有變動的機台推進隊列（已做過替補調換的機台隊列已重排，不再重複推進）
            for (const macId of machinesToAdvance) {
              if (swappedMachines.has(macId)) continue;
              await advanceQueueForMachine(macId);
            }

            // 規則 4: 針對尚未按開始但預計開始時間已落後於目前時間的保留排隊預約，自動跟著更新預計開始與結束時間
            const skipIds = new Set([...swappedMachines, ...machinesToAdvance]);
            const syncedSchedules = await syncStaleWaitingSchedules(scanList, currentMin, graceMin, skipIds);
            if (syncedSchedules) {
              updatedAny = true;
            }

            if (updatedAny) {
              await refreshData();
            }
          } finally {
            isScanningRef.current = false;
          }
        };

        const initialTimer = setTimeout(scanTimeout, 800);
        const timer = setInterval(scanTimeout, 8000);
        return () => {
          clearTimeout(initialTimer);
          clearInterval(timer);
        };
      }, [reservations, isCoursePaused, systemSettings, refreshData, activeUser, syncStaleWaitingSchedules, advanceQueueForMachine]);

      // NOTE: 每 30 秒掃描一次，對距離開始 4~6 分鐘內的預約發送「時段前 5 分鐘提醒」通知
      // 僅通知目前登入者自己的預約，並用 localStorage 防止重複推播
      useEffect(() => {
        const checkReminders = () => {
          if (!isLoggedIn || !activeUser.mail) return;
          const now = new Date();
          const currentMin = now.getHours() * 60 + now.getMinutes();

          reservations.forEach(r => {
            // 只通知當前登入者的預約
            if (r.email !== activeUser.mail) return;
            // 只通知尚未開始的排隊或等候報到
            if (r.status !== '排隊中' && r.status !== '等候報到') return;

            const minutesUntilStart = r.startMinutes - currentMin;
            // 在開始前 4~6 分鐘觸發（容許 30 秒輪詢誤差）
            if (minutesUntilStart >= 4 && minutesUntilStart <= 6) {
              sendReminderNotification({
                studentNames: r.students.join(', '),
                machineName: r.machineName,
                startTime: r.startTimeFormatted,
                endTime: r.endTimeFormatted,
                durationMinutes: r.durationMinutes,
                toEmail: r.email,
                reservationId: r.id
              });
            }
          });
        };

        // 立即執行一次，之後每 30 秒掃描
        checkReminders();
        const reminderTimer = setInterval(checkReminders, 30000);
        return () => clearInterval(reminderTimer);
      }, [reservations, isLoggedIn, activeUser]);

      const loginWithEmail = async (email) => {
        const trimmed = email.trim().toLowerCase();
        const matched = students.find(s => s.mail.toLowerCase() === trimmed);

        if (!matched) {
          return {
            success: false,
            message: `驗證失敗：【${email}】未出現在修課名單中！請確認輸入無誤，或向老師/助教確認。`
          };
        }

        setActiveUser(matched);
        setIsLoggedIn(true);
        localStorage.setItem(AUTH_STORAGE_KEY, matched.mail);

        // NOTE: 登入成功後請求瀏覽器通知授權，讓系統可推播叫號與時段提醒
        requestNotificationPermission();

        return {
          success: true,
          message: `歡迎回來，${matched.name} ${matched.role === 'admin' ? '老師' : '同學'}！`
        };
      };

      const logout = () => {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        setIsLoggedIn(false);
      };

      const createReservation = async (data) => {
        const targetMac = machines.find(m => m.id === data.machineId);
        if (!targetMac) return { success: false, message: '找不到機台' };
        const cleanStudents = normalizeStudentList(data.students);
        if (cleanStudents.length === 0) return { success: false, message: '請至少選一位學生' };

        // 先拉取最新資料庫預約快照，避免組員幾秒前剛在另一支手機建立預約造成時間差漏檢
        const baseReservations = (await refreshData()) || reservations;

        // 1. 檢查小組預約名單中「每一位個別同學」的上限 (每人最多 3 筆時段預約、3 筆現場排隊)
        for (const sName of cleanStudents) {
          const studentResList = baseReservations.filter(r => {
            if (!isReservationActive(r)) return false;
            return normalizeStudentList(r.students).includes(sName);
          });

          if (data.type === '時段預約') {
            const slotCount = studentResList.filter(r => r.type === '時段預約').length;
            if (slotCount >= 3) {
              return {
                success: false,
                message: `同學「${sName}」目前已有 ${slotCount} 筆進行中的「時段預約」（已達每人 3 筆上限）！請先完成或取消既有預約後再加入。`
              };
            }
          } else if (data.type === '現場排隊') {
            const queueCount = studentResList.filter(r => r.type === '現場排隊').length;
            if (queueCount >= 3) {
              return {
                success: false,
                message: `同學「${sName}」目前已有 ${queueCount} 筆進行中的「現場排隊」（已達每人 3 筆上限）！請先完成或取消既有排隊後再加入。`
              };
            }
          }
        }

        // 2. 檢查目前登入帳號（預約發起人）本人的上限
        if (activeUser?.mail) {
          const emailResList = baseReservations.filter(r => {
            if (!isReservationActive(r)) return false;
            return r.email && r.email.toLowerCase() === activeUser.mail.toLowerCase();
          });

          if (data.type === '時段預約') {
            const emailSlotCount = emailResList.filter(r => r.type === '時段預約').length;
            if (emailSlotCount >= 3) {
              return {
                success: false,
                message: `您目前已建立了 ${emailSlotCount} 筆進行中的「時段預約」（已達每人 3 筆上限）！`
              };
            }
          } else if (data.type === '現場排隊') {
            const emailQueueCount = emailResList.filter(r => r.type === '現場排隊').length;
            if (emailQueueCount >= 3) {
              return {
                success: false,
                message: `您目前已建立了 ${emailQueueCount} 筆進行中的「現場排隊」（已達每人 3 筆上限）！`
              };
            }
          }
        }

        const effectiveTimes = getEffectiveCourseTimes(systemSettings);
        const courseEndMin = effectiveTimes.endTime.getHours() * 60 + effectiveTimes.endTime.getMinutes();
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();

        // NOTE: 若使用者自選了時長（customDuration），以自選值為準；否則退回自動計算
        const duration = data.customDuration || calculateUsageMinutes(cleanStudents.length);
        let startMin = 540;
        let slotId = data.timeSlotId;

        if (data.type === '時段預約') {
          if (!slotId) return { success: false, message: '請於時段矩陣選擇起始時段' };
          startMin = timeToMinutes(slotId);
        } else {
          // 現場排隊推算即時起始時間（檢查本人與所有共同組員準備使用的預約，若卡到則自動往後順延）
          startMin = calculateDynamicQueueStart(baseReservations, data.machineId, duration, courseEndMin, cleanStudents, activeUser?.mail, currentMin);
          slotId = null; // 現場排隊不綁定 time_slots 外鍵
        }

        // 統一呼叫 checkReservationConflict 檢查機台時段衝突與所有組員跨機台衝突
        const conflictCheck = checkReservationConflict(
          baseReservations,
          data.machineId,
          startMin,
          duration,
          cleanStudents,
          activeUser?.mail,
          courseEndMin,
          null,
          data.type === '現場排隊' ? currentMin : null
        );
        if (conflictCheck.hasConflict) {
          return { success: false, message: conflictCheck.message };
        }

        const endMin = startMin + duration;

        const payload = {
          machine_id: data.machineId,
          machine_name: targetMac.name,
          type: data.type,
          students: cleanStudents,
          student_count: cleanStudents.length,
          duration_minutes: duration,
          time_slot_id: slotId,
          start_minutes: startMin,
          end_minutes: endMin,
          start_time_formatted: minutesToTime(startMin),
          end_time_formatted: minutesToTime(endMin),
          status: '排隊中',
          email: activeUser.mail
        };

        const { error } = await supabaseClient.from('reservations').insert(payload);
        if (error) {
          console.error('Supabase error:', error);
          return { success: false, message: `資料庫儲存失敗：${error.message}` };
        }

        // NOTE: 發送通知給所有名單中的同學（包含發起人本人與所有被加入的小組成員）
        for (const sName of cleanStudents) {
          const matched = students.find(s => s.name === sName);
          const studentEmail = matched?.mail || (sName === activeUser.name ? activeUser.mail : '');
          const isCreator = (sName === activeUser.name) || (studentEmail && activeUser.mail && studentEmail.toLowerCase() === activeUser.mail.toLowerCase());

          sendGroupReservationNotification({
            recipientName: sName,
            isCreator,
            creatorName: activeUser.name,
            machineName: targetMac.name,
            type: data.type,
            startTime: minutesToTime(startMin),
            endTime: minutesToTime(endMin),
            durationMinutes: duration,
            toEmail: studentEmail,
            allStudentNames: cleanStudents
          }).then(notif => {
            setNotifications(prev => [notif, ...prev]);
          }).catch(e => console.warn('Group notification error:', e));
        }

        const latestReservations = await refreshData();

        // NOTE: 若新增的是現場排隊，且機台當前無人使用與等候提前確認，立即評估叫號或更新排隊順序
        if (data.type === '現場排隊' && latestReservations) {
          const macBusyWithUseOrOffer = latestReservations.some(
            r => r.machineId === data.machineId && (r.status === '使用中' || r.status === '等候提前確認')
          );
          if (!macBusyWithUseOrOffer) {
            await advanceQueueForMachine(data.machineId, latestReservations);
            await refreshData();
          }
        }

        return {
          success: true,
          message: `成功建立【${data.type}】！預約時段：${minutesToTime(startMin)} ～ ${minutesToTime(endMin)}`
        };
      };

      /**
       * 開始使用機台（報到）
       * @param machineId 機台 ID
       * @param reservationId 預約 ID
       * @param force 管理員強制開始，略過時段/順序檢查（現場特殊狀況用）
       */
      const startMachineUsage = async (machineId, reservationId, force = false) => {
        if (isCoursePaused) {
          alert('⚠️ 目前課程暫停（老師講解中），機台暫停使用！請待老師恢復課程後再報到使用。');
          return;
        }

        const latestList = (await refreshData()) || reservations;
        let targetRes;
        if (reservationId) {
          targetRes = latestList.find(r => r.id === reservationId);
        } else {
          targetRes = latestList.find(r => 
            r.machineId === machineId && 
            (r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中')
          );
        }

        if (targetRes) {
          if (targetRes.status === '使用中') {
            return;
          }
          const realMacId = targetRes.machineId || machineId;
          const now = new Date();
          const nowMinutes = now.getHours() * 60 + now.getMinutes();

          // NOTE: 前端按鈕已會停用，這裡再擋一次，避免舊畫面或重複點擊繞過規則
          if (!force) {
            const eligibility = getStartEligibility(targetRes, latestList, nowMinutes);
            if (!eligibility.canStart) {
              alert(`⚠️ 目前無法開始使用\n\n${eligibility.reason}`);
              return;
            }
          }

          // NOTE: 依緩衝規則決定結束時間（準時不超出原訂結束；前一位提早 10 分鐘內仍可用到原訂結束）
          const newEndMinutes = calculateUsageEndMinutes(targetRes, nowMinutes);

          await supabaseClient.from('reservations').update({
            status: '使用中',
            start_minutes: nowMinutes,
            end_minutes: newEndMinutes,
            start_time_formatted: minutesToTime(nowMinutes),
            end_time_formatted: minutesToTime(newEndMinutes),
            started_at: now.toISOString(),
            called_at: null,
            advance_offered_at: null
          }).eq('id', targetRes.id);

          await supabaseClient.from('machines').update({ status: '使用中' }).eq('id', realMacId);
          await refreshData();
        }
      };

      const finishMachineUsage = async (machineId, reservationId) => {
        let targetResId = reservationId;
        if (!targetResId) {
          const cur = reservations.find(r => r.machineId === machineId && r.status === '使用中');
          targetResId = cur?.id;
        }

        if (targetResId) {
          await supabaseClient.from('reservations').update({ status: '已完成', finished_at: new Date().toISOString() }).eq('id', targetResId);
        }

        // 推進現場排隊隊列 (不改動時段預約)
        await advanceQueueForMachine(machineId, reservations.filter(r => r.id !== targetResId));
        await refreshData();
      };

      const cancelReservation = async (resId) => {
        const target = reservations.find(r => r.id === resId);
        await supabaseClient.from('reservations').update({ status: '已取消', cancelled_at: new Date().toISOString() }).eq('id', resId);
        
        if (target) {
          await advanceQueueForMachine(target.machineId, reservations.filter(r => r.id !== resId));
        }
        await refreshData();
      };

      const clearCompletedReservations = async () => {
        const { data, error } = await supabaseClient
          .from('reservations')
          .delete()
          .eq('email', activeUser.mail)
          .in('status', ['已完成', '已取消'])
          .select();

        if (error) {
          console.error('Clear completed error:', error);
          return { success: false, message: `清除失敗：${error.message}`, count: 0 };
        }
        await refreshData();
        return {
          success: true,
          message: `已成功從資料庫清除 ${data ? data.length : 0} 筆已完成預約紀錄！`,
          count: data ? data.length : 0
        };
      };

      /**
       * 寫入暫停狀態到資料庫
       * @param pausedAtIso 暫停開始時間（ISO），null 代表恢復
       * @returns 是否寫入成功
       */
      const writeCoursePauseState = async (pausedAtIso) => {
        const { error } = await supabaseClient
          .from('system_settings')
          .update({ manual_course_start_time: pausedAtIso })
          .eq('id', COURSE_PAUSE_ROW_ID);
        if (error) console.error('Supabase pause update error:', error);
        return !error;
      };

      const pauseCourse = async (notes = '老師講解中') => {
        const pausedAtIso = new Date().toISOString();
        const ok = await writeCoursePauseState(pausedAtIso);
        if (!ok) {
          alert('⚠️ 暫停狀態寫入資料庫失敗，電視與同學手機不會顯示暫停畫面。請檢查網路後再試一次。');
          return { success: false };
        }
        // 先本機立即生效，其他裝置於下次輪詢（最多 8 秒）同步
        setRemotePausedAt(pausedAtIso);

        const notif = {
          id: `N_${Date.now()}`,
          timestamp: new Date().toLocaleTimeString('zh-TW'),
          recipientName: '全體師生',
          machineName: '全機台',
          subject: '【課程暫停】老師講解中',
          body: `老師已啟動課程暫停（講解進行中），所有機台操作暫停，時段將於講解結束後自動往後順延！`
        };
        setNotifications(prev => [notif, ...prev]);
        await refreshData();
        return { success: true };
      };

      const resumeCourse = async () => {
        const pausedAtStr = coursePausedAt || new Date().toISOString();
        const pausedAt = new Date(pausedAtStr);
        const now = new Date();
        const diffMs = Math.max(0, now.getTime() - pausedAt.getTime());
        // 向上取整至少 1 分鐘
        const elapsedMin = Math.max(1, Math.ceil(diffMs / (1000 * 60)));

        // 找出所有需要順延的預約（使用中、等候報到、排隊中、等待中）
        const activeList = reservations.filter(r => 
          r.status === '使用中' || r.status === '等候報到' || r.status === '排隊中' || r.status === '等待中'
        );

        // 順延預約時段
        for (const r of activeList) {
          const newStart = r.startMinutes + elapsedMin;
          const newEnd = r.endMinutes + elapsedMin;
          await supabaseClient.from('reservations').update({
            start_minutes: newStart,
            end_minutes: newEnd,
            start_time_formatted: minutesToTime(newStart),
            end_time_formatted: minutesToTime(newEnd)
          }).eq('id', r.id);
        }

        const ok = await writeCoursePauseState(null);
        if (!ok) {
          alert('⚠️ 恢復狀態寫入資料庫失敗，電視與手機可能仍顯示暫停畫面。請再按一次「恢復課程」。');
        } else {
          setRemotePausedAt(null);
        }

        const notif = {
          id: `N_${Date.now()}`,
          timestamp: new Date().toLocaleTimeString('zh-TW'),
          recipientName: '全體師生',
          machineName: '全機台',
          subject: '【課程已恢復】時段已自動順延',
          body: `老師講解結束，課程已恢復！所有進行中與排隊中的預約已自動往後順延 ${elapsedMin} 分鐘。`
        };
        setNotifications(prev => [notif, ...prev]);

        await refreshData();
        return { success: true, elapsedMin, count: activeList.length };
      };

      const setCurrentCourseSession = async (sessId) => {
        await supabaseClient.from('course_sessions').update({ is_current: false }).neq('id', '00000000-0000-0000-0000-000000000000');
        await supabaseClient.from('course_sessions').update({ is_current: true }).eq('id', sessId);
        await refreshData();
      };

      const updateSettings = async (sett) => {
        await supabaseClient.from('system_settings').update(sett).eq('id', 'DEFAULT');
        await refreshData();
      };

      /**
       * 助教/管理員手動拖曳重新排序機台等候名單
       * @param {string} machineId 機台 ID
       * @param {Array<string>} orderedIds 排序後的 reservation ID 清單
       * @param {string|null} movedId 剛被拖動的 reservation ID
       */
      const reorderMachineQueue = async (machineId, orderedIds, movedId = null) => {
        if (!supabaseClient) return { success: false, message: '尚未連線至資料庫' };

        const latestList = (await refreshData()) || reservations;

        // 1. 取得該機台等候中的預約清單
        const macWaiting = latestList.filter(r => 
          r.machineId === machineId && 
          WAITING_RESERVATION_STATUSES.includes(r.status) &&
          !hasReservationStartedOrInUse(r)
        );

        if (macWaiting.length === 0) return { success: true };

        // 依照 orderedIds 進行排序
        const idMap = new Map(orderedIds.map((id, idx) => [id, idx]));
        const orderedList = [...macWaiting].sort((a, b) => {
          const idxA = idMap.has(a.id) ? idMap.get(a.id) : 999;
          const idxB = idMap.has(b.id) ? idMap.get(b.id) : 999;
          return idxA - idxB;
        });

        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const roundedNow = Math.ceil(nowMin / 10) * 10;

        // 檢查機台當前是否有「使用中」
        const inUse = latestList.find(r => r.machineId === machineId && r.status === '使用中');
        const baseStartMin = inUse ? inUse.endMinutes : roundedNow;

        // 2. 重新計算時程
        const recalculated = recalculateMachineSchedule(orderedList, movedId, baseStartMin);

        // 3. 跨機台衝堂檢查（警告但不阻擋助教決定）
        const conflictWarnings = [];
        for (const item of recalculated) {
          const c = findStudentConflict(latestList, item.students, item.email, item.startMinutes, item.durationMinutes, item.id);
          if (c) {
            conflictWarnings.push(`同學【${(item.students || []).join(', ')}】在【${c.machineName}】（${c.startTimeFormatted} ～ ${c.endTimeFormatted}）有衝堂`);
          }
        }
        if (conflictWarnings.length > 0) {
          const confirmMsg = `⚠️ 順序調動後發現有同學跨機台衝堂：\n\n${conflictWarnings.slice(0, 3).join('\n')}${conflictWarnings.length > 3 ? '\n...等' : ''}\n\n助教是否仍要確定儲存此順序？`;
          if (!window.confirm(confirmMsg)) {
            await refreshData();
            return { success: false, message: '助教已取消調整' };
          }
        }

        // 4. 批次更新狀態與時間（附帶原子狀態條件鎖，避免覆寫剛報到上機的紀錄）
        const updates = [];
        for (let i = 0; i < recalculated.length; i++) {
          const item = recalculated[i];
          const isFirst = (i === 0 && !inUse);
          let newStatus = '排隊中';
          let calledAt = null;

          if (isFirst) {
            if (item.type === '現場排隊') {
              newStatus = '等候報到';
              calledAt = (item.status === '等候報到' && item.calledAt) ? item.calledAt : now.toISOString();
            } else if (item.type === '時段預約') {
              if (nowMin >= item.startMinutes) {
                newStatus = '等候報到';
                calledAt = (item.status === '等候報到' && item.calledAt) ? item.calledAt : now.toISOString();
              } else {
                newStatus = '排隊中';
              }
            }
          }

          const payload = {
            start_minutes: item.startMinutes,
            end_minutes: item.endMinutes,
            start_time_formatted: item.startTimeFormatted,
            end_time_formatted: item.endTimeFormatted,
            status: newStatus,
            called_at: calledAt,
            started_at: null,
            advance_offered_at: null
          };
          updates.push(
            supabaseClient
              .from('reservations')
              .update(payload)
              .eq('id', item.id)
              .in('status', WAITING_RESERVATION_STATUSES)
          );
        }

        await Promise.all(updates);

        // 5. 更新機台狀態
        const firstItem = recalculated[0];
        let machineStatus = '空閒';
        if (inUse) {
          machineStatus = '使用中';
        } else if (firstItem && (firstItem.status === '等候報到' || (firstItem.type === '現場排隊' && nowMin >= firstItem.startMinutes))) {
          machineStatus = '等待報到';
        }
        await supabaseClient.from('machines').update({ status: machineStatus }).eq('id', machineId);

        // 6. 若第一位換成新的排隊同學，發送叫號通知
        if (!inUse && recalculated.length > 0 && recalculated[0].type === '現場排隊') {
          const newTop = recalculated[0];
          const prevTop = macWaiting[0];
          if (!prevTop || prevTop.id !== newTop.id) {
            sendQueueCallNotification({
              studentNames: newTop.students.join(', '),
              machineName: newTop.machineName,
              startTime: newTop.startTimeFormatted,
              endTime: newTop.endTimeFormatted,
              durationMinutes: newTop.durationMinutes,
              toEmail: newTop.email || ''
            });
          }
        }

        await refreshData();
        return { success: true };
      };

      /**
       * 助教手動延遲或提前單筆預約時間
       * @param {string} reservationId 欲調整的預約 ID
       * @param {number} deltaMinutes 變更的分鐘數（+10 延後, -10 提前）
       */
      const shiftReservationTime = async (reservationId, deltaMinutes) => {
        if (!supabaseClient) return { success: false, message: '尚未連線至資料庫' };
        const latestList = (await refreshData()) || reservations;
        const target = latestList.find(r => r.id === reservationId);
        if (!target) return { success: false, message: '找不到此預約' };

        const machineId = target.machineId;
        const macWaiting = latestList
          .filter(r => 
            r.machineId === machineId && 
            WAITING_RESERVATION_STATUSES.includes(r.status) &&
            !hasReservationStartedOrInUse(r)
          )
          .sort((a, b) => a.startMinutes - b.startMinutes);

        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const roundedNow = Math.ceil(nowMin / 10) * 10;
        const inUse = latestList.find(r => r.machineId === machineId && r.status === '使用中');
        const baseStartMin = inUse ? inUse.endMinutes : roundedNow;

        const shiftedList = shiftReservationSchedule(macWaiting, reservationId, deltaMinutes, baseStartMin);

        // 檢查衝堂
        const conflictWarnings = [];
        for (const item of shiftedList) {
          const c = findStudentConflict(latestList, item.students, item.email, item.startMinutes, item.durationMinutes, item.id);
          if (c) {
            conflictWarnings.push(`同學【${(item.students || []).join(', ')}】在【${c.machineName}】（${c.startTimeFormatted} ～ ${c.endTimeFormatted}）有衝堂`);
          }
        }
        if (conflictWarnings.length > 0) {
          const confirmMsg = `⚠️ 時間調整後發現有同學跨機台衝堂：\n\n${conflictWarnings.slice(0, 3).join('\n')}${conflictWarnings.length > 3 ? '\n...等' : ''}\n\n助教是否仍要確定調整？`;
          if (!window.confirm(confirmMsg)) {
            return { success: false, message: '助教已取消調整' };
          }
        }

        const updates = shiftedList.map(item => 
          supabaseClient
            .from('reservations')
            .update({
              start_minutes: item.startMinutes,
              end_minutes: item.endMinutes,
              start_time_formatted: item.startTimeFormatted,
              end_time_formatted: item.endTimeFormatted,
              started_at: null
            })
            .eq('id', item.id)
            .in('status', WAITING_RESERVATION_STATUSES)
        );
        await Promise.all(updates);
        await refreshData();
        return { success: true };
      };

      return (
        <AppContext.Provider value={{
          machines,
          reservations,
          students,
          courseSessions,
          systemSettings,
          notifications,
          activeUser,
          isLoggedIn,
          activeTab,
          isLiveSupabase,
          isLoading,
          isCoursePaused,
          coursePausedAt,
          pauseCourse,
          resumeCourse,
          setActiveTab,
          setActiveUser,
          loginWithEmail,
          logout,
          createReservation,
          startMachineUsage,
          finishMachineUsage,
          cancelReservation,
          clearCompletedReservations,
          setCurrentCourseSession,
          acceptEarlyStart,
          declineEarlyStart,
          updateSettings,
          reorderMachineQueue,
          shiftReservationTime,
          refreshData
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useApp = () => useContext(AppContext);

    // ============================================================
    // 4. 登入介面元件 (LoginView)
    // ============================================================

    // ============================================================
    // 5. 時段矩陣元件 (TimeTableMatrix) - 動態依照課程時段生成，支援彈性格數選擇
    // ============================================================
    const MINUTES_STEP = [0, 10, 20, 30, 40, 50];

    function TimeTableMatrix({ machineId, minDuration = 10, maxDuration, selectedStartSlot, selectedDuration, selectedStudents, userEmail, onSelectSlot, onSelectDuration }) {
      const { reservations, systemSettings } = useApp();
      const effectiveTimes = getEffectiveCourseTimes(systemSettings);
      const courseStartMin = effectiveTimes.startTime.getHours() * 60 + effectiveTimes.startTime.getMinutes();
      const courseEndMin = effectiveTimes.endTime.getHours() * 60 + effectiveTimes.endTime.getMinutes();

      const startHour = Math.floor(courseStartMin / 60);
      const endHour = Math.floor((Math.max(courseEndMin, courseStartMin + 10) - 1) / 60);

      const hoursList = [];
      for (let h = startHour; h <= endHour; h++) {
        hoursList.push(h);
      }

      const selectedStartMinutes = selectedStartSlot ? timeToMinutes(selectedStartSlot) : null;
      // 實際被選中的格數（以分鐘計）
      const effectiveDuration = selectedDuration || minDuration;

      const durationOptions = [];
      for (let d = minDuration; d <= maxDuration; d += 10) {
        durationOptions.push(d);
      }

      const getSlotState = (slotMinutes) => {
        const timeLabel = minutesToTime(slotMinutes);

        // 超出課程時間
        if (slotMinutes < courseStartMin || slotMinutes >= courseEndMin) {
          return { status: 'out_of_course', symbol: '·', label: timeLabel };
        }

        // 已選中的範圍（依照 effectiveDuration 顯示）
        if (
          selectedStartMinutes !== null &&
          slotMinutes >= selectedStartMinutes &&
          slotMinutes < selectedStartMinutes + effectiveDuration
        ) {
          return { status: 'selected', symbol: '●', label: timeLabel };
        }

        // 1. 檢查本機台是否已被占用
        const isOccupied = reservations.some(r => {
          if (r.machineId !== machineId) return false;
          if (r.status === '已取消' || r.status === '已完成' || r.status === '未報到') return false;
          return slotMinutes >= r.startMinutes && slotMinutes < r.endMinutes;
        });

        if (isOccupied) {
          return { status: 'occupied', symbol: '■', label: timeLabel };
        }

        // 2. 檢查選定同學在其他機台是否已有預約（跨機台衝突）
        const studentHit = findStudentConflict(reservations, selectedStudents, userEmail, slotMinutes, 10);
        if (studentHit) {
          return { status: 'student_busy', symbol: '▲', label: timeLabel, conflictMachine: studentHit.machineName };
        }

        return { status: 'available', symbol: '○', label: timeLabel };
      };

      const handleCellClick = (slotMinutes) => {
        if (slotMinutes < courseStartMin || slotMinutes >= courseEndMin) return;

        // NOTE: 點擊邏輯——
        // 若已有起點：
        if (selectedStartMinutes !== null) {
          const clickedOffset = slotMinutes - selectedStartMinutes; // 點擊格距起點的分鐘數

          // 點擊起點本身：在 10 分鐘與 20 分鐘（若上限允許）之間切換
          if (clickedOffset === 0) {
            const toggleDur = effectiveDuration > minDuration ? minDuration : (maxDuration >= 20 ? 20 : minDuration);
            if (toggleDur > minDuration) {
              if (hasReservationConflict(reservations, machineId, selectedStartMinutes, toggleDur)) {
                alert(`時段衝突！延長為 ${toggleDur} 分鐘會與該機台已有預約重疊。`);
                return;
              }
              const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, selectedStartMinutes, toggleDur);
              if (studentConflict) {
                alert(`跨機台衝突！\n同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約！`);
                return;
              }
            }
            onSelectDuration(toggleDur);
            return;
          }

          if (clickedOffset > 0 && clickedOffset < effectiveDuration) {
            // 點選已選範圍「內部」：縮短，新 duration = clickedOffset + 10
            const newDuration = clickedOffset + 10;
            if (newDuration >= minDuration) {
              onSelectDuration(newDuration);
              return;
            }
          } else if (clickedOffset >= effectiveDuration && clickedOffset < maxDuration) {
            // 點選已選範圍「之後」：延長到該格（+10 分鐘）
            const newDuration = clickedOffset + 10;
            if (newDuration <= maxDuration) {
              // 檢查延長範圍內是否有本機台衝突
              if (hasReservationConflict(reservations, machineId, selectedStartMinutes, newDuration)) {
                alert(`時段衝突！延長到此格會與該機台已有預約重疊，請選其他範圍。`);
                return;
              }
              // 檢查延長範圍內是否有同學跨機台衝突
              const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, selectedStartMinutes, newDuration);
              if (studentConflict) {
                alert(`跨機台衝突！\n同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約，同時間不可重複預約！`);
                return;
              }
              onSelectDuration(newDuration);
              return;
            }
          }
        }

        // 設定新起點（或重選起點）
        if (slotMinutes + minDuration > courseEndMin) {
          alert(`無法預約！此時段距課程結束不足最少使用時長 ${minDuration} 分鐘（${minutesToTime(courseEndMin)} 結束）。`);
          return;
        }

        // 計算可用的最大 duration（不超過課程結束也不超過 maxDuration）
        const maxPossible = Math.min(maxDuration, courseEndMin - slotMinutes);
        const adjustedMax = Math.floor(maxPossible / 10) * 10;
        const targetDuration = Math.min(effectiveDuration || maxDuration, adjustedMax);

        if (hasReservationConflict(reservations, machineId, slotMinutes, minDuration)) {
          alert(`時段衝突！該機台從 ${minutesToTime(slotMinutes)} 開始的最少時長（${minDuration} 分鐘）已有預約，請換時段！`);
          return;
        }

        const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, slotMinutes, minDuration);
        if (studentConflict) {
          alert(`跨機台時段衝突！\n名單中的同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約/排隊，同時間不可預約不同機台！`);
          return;
        }

        onSelectSlot(minutesToTime(slotMinutes));
        // 若 targetDuration 無衝突則套用，否則退回 minDuration (10分鐘)
        if (!hasReservationConflict(reservations, machineId, slotMinutes, targetDuration) && 
            !findStudentConflict(reservations, selectedStudents, userEmail, slotMinutes, targetDuration)) {
          onSelectDuration(targetDuration);
        } else {
          onSelectDuration(minDuration);
        }
      };

      const selectedSlots = effectiveDuration / 10;
      const maxSlots = maxDuration / 10;
      const minSlots = minDuration / 10;

      return (
        <div className="space-y-2.5">
          <div className="flex items-center justify-between text-xs font-semibold text-slate-700">
            <span>課程時段矩陣 ({minutesToTime(courseStartMin)} ～ {minutesToTime(courseEndMin)})：</span>
            <div className="flex items-center gap-3 text-[11px]">
              <span className="text-emerald-600 font-bold">○ 可選</span>
              <span className="text-blue-600 font-bold">● 選定 ({selectedSlots}格)</span>
              <span className="text-slate-400 font-bold">■ 已占用</span>
              <span className="text-amber-600 font-bold">▲ 跨機台衝突</span>
            </div>
          </div>

          {/* 時長切換按鈕組：一人可選 10 或 20 分鐘；多人可選 10 ~ maxDuration */}
          <div className="flex items-center justify-between gap-2 flex-wrap bg-slate-50 border border-slate-200 rounded-xl p-2.5">
            <span className="text-xs font-bold text-slate-700">選擇預約時長：</span>
            <div className="flex items-center gap-1.5 flex-wrap">
              {durationOptions.map(dur => {
                const isSelected = effectiveDuration === dur;
                return (
                  <button
                    key={dur}
                    type="button"
                    onClick={() => {
                      if (selectedStartMinutes !== null) {
                        if (selectedStartMinutes + dur > courseEndMin) {
                          alert(`時長超過課程結束時間（${minutesToTime(courseEndMin)} 結束）！`);
                          return;
                        }
                        if (hasReservationConflict(reservations, machineId, selectedStartMinutes, dur)) {
                          alert(`時段衝突！該機台在選定區間（${dur} 分鐘）內已有其他預約。`);
                          return;
                        }
                        const studentConflict = findStudentConflict(reservations, selectedStudents, userEmail, selectedStartMinutes, dur);
                        if (studentConflict) {
                          alert(`跨機台衝突！\n同學在 ${studentConflict.startTimeFormatted} ～ ${studentConflict.endTimeFormatted} 已在【${studentConflict.machineName}】有預約！`);
                          return;
                        }
                      }
                      onSelectDuration(dur);
                    }}
                    className={`px-3 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      isSelected
                        ? 'bg-blue-600 text-white shadow-xs'
                        : 'bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-2xs'
                    }`}
                  >
                    {dur} 分鐘（{dur / 10} 格）
                  </button>
                );
              })}
            </div>
          </div>

          {/* 提示使用者可自由調整格數範圍 */}
          <div className="text-[11px] text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
            💡 點選格子設定時段，可透過上方按鈕或點選格子自由切換 <strong>10 分鐘（1 格）</strong> 或 <strong>20 分鐘（2 格）</strong>。
          </div>

          <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-2xs">
            <table className="w-full text-center border-collapse text-xs">
              <thead>
                <tr className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <th className="py-2 px-1 border-r border-slate-200 w-14 text-[11px]">小時</th>
                  {MINUTES_STEP.map(m => (
                    <th key={m} className="py-2 px-0.5 border-r border-slate-100 last:border-r-0 text-[10.5px] font-semibold text-slate-600 whitespace-nowrap">
                      {m === 0 ? '0' : m}~{m + 10}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {hoursList.map(hNum => {
                  const hStr = hNum.toString().padStart(2, '0');
                  return (
                    <tr key={hNum} className="border-b border-slate-100 hover:bg-slate-50/50">
                      <td className="py-2 px-2 font-bold text-slate-700 bg-slate-50/80 border-r border-slate-200 text-xs">
                        {hStr}:00
                      </td>
                      {MINUTES_STEP.map(mStep => {
                        const slotMin = hNum * 60 + mStep;
                        const info = getSlotState(slotMin);
                        let style = 'text-slate-200 bg-slate-50/40 cursor-not-allowed select-none';
                        if (info.status === 'selected') style = 'bg-blue-600 text-white font-bold cursor-pointer';
                        else if (info.status === 'occupied') style = 'text-slate-400 bg-slate-100/90 font-bold cursor-not-allowed';
                        else if (info.status === 'student_busy') style = 'text-amber-600 bg-amber-50 font-bold cursor-pointer';
                        else if (info.status === 'available') style = 'text-emerald-600 hover:bg-emerald-50 cursor-pointer font-bold';

                        return (
                          <td
                            key={mStep}
                            className={`py-2 px-1 border-r border-slate-100 last:border-r-0 text-sm select-none ${style}`}
                            onClick={() => (info.status === 'available' || info.status === 'selected' || info.status === 'student_busy') && handleCellClick(slotMin)}
                            title={`${info.label} ${info.status === 'out_of_course' ? '(非課程時段)' : info.status === 'occupied' ? '(機台已占用)' : info.status === 'student_busy' ? `(同學在此時段已預約【${info.conflictMachine}】)` : info.status === 'selected' ? '(點擊縮短至此格)' : '(可預約)'}`}
                          >
                            {info.symbol}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {selectedStartSlot && (
            <div className="bg-blue-50 border border-blue-200 text-blue-900 px-3 py-2 rounded-xl text-xs flex items-center justify-between font-medium">
              <span>已選：<strong>{selectedStartSlot}</strong> ～ <strong>{minutesToTime(timeToMinutes(selectedStartSlot) + effectiveDuration)}</strong></span>
              <span className="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold">共 {effectiveDuration} 分鐘（{selectedSlots} 格）</span>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 6. 新增預約 / 現場排隊 Modal (連動 24h 前時段預約與開課現場排隊限制)
    // ============================================================
    function ReservationModal({ initialMachineId, onClose }) {
      const { machines, students, activeUser, reservations, systemSettings, createReservation } = useApp();
      const effectiveTimes = getEffectiveCourseTimes(systemSettings);
      const phaseInfo = getCurrentBookingPhase(systemSettings);

      const courseStartMin = effectiveTimes.startTime.getHours() * 60 + effectiveTimes.startTime.getMinutes();
      const courseEndMin = effectiveTimes.endTime.getHours() * 60 + effectiveTimes.endTime.getMinutes();

      // 候選名單：過濾掉登入本人，本人必定直接包含在預約名單中
      const otherStudents = useMemo(() => {
        return students.filter(s => s.name !== activeUser?.name && s.mail !== activeUser?.mail);
      }, [students, activeUser]);

      // 當前機台資訊（固定機台，更換須從機台列表進入）
      const selectedMachineId = initialMachineId || machines[0]?.id || '帶鋸機';
      const targetMachine = machines.find(m => m.id === selectedMachineId);
      const machineName = targetMachine?.name || selectedMachineId;

      const [reservationType, setReservationType] = useState(
        phaseInfo.allowedType === '現場排隊' ? '現場排隊' : '時段預約'
      );
      const [selectedStudents, setSelectedStudents] = useState([activeUser?.name || '']);
      const [selectedSlotId, setSelectedSlotId] = useState(minutesToTime(courseStartMin));
      const [isSubmitting, setIsSubmitting] = useState(false);

      // NOTE: 確保登入者本人始終存在於名單首位
      useEffect(() => {
        if (activeUser?.name) {
          setSelectedStudents(prev => {
            const clean = prev.filter(Boolean);
            if (!clean.includes(activeUser.name)) {
              return [activeUser.name, ...clean];
            }
            return clean;
          });
        }
      }, [activeUser?.name]);

      // NOTE: 最少 10 分鐘（1格），最多由學生人數決定（1人最多20分鐘，2人最多30分鐘...）
      const MIN_DURATION = 10;
      const maxDuration = calculateUsageMinutes(selectedStudents.length);
      // 使用者自選的時長 state，預設為最大值，切換學生人數時維持合理範圍
      const [selectedDuration, setSelectedDuration] = useState(maxDuration);

      // 當學生人數改變時，確保 selectedDuration 介於 MIN_DURATION 與 maxDuration 之間
      useEffect(() => {
        setSelectedDuration(prev => {
          if (prev > maxDuration) return maxDuration;
          if (prev < MIN_DURATION) return MIN_DURATION;
          return prev;
        });
      }, [maxDuration]);

      const durationOptions = useMemo(() => {
        const opts = [];
        for (let d = MIN_DURATION; d <= maxDuration; d += 10) {
          opts.push(d);
        }
        return opts;
      }, [MIN_DURATION, maxDuration]);

      // 切換時段時保留使用者自選時長
      const handleSelectSlot = (slotId) => {
        setSelectedSlotId(slotId);
      };

      // 現場排隊推算：同時檢查本人與所有勾選組員準備使用的預約時段，若卡到自動往後順延
      const modalNowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const queuePlan = calculateDynamicQueuePlan(
        reservations,
        selectedMachineId,
        selectedDuration,
        courseEndMin,
        selectedStudents,
        activeUser?.mail,
        modalNowMin
      );
      const queueStartMin = queuePlan.startMin;
      const queueEndMin = queuePlan.endMin;

      // 即時檢查預約/排隊是否有衝突
      const targetStartMin = reservationType === '現場排隊' ? queueStartMin : timeToMinutes(selectedSlotId);
      const conflictInfo = checkReservationConflict(
        reservations,
        selectedMachineId,
        targetStartMin,
        selectedDuration,
        selectedStudents,
        activeUser?.mail,
        courseEndMin,
        null,
        reservationType === '現場排隊' ? modalNowMin : null
      );

      const isSlotAllowed = phaseInfo.phase === 'SLOT_ONLY';
      const isQueueAllowed = phaseInfo.phase === 'QUEUE_ONLY' && systemSettings?.allow_walk_in_queue !== false;

      useEffect(() => {
        if (phaseInfo.phase === 'QUEUE_ONLY') setReservationType('現場排隊');
        else if (phaseInfo.phase === 'SLOT_ONLY') setReservationType('時段預約');
      }, [phaseInfo.phase]);

      const toggleStudent = (sName) => {
        if (sName === activeUser?.name) {
          return; // 本人不可取消勾選
        }
        if (selectedStudents.includes(sName)) {
          // 取消勾選組員
          setSelectedStudents(prev => prev.filter(s => s !== sName));
        } else {
          // 勾選組員：最多只能勾選 4 人（連同本人共 5 人）
          if (selectedStudents.length >= 5) {
            alert('⚠️ 最多只能勾選 4 位組員（連同預約本人共 5 人上限）！');
            return;
          }
          setSelectedStudents(prev => [...prev, sName]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!selectedMachineId) return alert('請選擇預約機台！');
        
        // 確保本人一定在名單中
        const finalStudents = selectedStudents.includes(activeUser?.name)
          ? selectedStudents
          : [activeUser?.name, ...selectedStudents];

        if (finalStudents.length === 0) return alert('請至少選擇一位學生！');

        // 衝突防呆檢查
        if (conflictInfo.hasConflict) {
          alert(`❌ 無法預約：${conflictInfo.message}`);
          return;
        }

        // 業務防呆驗證 (友善繁體中文提示)
        if (reservationType === '現場排隊') {
          if (phaseInfo.phase !== 'QUEUE_ONLY') {
            alert(`⚠️ 現在是非上課時段，不能進行現場排隊預約！\n\n• 現場排隊開放時段：課程進行中 (${formatDateTime(effectiveTimes.startTime)} ～ ${formatDateTime(effectiveTimes.endTime)})\n• 如需預約下堂課，請於開課前 24 小時使用「時段預約」。`);
            return;
          }
          if (systemSettings?.allow_walk_in_queue === false) {
            alert('⚠️ 目前系統已關閉現場排隊功能，請洽授課老師/助教！');
            return;
          }
        }

        if (reservationType === '時段預約') {
          if (phaseInfo.phase !== 'SLOT_ONLY') {
            if (phaseInfo.phase === 'QUEUE_ONLY') {
              alert('⚠️ 課程已開始進行中，目前僅開放「現場排隊」，時段預約已截止！');
            } else if (phaseInfo.phase === 'NOT_OPEN') {
              alert(`⚠️ 現在非時段預約開放時間！\n\n系統將於課程開始前 24 小時（${formatDateTime(effectiveTimes.openBookingTime)}）正式開放時段預約。`);
            } else {
              alert('⚠️ 本次課程已經結束，不再接受預約！');
            }
            return;
          }

          if (!selectedSlotId) return alert('請於時段矩陣中點選開始預約之時段！');
        }

        setIsSubmitting(true);
        try {
          const res = await createReservation({
            machineId: selectedMachineId,
            type: reservationType,
            students: finalStudents,
            timeSlotId: selectedSlotId,
            // NOTE: 傳入使用者自選的 duration，後端以此為準而非重新計算
            customDuration: selectedDuration
          });
          if (!res.success) {
            alert(`❌ 預約失敗：${res.message}`);
          } else {
            alert(`✅ ${res.message}`);
            onClose();
          }
        } catch (err) {
          alert(`❌ 系統提示：${err.message || '預約處理發生錯誤'}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl max-w-xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[92vh] border border-slate-200">
            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
              <div>
                <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span>{machineName}</span>
                  <span className="text-xs font-semibold text-slate-500">新增預約 / 現場排隊</span>
                </h3>
                <p className="text-[11px] text-slate-500 font-semibold mt-0.5">
                  課程時間：{formatDateTime(effectiveTimes.startTime)} ～ {formatDateTime(effectiveTimes.endTime)}
                </p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg font-bold p-1 cursor-pointer">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4">
              {/* 開放狀態提示 Banner */}
              <div className={`p-3.5 rounded-2xl border text-xs flex items-start gap-2 ${
                phaseInfo.phase === 'SLOT_ONLY'
                  ? 'bg-blue-50 border-blue-200 text-blue-900'
                  : phaseInfo.phase === 'QUEUE_ONLY'
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
                  : 'bg-amber-50 border-amber-200 text-amber-900'
              }`}>
                <span>{phaseInfo.phase === 'QUEUE_ONLY' ? '⏱️' : phaseInfo.phase === 'SLOT_ONLY' ? '📅' : '⚠️'}</span>
                <div>
                  <div className="font-bold">{phaseInfo.title}</div>
                  <div className="text-[11px] opacity-90 mt-0.5">{phaseInfo.description}</div>
                </div>
              </div>

              {/* 模式切換頁籤 (Tab) */}
              <div className="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl gap-1">
                <button
                  type="button"
                  className={`py-2 px-3 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all ${
                    reservationType === '時段預約'
                      ? 'bg-white text-blue-600 shadow-xs'
                      : isSlotAllowed
                      ? 'text-slate-600 hover:text-slate-900'
                      : 'text-slate-400 bg-slate-100/50 cursor-pointer'
                  }`}
                  onClick={() => setReservationType('時段預約')}
                >
                  時段預約
                </button>
                <button
                  type="button"
                  className={`py-2 px-3 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all ${
                    reservationType === '現場排隊'
                      ? 'bg-white text-blue-600 shadow-xs'
                      : isQueueAllowed
                      ? 'text-slate-600 hover:text-slate-900'
                      : 'text-slate-400 bg-slate-100/50 cursor-pointer'
                  }`}
                  onClick={() => setReservationType('現場排隊')}
                >
                  現場排隊
                </button>
              </div>

              {/* 選擇共同組員 */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">選擇共同組員：</label>

                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2.5">
                  {/* 預約本人：單行顯示不換行 */}
                  <div className="bg-blue-50/70 border border-blue-200/80 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 whitespace-nowrap overflow-hidden">
                    <span className="text-blue-600 font-bold shrink-0">👤 預約者（本人）：</span>
                    <span className="font-bold text-slate-900 truncate">{activeUser?.name}</span>
                  </div>

                  {/* 其他可勾選組員（最多勾選 4 人） */}
                  <div>
                    <div className="text-[11px] font-semibold text-slate-500 mb-1.5 flex items-center justify-between">
                      <span>可勾選其他組員（已選 {selectedStudents.length - 1} / 4 人）：</span>
                      {selectedStudents.length >= 5 && (
                        <span className="text-amber-600 font-bold text-[10px]">已達 4 位組員上限</span>
                      )}
                    </div>
                    {otherStudents.length > 0 ? (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        {otherStudents.map(s => {
                          const sel = selectedStudents.includes(s.name);
                          const isMaxReached = !sel && selectedStudents.length >= 5;
                          return (
                            <label
                              key={s.id}
                              className={`flex items-center gap-2 p-2 rounded-xl border transition-all cursor-pointer ${
                                sel
                                  ? 'bg-blue-50 border-blue-400 text-blue-900 font-bold shadow-2xs'
                                  : isMaxReached
                                  ? 'bg-slate-100/60 border-slate-200 text-slate-400 cursor-not-allowed'
                                  : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={sel}
                                disabled={isMaxReached}
                                onChange={() => toggleStudent(s.name)}
                                className="rounded text-blue-600"
                              />
                              <span className="truncate">{s.name}</span>
                            </label>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400 py-1">目前無其他可選擇的組員</p>
                    )}
                  </div>
                </div>
              </div>

              {reservationType === '時段預約' ? (
                <div className="space-y-2.5">
                  <TimeTableMatrix
                    machineId={selectedMachineId}
                    minDuration={MIN_DURATION}
                    maxDuration={maxDuration}
                    selectedStartSlot={selectedSlotId}
                    selectedDuration={selectedDuration}
                    selectedStudents={selectedStudents}
                    userEmail={activeUser?.mail}
                    onSelectSlot={handleSelectSlot}
                    onSelectDuration={setSelectedDuration}
                  />
                  {conflictInfo.hasConflict && (
                    <div className="bg-rose-50 border border-rose-300 p-3 rounded-2xl text-xs text-rose-800 font-bold flex items-start gap-2">
                      <span className="shrink-0 text-base">⚠️</span>
                      <div>
                        <div>時段衝突無法預約</div>
                        <div className="font-normal text-[11px] text-rose-700 mt-0.5">{conflictInfo.message}</div>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div className={`p-4 rounded-2xl border space-y-2 text-xs transition-colors ${
                  conflictInfo.hasConflict 
                    ? 'bg-rose-50 border-rose-300 text-rose-900' 
                    : 'bg-emerald-50 border-emerald-200 text-emerald-900'
                }`}>
                  <div className="flex items-center justify-between">
                    <p className="font-bold flex items-center gap-1.5">
                      <span>{conflictInfo.hasConflict ? '⚠️' : '⏱️'}</span>
                      <span>現場排隊即時推算：</span>
                    </p>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      conflictInfo.hasConflict 
                        ? 'bg-rose-200 text-rose-800' 
                        : 'bg-emerald-200 text-emerald-800'
                    }`}>
                      {conflictInfo.hasConflict ? '時段衝突無法排隊' : '時段可正常排隊'}
                    </span>
                  </div>

                  <p className={conflictInfo.hasConflict ? 'text-rose-700 font-medium' : 'text-emerald-800 font-medium'}>
                    目前課程進行中，依據機台現有隊列與人數（{selectedStudents.length} 人，共 {selectedDuration} 分鐘）為您推算之預計開始時間為：
                  </p>

                  <div className={`p-3 rounded-xl border font-mono text-base text-center font-extrabold ${
                    conflictInfo.hasConflict
                      ? 'bg-white border-rose-300 text-rose-600 line-through'
                      : 'bg-white border-emerald-200 text-slate-900'
                  }`}>
                    {minutesToTime(queueStartMin)} ～ {minutesToTime(queueEndMin)}
                  </div>

                  {/* 若時間因組員既有預約或本機台前方隊列而往後順延，顯示友善提示 */}
                  {queueStartMin > queuePlan.baseNowMin && !conflictInfo.hasConflict && (
                    <div className="bg-emerald-100/80 border border-emerald-300/80 px-3 py-2 rounded-xl text-[11px] text-emerald-900 flex items-start gap-1.5">
                      <span className="shrink-0 text-xs">💡</span>
                      <div className="space-y-0.5">
                        {queuePlan.delayedByStudentConflicts.length > 0 ? (
                          <>
                            <div>
                              已檢查到名單內組員有重疊預約（
                              {queuePlan.delayedByStudentConflicts.map(c => `${c.studentNames.join('、')}：${c.machineName} ${c.startTimeFormatted}～${c.endTimeFormatted}`).join('；')}
                              ），系統已自動將排隊時間往後順延至<strong>最早可用時段（{minutesToTime(queueStartMin)} ～ {minutesToTime(queueEndMin)}）</strong>。
                            </div>
                          </>
                        ) : (
                          <div>
                            已自動為您避開本機台前方隊列與既有預約，排至<strong>最早可用時段（{minutesToTime(queueStartMin)} ～ {minutesToTime(queueEndMin)}）</strong>。
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* 現場排隊時長選擇按鈕組 */}
                  <div className="flex items-center gap-2 flex-wrap pt-1">
                    <span className="font-bold text-slate-700">選擇使用時長：</span>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      {durationOptions.map(dur => {
                        const isSelected = selectedDuration === dur;
                        return (
                          <button
                            key={dur}
                            type="button"
                            onClick={() => setSelectedDuration(dur)}
                            className={`px-3 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                              isSelected
                                ? 'bg-blue-600 text-white shadow-xs'
                                : 'bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-2xs'
                            }`}
                          >
                            {dur} 分鐘
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {conflictInfo.hasConflict && (
                    <div className="bg-rose-100/90 border border-rose-300 p-2.5 rounded-xl text-xs text-rose-800 font-bold flex items-start gap-1.5 mt-2">
                      <span className="shrink-0 text-sm">❌</span>
                      <span>{conflictInfo.message}</span>
                    </div>
                  )}
                </div>
              )}

              <div className="pt-3 border-t border-slate-100 flex justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold cursor-pointer transition-colors"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting || conflictInfo.hasConflict}
                  className={`px-5 py-2.5 rounded-xl font-bold text-xs shadow-md transition-all ${
                    conflictInfo.hasConflict
                      ? 'bg-slate-300 text-slate-500 cursor-not-allowed shadow-none'
                      : 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/20 active:scale-95 cursor-pointer'
                  }`}
                  title={conflictInfo.hasConflict ? conflictInfo.message : '確認送出申請'}
                >
                  {isSubmitting ? '送出中...' : conflictInfo.hasConflict ? '時段衝突無法預約' : '確認送出申請'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // ============================================================
    // 7. 機台圖卡 (MachineCard) - 精簡版純圖卡，點擊進入詳情
    // ============================================================
    function MachineCard({ machine, onSelect }) {
      const { systemSettings } = useApp();

      let bgClass = 'status-idle';
      let badge = '🟢 空閒';
      let hex = '#E8F5E9';

      if (machine.status === '使用中') {
        bgClass = 'status-busy';
        badge = '🔴 使用中';
        hex = '#FFEBEE';
      } else if (machine.status === '等待報到') {
        bgClass = 'status-waiting';
        badge = '🟡 等候報到';
        hex = '#FFF8E1';
      }

      // 判斷是否在課程進行中（開放現場排隊階段）
      const bookingPhase = getCurrentBookingPhase(systemSettings);
      const isCourseActive = bookingPhase.phase === 'QUEUE_ONLY';

      // 只有在課程進行中，且確實有目前使用或下一位時才顯示該文字資訊
      const hasUsageInfo = isCourseActive && Boolean(machine.currentUserName || machine.nextUserName);

      return (
        <div
          className={`p-4 sm:p-5 rounded-2xl shadow-xs border flex flex-col justify-between transition-all hover:shadow-md active:scale-[0.98] cursor-pointer ${bgClass}`}
          style={{ backgroundColor: hex }}
          onClick={() => onSelect(machine)}
        >
          {/* 頂部機台名稱與緊鄰的狀態標籤 */}
          <div>
            <div className="flex items-center gap-2 flex-wrap">
              <h3 className="text-xl font-bold text-slate-900 leading-snug">{machine.name}</h3>
              <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white/90 border border-slate-200/80 shadow-2xs shrink-0">
                {badge}
              </span>
            </div>
            <p className="text-xs font-semibold text-slate-500 mt-0.5">工廠機台</p>
          </div>

          {/* 目前使用者與下一位：僅在課程進行中且有資料時才顯示 */}
          {hasUsageInfo && (
            <div className="pt-2.5 mt-2.5 border-t border-black/5">
              <p className="text-xs font-medium text-slate-600">
                目前使用：<span className="font-bold text-slate-800">{machine.currentUserName || '—'}</span>
                {' '}／{' '}
                下一位：<span className="font-bold text-slate-800">{machine.nextUserName || '—'}</span>
              </p>
            </div>
          )}

          {/* 卡片右下角：固定顯示「點擊查看詳情與預約」 */}
          <div className={`flex justify-end ${hasUsageInfo ? 'mt-2' : 'mt-2.5'}`}>
            <span className="text-[11px] text-slate-500 font-semibold flex items-center gap-1">

            </span>
