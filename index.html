    function TvDisplayView({ onExit }) {
      const { machines, reservations, isCoursePaused } = useApp();
      const [now, setNow] = useState(() => new Date());
      const [scale, setScale] = useState(1);
      const [pageIndex, setPageIndex] = useState(0);
      const [isControlsVisible, setIsControlsVisible] = useState(true);
      const hideControlsTimerRef = useRef(null);

      // 即時時鐘
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // 依視窗大小等比縮放畫布（保持 16:9 不變形）
      useEffect(() => {
        const fit = () => setScale(Math.min(window.innerWidth / TV_CANVAS_WIDTH, window.innerHeight / TV_CANVAS_HEIGHT));
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      const handleExit = useCallback(() => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        onExit();
      }, [onExit]);

      const toggleFullscreen = () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        } else if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      };

      // 退出路徑 1：鍵盤 Esc
      useEffect(() => {
        const onKeyDown = (e) => { if (e.key === 'Escape') handleExit(); };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [handleExit]);

      // NOTE: 控制列平時隱藏以免干擾電視畫面，滑鼠移動 / 觸控時浮現 3 秒
      const revealControls = useCallback(() => {
        setIsControlsVisible(true);
        clearTimeout(hideControlsTimerRef.current);
        hideControlsTimerRef.current = setTimeout(() => setIsControlsVisible(false), 3000);
      }, []);
      useEffect(() => {
        revealControls();
        return () => clearTimeout(hideControlsTimerRef.current);
      }, [revealControls]);

      // 各機台卡片資料
      const cards = useMemo(() => {
        return arrangeTvMachines(machines).map(({ machine, parsed, col, row }) => {
          const inUse = reservations.find(r => r.machineId === machine.id && r.status === '使用中');
          const upcoming = reservations
            .filter(r => r.machineId === machine.id && TV_UPCOMING_STATUSES.includes(r.status))
            .sort((a, b) => a.startMinutes - b.startMinutes);

          const statusKey = inUse ? 'busy' : machine.status === '等待報到' ? 'waiting' : 'idle';
          const title = inUse ? (inUse.students || []).join('、') : statusKey === 'waiting' ? '等待中' : '空閒中';
          const timeText = inUse ? `${inUse.startTimeFormatted}-${inUse.endTimeFormatted}` : '';
          const isMultiple = Boolean(inUse && ((inUse.students || []).length >= 2 || (inUse.students || []).join('、').includes('、')));

          return {
            id: machine.id, col, row, statusKey, title, timeText, isMultiple,
            base: parsed.base, tag: parsed.tag,
            rows: upcoming.slice(0, 2).map(r => ({
              timeText: `${r.startTimeFormatted}-${r.endTimeFormatted}`,
              names: (r.students || []).join('、'),
              isMultiple: (r.students || []).length >= 2 || (r.students || []).join('、').includes('、'),
              typeLabel: r.type === '時段預約' ? '預約' : '排隊'
            }))
          };
        });
      }, [machines, reservations]);

      // 右側「請盡速報到」清單：已被叫號、等待報到的同學
      const callList = useMemo(() => {
        return reservations
          .filter(r => r.status === '等候報到')
          .sort((a, b) => a.startMinutes - b.startMinutes)
          .map(r => {
            const machine = machines.find(m => m.id === r.machineId);
            const parsed = parseTvMachineName(machine ? machine.name : r.machineName);
            const studentCount = (r.students || []).length;
            const isMultiple = studentCount >= 2 || (r.students || []).join('、').includes('、');
            return {
              id: r.id,
              names: (r.students || []).join('、'),
              isMultiple,
              timeText: `${r.startTimeFormatted}-${r.endTimeFormatted}`,
              typeLabel: r.type === '時段預約' ? '預約' : '排隊',
              tag: parsed.tag,
              base: parsed.base
            };
          });
      }, [machines, reservations]);

      const pageCount = Math.max(1, Math.ceil(callList.length / TV_QUEUE_PAGE_SIZE));
      const currentPage = Math.min(pageIndex, pageCount - 1);

      // 超過一頁時自動輪播
      useEffect(() => {
        if (pageCount <= 1) { setPageIndex(0); return undefined; }
        const timer = setInterval(() => setPageIndex(p => (p + 1) % pageCount), TV_QUEUE_ROTATE_MS);
        return () => clearInterval(timer);
      }, [pageCount]);

      const pageItems = callList.slice(currentPage * TV_QUEUE_PAGE_SIZE, (currentPage + 1) * TV_QUEUE_PAGE_SIZE);

      const pad = (n) => String(n).padStart(2, '0');
      const clockText = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const dateText = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} 星期${'日一二三四五六'[now.getDay()]}`;

      const legendItems = [
        { color: TV_THEME.waiting.dot, text: '機台等待中，請盡速至機台進行報到' },
        { color: TV_THEME.busy.dot, text: '機台使用中' },
        { color: TV_THEME.idle.dot, text: '機台空閒中，尚無人預約/排隊' }
      ];

      const controlButtonStyle = {
        padding: '10px 18px', borderRadius: 12, border: '1px solid rgba(255,255,255,0.4)',
        background: 'rgba(15,23,42,0.85)', color: '#fff', fontSize: 16, fontWeight: 700, cursor: 'pointer'
      };

      return (
        <div
          onPointerMove={revealControls}
          onPointerDown={revealControls}
          style={{ position: 'fixed', inset: 0, background: '#E6E6E6', overflow: 'hidden', zIndex: 50 }}
        >
          {/* 退出 / 全螢幕控制列 */}
          <div
            style={{
              position: 'fixed', top: 14, right: 14, zIndex: 60, display: 'flex', gap: 10,
              opacity: isControlsVisible ? 1 : 0, pointerEvents: isControlsVisible ? 'auto' : 'none',
              transition: 'opacity 0.3s'
            }}
          >
            <button type="button" onClick={toggleFullscreen} style={controlButtonStyle}>⛶ 全螢幕</button>
            <button type="button" onClick={handleExit} style={{ ...controlButtonStyle, background: 'rgba(185,28,28,0.92)' }}>✕ 退出看板</button>
          </div>

          <div
            style={{
              position: 'absolute', left: '50%', top: '50%',
              width: TV_CANVAS_WIDTH, height: TV_CANVAS_HEIGHT,
              transform: `translate(-50%, -50%) scale(${scale})`, transformOrigin: 'center center',
              padding: '36px 40px', boxSizing: 'border-box',
              fontFamily: "'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif", color: '#111'
            }}
          >
            <div
              style={{
                display: 'grid', width: '100%', height: '100%', gap: 16,
                gridTemplateColumns: 'repeat(4, minmax(0, 1fr))', gridTemplateRows: 'repeat(5, minmax(0, 1fr))'
              }}
            >
              {cards.map(card => <TvMachineCard key={card.id} card={card} />)}

              {/* 右下區塊：報到提醒清單 + 圖例 + 時鐘 */}
              <div style={{ gridColumn: '3 / 5', gridRow: '3 / 6', display: 'flex', flexDirection: 'column', gap: 12, minWidth: 0, minHeight: 0, overflow: 'hidden' }}>
                <div style={{ textAlign: 'center', fontSize: 22, fontWeight: 600, color: '#333' }}>
                  ！以下同學請盡速至機台進行報到，逾時將自動順延至下一位！
                </div>

                <div style={{ flex: 1, minHeight: 0, background: '#F4F4F4', borderRadius: 28, padding: '16px 22px', display: 'flex', flexDirection: 'column', gap: 8, boxShadow: '0 2px 6px rgba(0,0,0,0.08)' }}>
                  {pageItems.length === 0 && (
                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 30, fontWeight: 600, color: '#9a9a9a' }}>
                      目前沒有需要報到的同學
                    </div>
                  )}
                  {pageItems.map(item => (
                    <div
                      key={item.id}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 16, height: 60, flexShrink: 0,
                        background: '#fff', border: '2px solid #666', borderRadius: 30, overflow: 'hidden', paddingRight: 20
                      }}
                    >
                      <span
                        style={{
                          alignSelf: 'stretch', width: 36, background: '#666', color: '#fff', fontSize: 14, fontWeight: 700,
                          writingMode: 'vertical-rl', textOrientation: 'upright', letterSpacing: 2,
                          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0
                        }}
                      >
                        {item.typeLabel}
                      </span>
                      <TvMarqueeText
                        text={item.names}
                        forceMarquee={item.isMultiple}
                        style={{
                          fontSize: 36,
                          fontWeight: 800,
                          color: '#111',
                          width: 250,
                          minWidth: 250,
                          maxWidth: 250,
                          flexShrink: 0
                        }}
                      />
                      <span style={{ fontSize: 32, fontWeight: 700, whiteSpace: 'nowrap', flexShrink: 0 }}>{item.timeText}</span>
                      <span style={{ flex: 1, height: 2, background: '#8a8a8a', minWidth: 20 }} />
                      {item.tag && (
                        <span style={{ background: '#777', color: '#fff', fontSize: 16, fontWeight: 700, padding: '3px 14px', borderRadius: 999, whiteSpace: 'nowrap' }}>
                          {item.tag}
                        </span>
                      )}
                      <span style={{ fontSize: 36, fontWeight: 500, whiteSpace: 'nowrap' }}>{item.base}</span>
                    </div>
                  ))}
                </div>

                {/* 頁碼圓點 */}
                <div style={{ display: 'flex', justifyContent: 'center', gap: 10, height: 14 }}>
                  {Array.from({ length: Math.max(pageCount, 1) }).map((_, i) => (
                    <span
                      key={i}
                      style={{
                        width: 14, height: 14, borderRadius: '50%', boxSizing: 'border-box',
                        background: i === currentPage ? '#777' : 'transparent', border: '2px solid #777'
                      }}
                    />
                  ))}
                </div>

                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 130 }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {legendItems.map(item => (
                      <div key={item.text} style={{ display: 'flex', alignItems: 'center', gap: 12, fontSize: 22, fontWeight: 500, color: '#222' }}>
                        <span style={{ width: 24, height: 24, borderRadius: '50%', background: item.color, flexShrink: 0 }} />
                        {item.text}
                      </div>
                    ))}
                  </div>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 104, fontWeight: 800, lineHeight: 1, letterSpacing: 2, fontVariantNumeric: 'tabular-nums' }}>{clockText}</div>
                    <div style={{ fontSize: 32, fontWeight: 800, marginTop: 6 }}>{dateText}</div>
                  </div>
                </div>
              </div>
            </div>

            {/* 課程暫停時：電視版暫停畫面蓋在看板上方（退出看板按鈕 z-index 更高，仍可操作） */}
            {isCoursePaused && <CoursePauseOverlay variant="tv" />}
          </div>
        </div>
      );
    }

    function MainLayout() {
      const { 
        machines, 
        activeTab, 
        setActiveTab, 
        activeUser, 
        isLoggedIn, 
        logout, 
        refreshData, 
        isCoursePaused, 
        coursePausedAt,
        reservations,
        acceptEarlyStart,
        declineEarlyStart
      } = useApp();
      const [isResModalOpen, setIsResModalOpen] = useState(false);
      const [selectedMacId, setSelectedMacId] = useState(null);
      // NOTE: 機台詳情頁切換狀態 —— null 代表列表，有值代表詳情頁
      const [selectedMachine, setSelectedMachine] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);
      // NOTE: 電視看板模式 —— 開啟後以全畫面覆蓋手機版面，退出後回到原本管理頁
      const [isTvMode, setIsTvMode] = useState(false);
      // NOTE: 老師/助教可暫時關閉手機上的暫停畫面以操作控制介面；
      //       以「暫停開始時間」為鍵，下一次新的暫停會再次顯示。學生無法關閉。
      const [dismissedPauseKey, setDismissedPauseKey] = useState(null);

      // 動態取得最新的機台資料（避免在詳情頁時保留舊 snapshot）
      const currentSelectedMachine = selectedMachine 
        ? (machines.find(m => m.id === selectedMachine.id) || selectedMachine) 
        : null;

      // 手動點擊刷新資料（帶有平滑旋轉動畫與強制重新整理）
      const handleManualRefresh = async () => {
        if (isRefreshing) return;
        setIsRefreshing(true);
        try {
          await refreshData();
        } catch (err) {
          console.error('Manual refresh error:', err);
        } finally {
          setTimeout(() => {
            setIsRefreshing(false);
          }, 600);
        }
      };

      // NOTE: 檢查目前登入者是否為老師 / 助教 / 管理員 (例如 supersamuel0106@gmail.com)
      const isAdmin = isTeacherOrTA(activeUser);

      // 檢查目前登入者是否有收到「提早使用詢問」的預約 (包含個人或小組成員)
      const earlyOfferRes = (reservations || []).find(r => 
        r.status === '等候提前確認' && 
        (r.email === activeUser?.mail || (r.students || []).includes(activeUser?.name))
      );

      // 若非管理員且當前在管理頁面，自動切回機台列表
      useEffect(() => {
        if (!isAdmin && (activeTab === 'courses' || activeTab === 'settings')) {
          setActiveTab('machines');
        }
      }, [isAdmin, activeTab, setActiveTab]);

      const openModal = (id) => {
        setSelectedMacId(id || null);
        setIsResModalOpen(true);
      };

      // 點擊機台圖卡進入詳情
      const handleSelectMachine = (machine) => {
        setSelectedMachine(machine);
      };

      // 返回機台列表
      const handleBackToList = () => {
        setSelectedMachine(null);
      };

      // 切換 Tab 時同時清除機台詳情選取
      const handleSetActiveTab = (tab) => {
        setSelectedMachine(null);
        setActiveTab(tab);
      };

      if (!isLoggedIn) {
        return <LoginView />;
      }

      // 電視看板（僅管理者可進入；非管理者即使狀態被改動也不顯示）
      if (isTvMode && isAdmin) {
        return <TvDisplayView onExit={() => setIsTvMode(false)} />;
      }

      // 目前頁面標題
      const getTitle = () => {
        if (activeTab === 'machines') {
          return ''; // 機台列表與機台詳情頁面不顯示重複標題
        }
        if (activeTab === 'reservations') return '我的預約';
        if (activeTab === 'courses') return '課程場次';
        if (activeTab === 'settings') return '預約設定';
        return '';
      };

      const currentPauseKey = coursePausedAt || 'local';
      const showPauseOverlay = isCoursePaused && !(isAdmin && dismissedPauseKey === currentPauseKey);

      return (
        <div className="min-h-screen bg-slate-900 py-0 sm:py-6 flex flex-col items-center justify-center">
          <div className="w-full max-w-sm sm:max-w-md h-screen sm:h-[840px] bg-slate-50 sm:rounded-[44px] sm:border-[10px] sm:border-slate-800 shadow-2xl overflow-hidden flex flex-col relative">
            {/* 課程暫停：手機版「集合講課中」全屏畫面，學生不可關閉 */}
            {showPauseOverlay && (
              <CoursePauseOverlay
                variant="mobile"
                onDismiss={isAdmin ? () => setDismissedPauseKey(currentPauseKey) : undefined}
              />
            )}
            {/* 手機 App Header */}
            <div className="bg-white px-3.5 py-2.5 border-b border-slate-200 flex items-center justify-between shadow-2xs relative z-10">
              <div className="flex items-center gap-2 min-w-0 flex-1">
                {/* 登出按鈕：醒目圖標 (依使用者指定之出門/登出向量 Icon) */}
                <button
                  onClick={logout}
                  className="p-1.5 text-slate-700 hover:text-red-600 bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-200 rounded-xl transition-all shadow-2xs active:scale-95 cursor-pointer shrink-0"
                  title="登出並返回驗證介面"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M9 21H15C17.2091 21 19 19.2091 19 17V7C19 4.79086 17.2091 3 15 3H9" />
                    <polyline points="7 16 3 12 7 8" />
                    <line x1="3" y1="12" x2="15" y2="12" />
                  </svg>
                </button>

                {/* 個人資訊顯示：維持在一行不換行 */}
                <div className="min-w-0 flex-1 overflow-hidden">
                  {getTitle() ? (
                    <div className="flex items-center gap-1.5 whitespace-nowrap overflow-hidden">
                      <span className="font-bold text-sm text-slate-900 shrink-0">
                        {getTitle()}
                      </span>
                      <span className="text-[11px] text-slate-500 font-medium truncate" title={`${activeUser.name} (${activeUser.mail})`}>
                        👤 {activeUser.name}
                      </span>
                      <span className="shrink-0 text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium">
                        {isAdmin ? '👑 老師/助教' : '🎓 學生'}
                      </span>
                    </div>
                  ) : (
                    <div className="text-xs text-slate-700 font-semibold whitespace-nowrap overflow-hidden text-ellipsis flex items-center gap-1.5">
                      <span className="shrink-0">👤 {activeUser.name}</span>
                      <span className="shrink-0 text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium">
                        {isAdmin ? '👑 老師/助教' : '🎓 學生'}
                      </span>
                      <span className="text-slate-400 text-[11px] truncate hidden sm:inline" title={activeUser.mail}>({activeUser.mail})</span>
                    </div>
                  )}
                </div>
              </div>

              {/* 右側操作按鈕：學生操作指引 + 重新整理按鈕 */}
              <div className="flex items-center gap-1.5 shrink-0 ml-2">
                <a
                  href="https://workshop-app-guide-hn.aj115-0827.chatgpt.site/"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="p-1.5 text-slate-700 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 rounded-xl transition-all shadow-2xs active:scale-95 cursor-pointer flex items-center justify-center"
                  title="開啟操作指引"
                >
                  <span className="text-sm leading-none">📖</span>
                </a>

                <button
                  onClick={handleManualRefresh}
                  disabled={isRefreshing}
                  className="p-1.5 text-slate-700 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 rounded-xl transition-all shadow-2xs active:scale-95 cursor-pointer disabled:opacity-80"
                  title="重新整理資料"
                >
                  <svg
                    className={`w-5 h-5 transition-transform duration-500 ${isRefreshing ? 'animate-spin text-blue-600' : 'hover:rotate-180'}`}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.4"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="M21 2v6h-6" />
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                    <path d="M3 22v-6h6" />
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                  </svg>
                </button>
              </div>
            </div>

            {/* NOTE: 提前使用詢問全域頂部互動 Banner (App 最上方跳出通知問他是否需要提前) */}
            {earlyOfferRes && (
              <EarlyOfferBanner
                reservation={earlyOfferRes}
                onAccept={() => acceptEarlyStart(earlyOfferRes.id)}
                onDecline={() => declineEarlyStart(earlyOfferRes.id)}
              />
            )}

            {/* NOTE: 課程暫停全域醒目廣播 Banner (對所有頁面與所有師生可見) */}
            {isCoursePaused && (
              <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-4 py-2.5 flex items-center justify-between text-xs font-bold shadow-md z-20 select-none">
                <div className="flex items-center gap-2">
                  <span className="text-base animate-bounce">⏸️</span>
                  <div>
                    <div>【老師講解示範中】課程暫停</div>
                    <div className="text-[10px] font-normal opacity-90">所有機台暫停使用，時段將於講解後自動順延</div>
                  </div>
                </div>
              </div>
            )}

            {/* 內容區 */}
            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-100/70">
              {activeTab === 'machines' && (
                currentSelectedMachine ? (
                  // 機台詳情頁
                  <MachineDetailView
                    machine={currentSelectedMachine}
                    onBack={handleBackToList}
                    onOpenReservationModal={(id) => {
                      openModal(id);
                    }}
                  />
                ) : (
                  // 機台列表
                  <div className="space-y-3">
                    {machines.map(m => (
                      <MachineCard key={m.id} machine={m} onSelect={handleSelectMachine} />
                    ))}
                  </div>
                )
              )}
              {activeTab === 'reservations' && <MyReservationsView />}
              {isAdmin && activeTab === 'courses' && (
                <CourseSessionsView onOpenReservationModal={(id) => openModal(id)} onOpenTvDisplay={() => setIsTvMode(true)} />
              )}
              {isAdmin && activeTab === 'settings' && <BookingSettingsView />}
            </div>

            {/* 底部導覽列 (依權限動態顯示) */}
            <div className="h-16 bg-white border-t border-slate-200 flex items-center justify-around z-20 select-none shadow-lg">
              {[
                { id: 'machines', label: '機台列表', icon: '🪚' },
                { id: 'reservations', label: '我的預約', icon: '📋' },
                ...(isAdmin ? [
                  { id: 'courses', label: '課程場次', icon: '📚' },
                  { id: 'settings', label: '預約設定', icon: '⚙️' }
                ] : [])
              ].map(t => {
                const active = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => handleSetActiveTab(t.id)}
                    className={`flex-1 h-full flex flex-col items-center justify-center gap-1 relative ${active ? 'text-blue-600 font-bold' : 'text-slate-500'}`}
                  >
                    <span className="text-lg">{t.icon}</span>
                    <span className="text-[11px] leading-none">{t.label}</span>
                    {active && <span className="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 bg-blue-600 rounded-t-full" />}
                  </button>
                );
              })}
            </div>
          </div>

          {isResModalOpen && (
            <ReservationModal initialMachineId={selectedMacId} onClose={() => setIsResModalOpen(false)} />
          )}
        </div>
      );
    }

    function App() {
      return (
        <AppProvider>
          <MainLayout />
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
